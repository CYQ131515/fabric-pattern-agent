<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PatternFlow 管理后台 v0.1 — 给运营自己用</title>
<style>
:root{
  --ink:#211E1B; --ink-2:#3A342E; --ink-3:#6B635A; --ink-4:#9A9188;
  --line:#E4DED6; --line-2:#EFEAE3; --paper:#F6F3EE; --card:#FFFFFF;
  --accent:#C1553A; --accent-soft:#F6E7E2;
  --jade:#3F6B5C; --jade-soft:#E4EDE9;
  --gold:#B58A2B; --gold-soft:#F6EFDD;
  --blue:#3B5D8F; --blue-soft:#E6EDF7;
  --rail:#F1EEE9; --rail-hover:#E7E2D9; --rail-on:#DFD8CD; --stage:#EAE5DE;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --sh-1:0 1px 2px rgba(33,30,27,.06), 0 1px 1px rgba(33,30,27,.04);
  --sh-2:0 6px 18px rgba(33,30,27,.08), 0 2px 6px rgba(33,30,27,.04);
  --sh-3:0 22px 48px rgba(33,30,27,.2), 0 6px 16px rgba(33,30,27,.08);
  --fs:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--fs);line-height:1.62;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#CFC8BE;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#BDB5AA}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 骨架 ---------- */
#app{display:flex;height:100vh;overflow:hidden}
.rail{width:220px;flex:0 0 220px;background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
.rail-head{padding:14px 14px 10px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{width:28px;height:28px;border-radius:8px;flex:0 0 28px;
  background:conic-gradient(from 210deg,#C1553A,#B58A2B,#3F6B5C,#C1553A);position:relative;overflow:hidden}
.brand .mark::after{content:"";position:absolute;inset:6.5px;border-radius:3.5px;background:var(--rail)}
.brand .tx b{display:block;font-size:13px;line-height:1.3}
.brand .tx span{display:block;font-size:10px;color:var(--ink-4);letter-spacing:.4px}
.rail-scroll{flex:1;overflow-y:auto;padding:8px 8px 12px;min-height:0}
.nav-label{font-size:10.5px;color:var(--ink-4);padding:12px 8px 5px;letter-spacing:1px;font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 9px;
  border-radius:9px;transition:background .14s}
.nav:hover{background:var(--rail-hover)}
.nav[aria-current="true"]{background:var(--rail-on);font-weight:600}
.nav .ico{width:18px;text-align:center;color:var(--ink-3);font-size:13px;flex:0 0 18px}
.nav .n{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:10.5px;color:var(--ink-4);flex:0 0 auto}
.rail-foot{padding:10px 12px 12px;border-top:1px solid var(--line);background:#EDE8E1;font-size:11px;color:var(--ink-3)}
.rail-foot .st{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rail-foot .dot{width:7px;height:7px;border-radius:50%;background:#C9C2B8;flex:0 0 7px}
.rail-foot .dot.on{background:var(--jade)}
.rail-foot .dot.off{background:var(--accent)}

.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--stage)}
.stage-head{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:rgba(241,238,233,.94);border-bottom:1px solid var(--line);z-index:2}
.stage-head .tt b{display:block;font-size:14.5px;font-weight:650;line-height:1.3}
.stage-head .tt span{display:block;font-size:11.5px;color:var(--ink-4)}
.stage-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.page-scroll{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:1080px;margin:0 auto;padding:16px 20px 40px}

/* ---------- 通用件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-1)}
.card-pad{padding:16px}
.card + .card{margin-top:12px}
.card.mt{margin-top:12px}
h3{margin:0;font-size:13.5px;font-weight:650}
.sect-title{display:flex;align-items:baseline;gap:10px;margin:18px 2px 9px}
.sect-title h3{font-size:13.5px}
.sect-title .hint{font-size:11.5px;color:var(--ink-4)}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.tiny{font-size:11px;color:var(--ink-4)}
.btn{padding:7px 14px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;
  font-weight:600;transition:.16s}
.btn:hover{background:#000}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink-4);background:#FCFAF7}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.danger{background:#fff;color:var(--accent);border:1px solid #E7D3CC}
.btn.danger:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip-btn{padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:12px;color:var(--ink-2);transition:.16s}
.chip-btn:hover{border-color:var(--ink-4)}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;padding:1.5px 8px;border-radius:20px;font-size:11px;
  background:var(--line-2);color:var(--ink-3);margin:0 5px 5px 0}
.tag.j{background:var(--jade-soft);color:var(--jade)}
.tag.g{background:var(--gold-soft);color:#7A5C12}
.tag.b{background:var(--blue-soft);color:var(--blue)}
.tag.r{background:var(--accent-soft);color:var(--accent)}
.kpi{display:flex;flex-direction:column;min-width:78px}
.kpi b{font-size:21px;font-weight:660;line-height:1.2;letter-spacing:.3px}
.kpi span{font-size:11px;color:var(--ink-4)}
.empty{padding:34px;text-align:center;color:var(--ink-4)}
.empty .big{font-size:26px;opacity:.5;margin-bottom:6px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:4px;font-weight:600}
.fld input,.fld textarea,.fld select{width:100%;padding:7px 10px;border:1px solid var(--line);
  border-radius:8px;background:#fff;font-size:13px;outline:none;transition:.14s}
.fld input:focus,.fld textarea:focus{border-color:var(--ink-4);box-shadow:0 0 0 3px rgba(33,30,27,.05)}
.fld textarea{resize:vertical;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.fld .tip{font-size:11px;color:var(--ink-4);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.rowline{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.note{background:var(--gold-soft);border:1px solid #EBDCB6;color:#7A5C12;
  padding:9px 12px;border-radius:8px;font-size:12px;line-height:1.6}
.note.b{background:var(--blue-soft);border-color:#CFDCEF;color:#2C4A73}
.note.r{background:var(--accent-soft);border-color:#E7D3CC;color:#8E3A24}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;color:var(--ink-4);font-weight:600;
  padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.ta-r{text-align:right}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}

/* ---------- 模型与密钥：按机器人分组 ---------- */
.rolehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rolehead b{font-size:14.5px;font-weight:680}
.rolehead .k{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:600;
  background:var(--gold-soft);color:#7A5C12}
.rolehead.g .k{background:var(--jade-soft);color:var(--jade)}
.rolehead.r .k{background:var(--accent-soft);color:var(--accent)}
.grp{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}
.grp-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp-h b{font-size:13px;font-weight:660}
.grp-h .k{font-size:10.5px;padding:1.5px 8px;border-radius:20px;font-weight:600;
  background:var(--line-2);color:var(--ink-3)}
.mrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}

/* ---------- 概览 ---------- */
.kpis{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;align-items:flex-start}
.check:last-child{border-bottom:none}
.check .mk{flex:0 0 16px;font-size:13px;line-height:1.5}
.kpi .of{font-size:12px;font-weight:600;color:var(--ink-4)}
.apigrp{font-size:10.5px;color:var(--ink-4);letter-spacing:1px;font-weight:600;
  margin:12px 0 2px;padding-top:9px;border-top:1px dashed var(--line)}
.apigrp:first-child{margin-top:0;padding-top:0;border-top:none}

/* ---------- 数据看板 ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-top:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.grid2 > .card + .card,.grid4 > .card + .card{margin-top:0}
.dimh{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.bars{display:flex;flex-direction:column;gap:5px}
.brow{display:grid;grid-template-columns:82px 1fr 46px;gap:8px;align-items:center;font-size:12px}
.bars.compact .brow{grid-template-columns:62px 1fr 28px;gap:6px;font-size:11.5px}
.brow .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.brow .bt{background:var(--line-2);border-radius:4px;height:9px;overflow:hidden}
.brow .bt i{display:block;height:100%;background:var(--blue);border-radius:4px}
.brow .bv{text-align:right;color:var(--ink-3);font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:2px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11.5px;
  padding:5px 8px 5px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:5px 8px 5px 0;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.tbl tr:last-child td{border-bottom:none}
.tbl th.n,.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl .hi{color:var(--accent);font-weight:600}
.tbl .good{color:var(--jade);font-weight:600}
/* 会话表的 ID 列别贴边（.tbl 的 td 左边距是 0，第一列会顶着卡片边缘） */
.tbl.sess th:first-child,.tbl.sess td:first-child{padding-left:20px}
.tbl.sess td:first-child{white-space:nowrap}
/* 会话页的筛选条 */
.sfilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sfilter input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:12.5px;color:var(--ink);outline:none;transition:.14s}
.sfilter input:focus{border-color:var(--ink-4);box-shadow:0 0 0 3px rgba(33,30,27,.05)}
.sfilter .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin:9px 0}
.legend.col{flex-direction:column;gap:6px;margin:0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 9px}
.legend b{color:var(--ink)}
.trend{width:100%;height:auto;display:block;margin-top:6px}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:140px;height:140px;flex:0 0 140px}

/* ---------- 人设 ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}

/* ---------- 知识库 ---------- */
.kb-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){ .kb-cols{grid-template-columns:1fr} .two,.three{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr} .grid4{grid-template-columns:1fr 1fr} }
.docs .it{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2)}
.docs .it:last-child{border-bottom:none}
.docs .it .t{flex:1;min-width:0}
.docs .it .t b{display:block;font-size:12.5px}
.qarow{display:grid;grid-template-columns:1fr 1.4fr auto;gap:9px;padding:7px 0;
  border-bottom:1px solid var(--line-2);align-items:start}
.qarow:last-child{border-bottom:none}
.qarow input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.resultbox{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#FCFAF7}
.resultbox pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:11.5px;line-height:1.65;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:260px;overflow:auto}

/* ---------- 花型库 ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
.lib-card{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);
  overflow:hidden;text-align:left;transition:.16s;padding:0}
.lib-card:hover{box-shadow:var(--sh-2);border-color:var(--ink-4)}
.lib-card .ph{display:block;position:relative;aspect-ratio:1/1;background:var(--line-2);overflow:hidden}
.lib-card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.lib-card .ph .warn{position:absolute;left:5px;top:5px;background:var(--gold);color:#fff;
  font-size:10px;padding:1px 6px;border-radius:10px}
.lib-card .body{display:block;padding:7px 9px 9px}
.lib-card .nm{display:flex;gap:6px;align-items:baseline}
.lib-card .nm b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lib-card .nm span{font-size:10.5px;color:var(--ink-4);flex:0 0 auto}
.lib-card .tg{display:block;margin-top:4px}
.lib-card .tg i{font-style:normal;display:inline-block;padding:1px 6px;border-radius:10px;
  font-size:10px;background:var(--line-2);color:var(--ink-3);margin:0 4px 3px 0}
.lib-card .tg i.j{background:var(--jade-soft);color:var(--jade)}
.lib-card .tg i.g{background:var(--gold-soft);color:#7A5C12}
.lib-card .tg i.b{background:var(--blue-soft);color:var(--blue)}
.lib-search{position:relative;flex:1;min-width:220px}
.lib-search input{width:100%;padding:8px 11px 8px 32px;border:1px solid var(--line);
  border-radius:9px;background:#fff;font-size:13px;outline:none}
.lib-search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-4);display:flex}
.lib-filters{margin-top:12px}
.lib-dim{display:flex;gap:9px;padding:5px 0;align-items:flex-start}
.lib-dim .k{flex:0 0 42px;font-size:11.5px;color:var(--ink-4);padding-top:4px}
.lib-dim .chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.lib-chip{padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:11.5px;color:var(--ink-3);transition:.14s}
.lib-chip:hover{border-color:var(--ink-4)}
.lib-chip b{font-weight:400;color:var(--ink-4);margin-left:3px;font-size:10.5px}
.lib-chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lib-chip[aria-pressed="true"] b{color:rgba(255,255,255,.7)}
.libx{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){ .libx{grid-template-columns:1fr} }
.bar{height:7px;border-radius:6px;background:var(--line-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--jade);transition:width .3s}

/* ---------- 弹层 ---------- */
#layer{position:fixed;inset:0;z-index:60;display:none}
#layer.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(33,30,27,.42)}
.modal-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.modal{background:#fff;border-radius:var(--r-l);box-shadow:var(--sh-3);width:100%;max-width:640px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:940px}
.mh{padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.mh h3{font-size:15px}
.mh p{margin:3px 0 0;font-size:11.5px;color:var(--ink-4)}
.mb{padding:16px 18px;overflow-y:auto;flex:1;min-height:0}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#FCFAF7}

/* ---------- toast ---------- */
#toastbox{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;
  box-shadow:var(--sh-2);max-width:78vw}
.toast.warn{background:var(--accent)}

/* ---------- 登录门 ---------- */
#authmask{position:fixed;inset:0;z-index:120;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:340px;box-shadow:var(--sh-2)}
.auth-card h3{font-size:15px;margin:0}
.err{color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="brand">
        <div class="mark"></div>
        <div class="tx"><b>PatternFlow</b><span>管理后台 v0.1</span></div>
      </div>
    </div>
    <div class="rail-scroll" id="nav"></div>
    <div class="rail-foot">
      <div class="st"><i class="dot" id="dot"></i><span id="sttxt">正在连接…</span></div>
      <div class="tiny" id="stmodel"></div>
    </div>
  </aside>
  <main class="stage">
    <div class="stage-head">
      <div class="tt"><b id="pttl">概览</b><span id="psub"></span></div>
      <div class="right" id="pact"></div>
    </div>
    <div class="page-scroll"><div class="wrap" id="body"></div></div>
  </main>
</div>
<div id="layer"></div>
<div id="toastbox"></div>
<div id="authmask" style="display:none"></div>

<script>
/* =========================================================================
   PatternFlow 管理后台（B 端）
   -------------------------------------------------------------------------
   和 C 端原型（v0.7）是两份独立的 HTML、两个独立的进程：
   - C 端（server.py，8787）给用户，只有对话，看不到花型库；
   - 这份连的是后台服务（admin_server.py，8788），管密钥、人设、知识库、图库。

   服务地址自动探测：先试同源，再试 8788、再试 8787。
   认端口还不够 —— 8787 上也可能回 ok，但它没有后台接口，
   所以认 /api/health 里的 who==='admin' 才算连对了。
   ========================================================================= */
var API = '';
var ONLINE = false;
var CANDIDATES = [];
(function(){
  if (location.protocol === 'http:' || location.protocol === 'https:') CANDIDATES.push(location.origin);
  CANDIDATES.push('http://127.0.0.1:8788');
  CANDIDATES.push('http://localhost:8788');
  CANDIDATES.push('http://127.0.0.1:8787');
  CANDIDATES.push('http://localhost:8787');
  var q = (location.search || '').replace(/^\?/, '');
  var m = /(?:^|&)api=([^&]+)/.exec(q);
  if (m) CANDIDATES.unshift(decodeURIComponent(m[1]));
})();

/* 登录状态：后台是要口令的，没登录就只显示登录框，别的都不渲染 */
var AUTH = {checked:false, has_password:true, authed:false, mode:'', busy:false, err:''};

var S = {
  page: 'overview',
  st: null,            // /api/admin/state
  personas: null,      // /api/admin/persona

/* ---------- 小工具 ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function toast(text, warn){
  var box = $('toastbox');
  if (!box) return;
  var el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = text;
  box.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
}
function later(fn, ms){ return setTimeout(fn, ms); }
function hasFetch(){ return typeof fetch === 'function'; }
function apiGet(path, cb){
  if (!hasFetch() || !API){ cb(false, null); return; }
  fetch(API + path, {credentials:'same-origin'}).then(function(r){ return r.json(); })
    .then(function(d){ note(d); cb(true, d); }).catch(function(){ cb(false, null); });
}
function apiPost(path, body, cb){
  if (!hasFetch() || !API){ cb(false, null); return; }
  fetch(API + path, {method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {})})
    .then(function(r){ return r.json(); }).then(function(d){ note(d); cb(true, d); })
    .catch(function(){ cb(false, null); });
}
/* 任何接口回「请先登录」都统一弹登录框，不用每个页面各处理一遍 */
function note(d){
  if (d && d.need_auth && AUTH.authed){ AUTH.authed = false; paintAuth('login'); }
}
function absURL(u){ if (!u) return u; return (u.indexOf('http') === 0) ? u : (API + u); }

/* ---------- 启动：探测服务 ---------- */
function boot(){
  // 脚本一执行就会调 boot，测试环境可能还没有 fetch。
  // 不守卫会直接抛 ReferenceError，整个页面连兜底提示都渲染不出来。
  if (!hasFetch()){ onOffline(); return; }
  var i = 0, loose = null;
  (function next(){
    if (i >= CANDIDATES.length){
      // 没有明确标着 admin 的（比如跑的还是老版本服务）：退而求其次用第一个通的
      if (loose){ API = loose; ONLINE = true; onOnline(); }
      else onOffline();
      return;
    }
    var base = CANDIDATES[i++];
    fetch(base + '/api/health').then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok){
          if (d.who === 'admin'){ API = base; ONLINE = true; onOnline(); return; }
          if (!loose) loose = base;
        }
        next();
      }).catch(function(){ next(); });
  })();
}
function onOffline(){
  ONLINE = false;
  var dot = $('dot'); if (dot){ dot.className = 'dot off'; }
  var t = $('sttxt'); if (t) t.textContent = '服务没连上';
  $('body').innerHTML = '<div class="card card-pad" style="margin-top:12px">' +
    '<h3>连不上后台服务</h3>' +
    '<div class="small muted" style="margin-top:8px">后台是独立进程，要单独启动。' +
    '先去 <span class="mono">后台/</span> 目录跑 ' +

    '<span class="mono">启动后台.sh</span>，再回来刷新这一页。</div>' +
    '<div class="tiny" style="margin-top:8px">试过的地址：' +
      esc(CANDIDATES.join('、')) + '</div>' +

function checkAuth(){
  apiGet('/api/admin/session', function(ok, d){
    if (!ok){ paintAuth('login'); return; }
    AUTH.checked = true;
    AUTH.has_password = !(d && d.has_password === false);
    if (!AUTH.has_password){ paintAuth('set'); return; }
    // 有没有登录：拿一次 state，401 就是没登录
    apiGet('/api/admin/state', function(ok2, d2){
      if (ok2 && d2 && d2.ok){
        AUTH.authed = true; S.st = d2; syncModelLine();
        paintAuth(null); render();
      } else {
        AUTH.authed = false; paintAuth('login');
      }
    });
  });
}

function paintAuth(mode){
  var box = $('authmask');
  if (!box) return;
  AUTH.mode = mode || '';
  if (!mode){ box.style.display = 'none'; box.innerHTML = ''; return; }
  var isSet = (mode === 'set');
  box.style.display = '';
  box.innerHTML =
    '<div class="auth-card card card-pad">' +
    '<h3>' + (isSet ? '先给后台设个口令' : '管理后台') + '</h3>' +
    '<div class="small muted" style="margin-top:6px">' +
      (isSet ? '这个后台能改密钥、改人设、删图，设了口令之后进页面都要输。'
             : '输口令进后台。') + '</div>' +
    '<div class="fld" style="margin-top:14px"><label>口令</label>' +
      '<input id="authpw" type="password" autocomplete="current-password"' +
      ' placeholder="' + (isSet ? '至少 4 位' : '请输入口令') + '"></div>' +
    (isSet ? '<div class="fld"><label>再输一遍</label>' +
      '<input id="authpw2" type="password" autocomplete="new-password"></div>' : '') +
    '<div id="autherr" class="tiny err" style="min-height:16px;margin-top:6px"></div>' +
    '<div style="margin-top:10px"><button class="btn pri" id="authgo">' +
      (isSet ? '设置并进入' : '进入') + '</button></div>' +
    '<div class="tiny muted" style="margin-top:10px">' +
      (isSet ? '忘了只能去 config/secrets.json 里删掉 admin_password 那一行。' :
               '后台默认只监听 127.0.0.1，跟用户对话的服务是两个进程。') +
    '</div></div>';
  var inp = $('authpw'); if (inp) inp.focus();
  var go = $('authgo');
  if (go) go.onclick = doAuth;
  var pw = $('authpw');
  if (pw) pw.onkeydown = function(e){ if (e.key === 'Enter') doAuth(); };
  var pw2 = $('authpw2');
  if (pw2) pw2.onkeydown = function(e){ if (e.key === 'Enter') doAuth(); };
}
function doAuth(){
  if (AUTH.busy) return;
  var pw = $('authpw') ? $('authpw').value : '';
  var err = $('autherr');
  if (!pw){ if (err) err.textContent = '口令不能为空'; return; }
  if (AUTH.mode === 'set'){
    var pw2 = $('authpw2') ? $('authpw2').value : '';
    if (pw !== pw2){ if (err) err.textContent = '两次输的不一样'; return; }
    if (pw.length < 4){ if (err) err.textContent = '至少 4 位'; return; }
  }
  AUTH.busy = true;
  var path = (AUTH.mode === 'set') ? '/api/admin/set-password' : '/api/admin/login';
  apiPost(path, {password: pw}, function(ok, d){
    AUTH.busy = false;
    if (d && d.ok){
      if (AUTH.mode === 'set'){
        // 设完口令还要再登一次，拿 cookie
        apiPost('/api/admin/login', {password: pw}, function(ok2, d2){
          if (d2 && d2.ok){ AUTH.has_password = true; afterAuth(); }
          else if (err) err.textContent = (d2 && d2.error) || '登录失败';
        });
        return;
      }
      afterAuth();
      return;
    }
    if (err) err.textContent = (d && d.error) || '没进去，再试一次';
  });
}
function afterAuth(){
  AUTH.authed = true;
  paintAuth(null);
  loadState(function(){ render(); });
}
function logout(){
  apiPost('/api/admin/logout', {}, function(){
    AUTH.authed = false; S.st = null; paintAuth('login');
  });
}
function loadState(cb){
  apiGet('/api/admin/state', function(ok, d){
    if (ok && d && d.ok){
      S.st = d;
      var m = $('stmodel');
      if (m) m.textContent = (d.model && d.model.model) ? d.model.model : '';
    }
    if (cb) cb();
  });
}

function compareLine(cmp, half){

  function one(key, name){
    var c = cmp[key];

    if (c.pct === null || c.pct === undefined)

/* 按天柱状。两条线以上就并排画；数值写在 <title> 里，鼠标停上去能看到。 */
function trendSVG(series, keys){
  if (!series || !series.length) return '<div class="empty small">还没有数据</div>';
  var W = 680, H = 132, padL = 6, padR = 6, padT = 12, base = H - 22;
  var n = series.length, max = 1;
  series.forEach(function(d){
    keys.forEach(function(k){ if ((d[k.k] || 0) > max) max = d[k.k]; });
  });
  var slot = (W - padL - padR) / n;
  var bw = Math.max(2, Math.min(10, (slot - 2) / keys.length));
  var g = '';
  series.forEach(function(d, i){
    var x0 = padL + i * slot + (slot - bw * keys.length) / 2;
    keys.forEach(function(k, j){
      var v = d[k.k] || 0;
      var hh = v > 0 ? Math.max(2, Math.round(v / max * (base - padT))) : 0;
      g += '<rect x="' + (x0 + j * bw).toFixed(1) + '" y="' + (base - hh) +
        '" width="' + Math.max(1.5, bw - 1.6).toFixed(1) + '" height="' + hh +
        '" rx="1.5" fill="' + k.c + '"><title>' + esc(d.d + ' · ' + k.n + ' ' + v) +
        '</title></rect>';
    });
  });
  g += '<line x1="' + padL + '" y1="' + base + '" x2="' + (W - padR) + '" y2="' + base +
    '" stroke="#E4DED6" stroke-width="1"></line>';
  [0, Math.floor((n - 1) / 2), n - 1].forEach(function(i){
    if (i < 0 || i >= n || (i === 0 && n === 1)) return;
    if (i === Math.floor((n - 1) / 2) && (n < 3)) return;
    var x = padL + i * slot + slot / 2;
    g += '<text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" ' +
      'font-size="10" fill="#9A9188">' + esc(String(series[i].d || '').slice(5)) + '</text>';
  });
  return '<svg class="trend" viewBox="0 0 ' + W + ' ' + H + '">' + g + '</svg>';
}
function donutBlock(rows, centerLabel){
  var total = (rows || []).reduce(function(a, r){ return a + r[1]; }, 0);
  if (!total) return '<div class="empty small">还没有数据</div>';
  var R = 52, C = 2 * Math.PI * R, off = 0, segs = '';
  rows.forEach(function(r, i){
    var dash = r[1] / total * C;
    segs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' +
      DONUT_COLORS[i % DONUT_COLORS.length] + '" stroke-width="17" stroke-dasharray="' +
      dash.toFixed(2) + ' ' + (C - dash).toFixed(2) + '" stroke-dashoffset="' +
      (-off).toFixed(2) + '" transform="rotate(-90 70 70)"><title>' +
      esc(r[0] + ' ' + r[1]) + '</title></circle>';
    off += dash;
  });
  var lg = rows.map(function(r, i){
    return '<span><i style="background:' + DONUT_COLORS[i % DONUT_COLORS.length] +
      '"></i>' + esc(r[0]) + ' <b>' + r[1] + '</b>（' +
      Math.round(r[1] / total * 100) + '%）</span>';
  }).join('');
  return '<div class="donutwrap"><svg viewBox="0 0 140 140" class="donut">' +
    '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="#EFEAE3" stroke-width="17">' +
    '</circle>' + segs +
    '<text x="70" y="66" text-anchor="middle" font-size="21" fill="#211E1B">' + total +
    '</text><text x="70" y="84" text-anchor="middle" font-size="10" fill="#9A9188">' +
    esc(centerLabel || '总轮次') + '</text></svg><div class="legend col">' + lg + '</div></div>';
}

function fld(label, id, val, ph, type){

function chip(on, whenTrue, whenFalse){
  return '<span class="chip-btn" aria-pressed="' + String(!!on) + '">' +
    esc(on ? whenTrue : whenFalse) + '</span>';

function bindModel(){ /* 输入都是原生 input，不用额外绑定 */ }
function collectModel(){
  function v(id){ var e = $('f_' + id); return e ? (e.value || '').trim() : ''; }
  var out = {
    llm: {base_url:v('base_url'), model:v('model'), temperature:v('temperature'),
          max_tokens:v('max_tokens')},
    // 识图模型的空值是合法的（留空 = 跟对话模型同一个），所以不走 dropNull
    vision: {model:v('vision_model')},
    image: {provider:v('im_provider'), model:v('im_model'), cost:v('im_cost'),
            base_url:v('im_base_url'), variants:v('im_variants')},
    // 描稿仿稿：空值在这里是**合法语义**（留空 = 沿用生图那套），跟 image 的
    // "留空=不改"不同 —— 后端会把空值写进去，这样才退得回共用状态。
    // 所以控件不在这页时给 null（后端 `if isinstance(tr, dict) and tr` 会跳过），
    // 免得在别的页保存时把描稿配置一起抹了。
    trace: (document.getElementById('f_tr_model')
            || document.getElementById('f_tr_base_url')
            || document.getElementById('f_tr_provider'))
             ? {provider:v('tr_provider'), base_url:v('tr_base_url'),
                model:v('tr_model'), cost:v('tr_cost')}
             : null,
    psdlayer: dropNull({cost:v('psd_cost'), max_layers:v('psd_max_layers'),
                        vlm_base:v('psd_vlm_base'), vlm_model:v('psd_vlm_model')}),
    kb: dropNull({score_min:v('kb_min'), top_k:v('kb_topk'),
                  agents:kbAgentsSel(), enabled:lbTog('kb_enabled')}),
    library: dropNull({auto_ingest:lbTog('auto_ingest'), enabled:lbTog('enabled')}),
    seamless: dropNull({cost:v('se_cost'), candidates:v('se_candidates'),
                        base_url:v('se_base_url'),
                        analyze_base:v('se_analyze_base'),
                        image_model:v('se_image_model'),
                        analyze_model:v('se_analyze_model')}),
    api_key: v('api_key'), image_api_key: v('image_api_key'),
    trace_api_key: v('trace_api_key'),
    seamless_api_key: v('seamless_api_key'),
    seamless_analyze_key: v('seamless_analyze_key'),
    runninghub_api_key: v('runninghub_api_key'),
    psdlayer_vlm_key: v('psdlayer_vlm_key')
  };
  return out;
}
/* 控件不在当前这一页时，收集结果为 null，随后被丢掉 —— 也就是"这一项不改"。
   别小看这一步：知识库和花型库的开关不在「模型与密钥」页上，
   早先这里查不到就直接返回 false / []，于是在模型页点一次保存，
   就把知识库和花型库一起关掉了（运营完全看不出来）。 */
function dropNull(o){
  var out = {};
  for (var k in o){ if (o[k] !== null && o[k] !== undefined) out[k] = o[k]; }
  return out;
}
function kbAgentsSel(){
  var ns = document.querySelectorAll('[data-kbag]');
  if (!ns.length) return null;                 // 这排按钮只在知识库页
  var out = [];
  for (var i = 0; i < ns.length; i++){
    if (ns[i].getAttribute('aria-pressed') === 'true') out.push(ns[i].getAttribute('data-kbag'));
  }
  return out;
}
function lbTog(k){
  var b = document.querySelector('[data-lbtog="' + k + '"]');
  return b ? b.getAttribute('aria-pressed') === 'true' : null;   // 不在本页 → 不提交
}

var LIBPAT = {};
function ensureLib(){ if (!S.lib.loaded && !S.lib.loading) loadLib(true); }
function libQueryStr(){
  var L = S.lib, out = ['limit=' + L.size, 'offset=' + ((L.page - 1) * L.size)];
  if (L.q) out.push('q=' + encodeURIComponent(L.q));
  if (L.source) out.push('source=' + encodeURIComponent(L.source));
  DIMS4.forEach(function(d){ if (L.dim[d.key]) out.push(d.key + '=' + encodeURIComponent(L.dim[d.key])); });
  return out.join('&');
}
function loadLib(reset){
  var L = S.lib;
  if (reset){ L.page = 1; L.items = []; }
  L.loading = true; L.err = '';
  paintLib();
  apiGet('/api/library?' + libQueryStr(), function(ok, d){
    L.loading = false;
    if (!(ok && d && d.ok)){ L.err = (d && d.error) || '花型库读取失败。'; paintLib(); return; }
    L.total = d.total || 0; L.stats = d.stats || {}; L.facets = d.facets || {};
    (d.items || []).forEach(function(it){
      if (!it || !it.id) return;
      it.image = absURL(it.image); it.full = absURL(it.full);
      LIBPAT[it.id] = it;
    });
    L.items = reset ? (d.items || []) : L.items.concat(d.items || []);
    L.loaded = true;
    paintLib(); renderNav();
  });
}

/* 选文件夹导入。 Chrome / Edge 的 webkitdirectory：<input> 加上这个属性，
   弹出来的就是文件夹选择器，选完 t.files 里是**整个文件夹（含子目录）**的
   所有文件。Safari 不支持，会退化成普通文件选择 —— 所以按钮上写清楚，
   别让运营以为点坏了。 */
function libDirClick(){

  if (!f){ toast('浏览器不支持选文件夹，用 Chrome / Edge'); return; }

/* 是不是能入库的图片。文件夹里会混进 .DS_Store、__MACOSX、.txt 这些，
   f.type 对没扩展名的文件常常是空的，所以扩展名也要认。 */
function isImageFile(f){
  if (!f) return false;
  var n = String(f.name || '');
  if (!n || n.charAt(0) === '.' || n.indexOf('._') === 0) return false;
  var p = f.webkitRelativePath || '';
  if (p.indexOf('/__MACOSX/') >= 0) return false;
  if (f.type && f.type.indexOf('image/') === 0) return true;
  return /\.(png|jpe?g|webp|gif|bmp|tiff?)$/i.test(n);
}
function libUploadFiles(files, opts){
  opts = opts || {};
  var list = Array.prototype.slice.call(files || []).filter(isImageFile);
  if (!list.length){ toast('没选到图片文件（png / jpg / webp）', true); return; }
  var i = 0, okN = 0, dupN = 0, badN = 0, failN = 0;
  S.libprog = {total:list.length, done:0, ok:0, dup:0, bad:0, fail:0,
               cur:'', dir:!!opts.dir, running:true};
  paintLibProg();
  (function next(){
    if (i >= list.length){
      S.libprog.running = false; S.libprog.cur = '';
      paintLibProg();
      toast('导入完成：入库 ' + okN + ' 张' + (dupN ? ' · 库里已有 ' + dupN : '') +
            (badN ? ' · 不是花型 ' + badN : '') + (failN ? ' · 失败 ' + failN : ''));
      loadLib(true);
      loadState(function(){ renderNav(); paintAtag(); });
      return;
    }
    var f = list[i++];
    S.libprog.cur = f.webkitRelativePath || f.name;
    paintLibProg();
    compressImage(f, function(err, img){
      if (err || !img || !img.dataUrl){ failN++; S.libprog.fail = failN; S.libprog.done++; paintLibProg(); return next(); }
      var m = String(img.dataUrl).match(/^data:([^;]+);base64,(.*)$/);
      if (!m){ failN++; S.libprog.fail = failN; S.libprog.done++; paintLibProg(); return next(); }
      apiPost('/api/library/ingest',
        {image:m[2], image_mime:m[1], filename:f.name, source:'import'},
        function(ok, d){
          S.libprog.done++;
          if (ok && d && d.ok){
            if (d.dup){ dupN++; S.libprog.dup = dupN; }
            else { okN++; S.libprog.ok = okN; }
          } else if (d && d.not_pattern){ badN++; S.libprog.bad = badN; }
          else { failN++; S.libprog.fail = failN; }
          paintLibProg();
          next();
        });
    });
  })();
}
/* 上传/文件夹导入的进度卡。跟扫目录的 paintScan 一个套路，但挂在
   #libprog 上 —— 两个进度可能同时存在（扫目录跑着，运营又传了几张）。 */
function paintLibProg(){
  var box = $('libprog');
  if (!box) return;
  var s = S.libprog;
  if (!s || !s.running){ box.innerHTML = ''; S.libprog = null; return; }
  var pct = s.total ? Math.round(s.done / s.total * 100) : 0;
  box.innerHTML = '<div class="card card-pad" style="margin-top:12px">' +
    '<div class="rowline"><b class="small">' + (s.dir ? '正在导入文件夹' : '正在导入') +
      '：' + s.done + ' / ' + s.total + '</b>' +
    '<span class="tiny muted">入库 ' + s.ok + ' · 已有 ' + s.dup +
      ' · 不是花型 ' + s.bad + ' · 失败 ' + s.fail + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    (s.cur ? '<div class="tiny muted" style="margin-top:7px">' + esc(s.cur) + '</div>' : '') +
    '<div class="tiny muted" style="margin-top:5px">每张都要先过算法读图打标，一张几秒，' +
      '这个页面可以先放着，导完会提示。</div>' +
    '</div>';
}
function compressImage(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb('文件读取失败'); };
  fr.onload = function(){
    var src = String(fr.result || '');
    var done = function(dataUrl){ cb(null, {dataUrl:dataUrl}); };
    var img = new Image();
    img.onerror = function(){ done(src); };
    img.onload = function(){
      var ow = img.width || 0, oh = img.height || 0;
      if (Math.max(ow, oh) <= 2048) return done(src);   // 没超限一个像素都不动
      try {
        var s = 2048 / Math.max(ow, oh);
        var w = Math.max(1, Math.round(ow * s)), h = Math.max(1, Math.round(oh * s));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
        g.drawImage(img, 0, 0, w, h);
        done(c.toDataURL('image/jpeg', 0.85));
      } catch (e) { done(src); }
    };
    img.src = src;
  };
  fr.readAsDataURL(file);
}

  if (!d) return '<div class="card card-pad">正在读取…</div>';
  var h = '<div class="card card-pad"><div class="rowline">' +
    '<div class="kpi"><b>' + (d.total || 0) + '</b><span>个会话</span></div>' +
    '<div class="small muted" id="sessmeta">' + sessMeta(d) + '</div>' +
    '</div>' +
    '<div class="sfilter">' +
      '<span class="lbl">搜会话 ID</span>' +
      '<input id="sessq" autocomplete="off" value="' + esc(S.sessQ || '') + '"' +
        ' placeholder="ID 片段就行，例：mv4dyjs" style="flex:1;min-width:190px;max-width:320px">' +
      '<span class="lbl">最后活动</span>' +
      '<input id="sessd" type="date" value="' + esc(S.sessD || '') + '">' +
      '<button class="btn ghost sm" data-act="sess-clear">清除</button>' +
    '</div></div>';
  h += '<div class="card mt"><table class="tbl sess"><thead><tr><th>会话 ID</th><th>轮数</th>' +
    '<th>最后活动</th><th class="ta-r">大小</th></tr></thead>' +
    '<tbody id="sessrows">' + sessRows(d) + '</tbody></table></div>';
  return h;
}

/* =========================================================================
   弹层
   ========================================================================= */
function openLayer(inner){
  var l = $('layer');
  if (!l) return;
  l.innerHTML = '<div class="scrim" data-act="close-layer"></div>' +
                '<div class="modal-wrap">' + inner + '</div>';
  l.className = 'on';
}
function closeLayer(){
  var l = $('layer');
  if (!l) return;
  l.className = '';
  l.innerHTML = '';
}

/* =========================================================================
   事件委托
   ========================================================================= */
document.addEventListener('click', function(e){
  var t = e.target;
  while (t && t !== document.body){
    var act = t.getAttribute && t.getAttribute('data-act');
    if (act){ handleAct(act, t, e); return; }
    var nav = t.getAttribute && t.getAttribute('data-nav');
    if (nav){ go(nav); return; }
    var pag = t.getAttribute && t.getAttribute('data-pag');
    if (pag){ S.personaCur = pag; S.dirty = {}; render(); return; }
    var pre = t.getAttribute && t.getAttribute('data-preset');
    if (pre){ applyPreset(pre, t); return; }
    var kag = t.getAttribute && t.getAttribute('data-kbag');
    if (kag){ toggleAria(t); return; }
    var lt = t.getAttribute && t.getAttribute('data-lbtog');
    if (lt){ toggleAria(t); return; }
    var st = t.getAttribute && t.getAttribute('data-scantog');
    if (st){ toggleAria(t); return; }
    var sd = t.getAttribute && t.getAttribute('data-statsdays');
    if (sd){
      // 只换统计区间：清掉旧的、重新拉一次；按钮状态在重绘里重算
      S.statsDays = parseInt(sd, 10) || 14;
      S.stats = null;
      loadStats();
      return;
    }
    var dim = t.getAttribute && t.getAttribute('data-libdim');
    if (dim){ libSetDim(dim, t.getAttribute('data-libval')); return; }
    var src = t.getAttribute && t.getAttribute('data-libsrc');
    if (src){ S.lib.source = src || ''; S.lib.page = 1; loadLib(true); return; }
    var op = t.getAttribute && t.getAttribute('data-libopen');
    if (op){ openLibItem(op); return; }
    var dv = t.getAttribute && t.getAttribute('data-kbview');
    if (dv){ kbViewDoc(dv); return; }
    var dd = t.getAttribute && t.getAttribute('data-kbdel');
    if (dd){ kbDelDoc(dd); return; }
    var qs = t.getAttribute && t.getAttribute('data-qa-save');
    if (qs){ qaSave(qs); return; }
    var qd = t.getAttribute && t.getAttribute('data-qa-del');
    if (qd){ qaDel(qd); return; }
    t = t.parentNode;
  }
});
function toggleAria(el){
  el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
}
function libSetDim(dim, val){
  if (val) S.lib.dim[dim] = val; else delete S.lib.dim[dim];
  S.lib.page = 1;
  loadLib(true);
}
function applyPreset(key, btn){
  var d = S.personas;
  if (!d) return;
  var ps = d.presets || [];
  for (var i = 0; i < ps.length; i++){
    if (ps[i].key === key){
      var box = $('stylebox');
      if (box) box.value = ps[i].body;
      var all = document.querySelectorAll('[data-preset]');
      for (var j = 0; j < all.length; j++){
        all[j].setAttribute('aria-pressed', String(all[j].getAttribute('data-preset') === key));
      }
      return;
    }
  }
}
function handleAct(act, el, e){
  if (act === 'logout') return logout();
  if (act === 'close-layer') return closeLayer();
  if (act === 'save-config') return saveConfig();
  if (act === 'reload') return apiPost('/api/reload', {}, function(ok, d){
    if (ok && d && d.ok){ toast('已重新加载'); loadState(function(){ render(); }); }
    else toast('重新加载失败', true);
  });
  if (act === 'save-persona') return savePersona();
  if (act === 'kb-test') return kbTest();
  if (act === 'kb-add') return kbAddDoc();
  if (act === 'kb-file'){ var f = $('kbfile'); if (f) f.click(); return; }
  if (act === 'qa-add') return qaAdd();
  if (act === 'lib-upload') return libUploadClick();
  if (act === 'lib-dir') return libDirClick();
  if (act === 'lib-scan') return libScanDialog();
  if (act === 'lib-reload'){ S.lib.loaded = false; return loadLib(true); }
  if (act === 'lib-clear') return libClear();
  if (act === 'lib-more') return libMore();
  if (act === 'lib-save') return libSave();
  if (act === 'lib-retag') return libRetag();
  if (act === 'lib-del') return libDelete();
  if (act === 'scan-probe') return scanProbe();
  if (act === 'scan-go') return scanGo();
  if (act === 'reload-stats'){ S.statsErr = ''; S.stats = null; return loadStats(); }
  if (act === 'sess-clear'){
    S.sessQ = ''; S.sessD = '';
    var qi = $('sessq'), di = $('sessd');       // 就地清空，不整页重绘
    if (qi) qi.value = '';
    if (di) di.value = '';
    return loadSessions();
  }
}
document.addEventListener('change', function(e){
  var t = e.target;
  if (t && t.id === 'libfile') libUploadFiles(t.files);
  if (t && t.id === 'libdir') libUploadFiles(t.files, {dir:true});
  if (t && t.id === 'kbfile') kbFile(t.files);
  if (t && t.id === 'sessd'){ S.sessD = t.value || ''; loadSessions(); }
});
/* 会话 ID 是边打边筛，所以停手约 0.25 秒才发请求（不然一个字母一次） */
document.addEventListener('input', function(e){
  var t = e.target;
  if (!t || t.id !== 'sessq') return;
  S.sessQ = t.value || '';
  if (S.sessTimer) clearTimeout(S.sessTimer);
  S.sessTimer = later(function(){ loadSessions(); }, 250);
});

/* ---------- 导出给测试 ---------- */
window.__ADM = {
  S:S, NAV:NAV, go:go, render:render, boot:boot, esc:esc, toast:toast,
  viewOverview:viewOverview, viewModel:viewModel, viewPersona:viewPersona,
  viewKb:viewKb, viewLib:viewLib, viewSessions:viewSessions, viewStats:viewStats,
  apiRows:apiRows, loadStats:loadStats, trendSVG:trendSVG, bars:bars,
  saveConfig:saveConfig, savePersona:savePersona, applyPreset:applyPreset,
  kbTest:kbTest, kbAddDoc:kbAddDoc, qaAdd:qaAdd,
  libClear:libClear, libMore:libMore, openLibItem:openLibItem,
  libSave:libSave, libRetag:libRetag, libDelete:libDelete,
  libUploadFiles:libUploadFiles, libDirClick:libDirClick,
  isImageFile:isImageFile, paintAtag:paintAtag, paintLibProg:paintLibProg,
  libScanDialog:libScanDialog,
  scanProbe:scanProbe, scanGo:scanGo, paintScan:paintScan,
  openLayer:openLayer, closeLayer:closeLayer,
  collectModel:collectModel, dropNull:dropNull, lbTog:lbTog,
  libBodyHTML:libBodyHTML, libCardHTML:libCardHTML,
  checkAuth:checkAuth, paintAuth:paintAuth, doAuth:doAuth, logout:logout,
  get AUTH(){ return AUTH; },
  get API(){ return API; }, set API(v){ API = v; },
  get ONLINE(){ return ONLINE; }
};

boot();
</script>
