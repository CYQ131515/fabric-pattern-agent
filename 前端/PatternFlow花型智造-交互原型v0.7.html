<title>CYQ·PatternFlow · 花型智造 — 交互原型 v0.7</title>
<style>
:root{
  --ink:#211E1B;
  --ink-2:#3A342E;
  --ink-3:#6B635A;
  --ink-4:#9A9188;
  --line:#E4DED6;
  --line-2:#EFEAE3;
  --paper:#F6F3EE;
  --card:#FFFFFF;
  --accent:#C1553A;
  --accent-soft:#F6E7E2;
  --jade:#3F6B5C;
  --jade-soft:#E4EDE9;
  --gold:#B58A2B;
  --gold-soft:#F6EFDD;
  --blue:#3B5D8F;
  --blue-soft:#E6EDF7;
  --rail:#F1EEE9;
  --rail-hover:#E7E2D9;
  --rail-on:#DFD8CD;
  --stage:#EAE5DE;
  --r-s:6px; --r-m:10px; --r-l:16px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(33,30,27,.06), 0 1px 1px rgba(33,30,27,.04);
  --sh-2:0 6px 18px rgba(33,30,27,.08), 0 2px 6px rgba(33,30,27,.04);
  --sh-3:0 22px 48px rgba(33,30,27,.2), 0 6px 16px rgba(33,30,27,.08);
  --fs:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--fs); line-height:1.62; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CFC8BE;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#BDB5AA}
::-webkit-scrollbar-track{background:transparent}

/* ============ 骨架：左栏会话 + 右侧舞台 ============ */
#app{display:flex;height:100vh;overflow:hidden}

.rail{
  width:256px;flex:0 0 256px;background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.rail-head{padding:14px 14px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mark{width:28px;height:28px;border-radius:8px;flex:0 0 28px;
  background:conic-gradient(from 210deg,#C1553A,#B58A2B,#3F6B5C,#C1553A);position:relative;overflow:hidden}
.brand .mark::after{content:"";position:absolute;inset:6.5px;border-radius:3.5px;background:var(--rail)}
.brand .tx b{display:block;font-size:13px;letter-spacing:.3px;line-height:1.3}
.brand .tx span{display:block;font-size:10px;color:var(--ink-4);letter-spacing:.5px}
/* CYQ· 是品牌前缀，要跟 PatternFlow 同一行同字号；
   注意 .brand .tx span 会把 span 压成小字换行，这里显式覆盖回来。 */
.brand .tx b .brand-pre{display:inline;font-size:inherit;color:var(--accent);letter-spacing:.3px}

.rail-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;min-height:0}
.nav-label{font-size:10.5px;color:#9A9188;padding:12px 8px 5px;letter-spacing:1px;font-weight:600}
.row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 9px;border-radius:9px;transition:background .14s;position:relative;
}
.row:hover{background:var(--rail-hover)}
.row[aria-current="true"]{background:var(--rail-on)}
.row .av{width:36px;height:36px;border-radius:9px;flex:0 0 36px;display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:600;position:relative}
.row .av .dot{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);border:2px solid var(--rail)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:13px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:11px;color:var(--ink-4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .badge{font-size:10px;background:var(--accent);color:#fff;border-radius:20px;
  min-width:17px;height:17px;display:grid;place-items:center;padding:0 5px;flex:0 0 auto}
.row .badge.p1{background:#D7D0C7;color:var(--ink-3)}
.row .pi{width:16px;text-align:center;font-size:13px;color:var(--ink-4);flex:0 0 16px}
.row.soon{opacity:.72}
.row.soon .tx b{font-weight:500;color:var(--ink-3)}

.rail-foot{padding:10px 12px 12px;border-top:1px solid var(--line);background:#EDE8E1}
.rail-foot .wallet{display:flex;align-items:center;gap:9px}
.rail-foot .wallet .n{flex:1;min-width:0}
.rail-foot .wallet .k{font-size:10.5px;color:var(--ink-4)}
.rail-foot .wallet .v{font-size:17px;font-weight:660;letter-spacing:.3px;line-height:1.2}
.rail-foot .wallet .v small{font-size:10.5px;font-weight:400;color:var(--ink-4);margin-left:2px}
.rail-foot .wallet button{padding:6px 12px;border-radius:8px;background:var(--ink);color:#fff;
  font-size:12px;font-weight:600;transition:.16s;flex:0 0 auto}
.rail-foot .wallet button:hover{background:#000}

.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--stage);position:relative}
.stage-head{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;
  padding:0 18px;background:rgba(241,238,233,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);z-index:2;
}
.stage-head .tt{min-width:0}
.stage-head .tt b{display:block;font-size:14.5px;font-weight:650;letter-spacing:.2px;line-height:1.3}
.stage-head .tt span{display:block;font-size:11.5px;color:var(--ink-4)}
.stage-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip-btn{padding:5.5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink-2);transition:.16s;white-space:nowrap}
.chip-btn:hover{border-color:var(--ink-4);box-shadow:var(--sh-1)}
.chip-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip-btn.primary:hover{background:#000}
.balance{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
  background:var(--gold-soft);color:#7A5C12;font-size:12.5px;font-weight:600}
.balance .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#C1553A,#B58A2B);
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:650;flex:0 0 30px}

.stage-body{flex:1;min-height:0;display:flex;flex-direction:column}
.page-scroll{flex:1;overflow:auto;padding:20px 22px}
.wrap{max-width:1080px;margin:0 auto}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.card-pad{padding:17px}
.sect-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 11px}
.sect-title:first-child{margin-top:0}
.sect-title h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:.2px}
.sect-title .hint{font-size:11.5px;color:var(--ink-4)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:20px;
  background:var(--line-2);color:var(--ink-3);white-space:nowrap}
.tag.jade{background:var(--jade-soft);color:#2E5346}
.tag.gold{background:var(--gold-soft);color:#7A5C12}
.tag.accent{background:var(--accent-soft);color:#9C3F27}
.tag.blue{background:var(--blue-soft);color:#2C4870}
.muted{color:var(--ink-4)}
.small{font-size:12px}
.hr{height:1px;background:var(--line);margin:14px 0}
.kpi{display:flex;flex-direction:column;gap:1px}
.kpi b{font-size:22px;font-weight:660;letter-spacing:.4px;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--ink-4)}
.bar{height:6px;border-radius:20px;background:var(--line-2);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#D98A5F);transition:width .35s ease}
.bar.jade > i{background:linear-gradient(90deg,var(--jade),#6AA08C)}
.btn{padding:8px 15px;border-radius:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:560;
  transition:.16s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:#000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink-4);background:#fff}
.btn.accent{background:var(--accent)}
.btn.accent:hover{background:#A8462E}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-4)}
.empty .big{font-size:24px;margin-bottom:8px;opacity:.5}
.emptyface{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff;
  font-size:22px;font-weight:600;margin:0 auto 13px;box-shadow:var(--sh-2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-4);font-size:11.5px;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#FCFAF7}
/* 表格：横向可滚，避免窄屏压缩导致文字竖排 / 按钮出框 */
.tbl-wrap{overflow-x:auto}
.tbl-wrap .tbl{min-width:720px}
.tbl td.mono{white-space:nowrap}
.tbl th.ta-r,.tbl td.ta-r{text-align:right;white-space:nowrap}
.fcell{display:flex;gap:10px;align-items:center;min-width:0}
.fthumb{width:32px;height:32px;border-radius:7px;overflow:hidden;border:1px solid var(--line);
  flex:0 0 32px;display:block}
.fthumb svg{display:block;width:100%;height:100%}
.fname{display:flex;flex-direction:column;min-width:0}
.fname b{font-size:12.5px;font-weight:600}
.fname .mono{font-size:11px;word-break:break-all;white-space:normal}
.stepline{display:flex;flex-direction:column;gap:2px}
.stepline .st{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-4);padding:4px 0}
.stepline .st .dotm{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 8px}
.stepline .st.done{color:var(--ink-2)}
.stepline .st.done .dotm{background:var(--jade)}
.stepline .st.now{color:var(--accent);font-weight:600}
.stepline .st.now .dotm{background:var(--accent);box-shadow:0 0 0 4px rgba(193,85,58,.16)}
.seamwrap{position:relative;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.seamwrap svg{display:block;width:100%;height:auto}
.seamwrap .seamline{position:absolute;background:rgba(193,85,58,.85)}
.seamwrap .seamline.v{top:0;bottom:0;width:1px}
.seamwrap .seamline.h{left:0;right:0;height:1px}

/* ============ 聊天 ============ */
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:22px 24px 12px;display:flex;flex-direction:column;gap:16px;min-height:0}
.msgs > .empty{margin:auto 0}
.msg{display:flex;gap:10px;max-width:78%;animation:msgIn .22s ease}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .face{width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:grid;place-items:center;
  font-size:14px;font-weight:600;color:#fff}
.msg.me .face{background:var(--ink-3)}
/* 气泡 + 气泡下方的小字说明（上传图缩放提示等） */
.msg .col{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.bubble{background:#fff;border:1px solid var(--line);border-radius:3px 13px 13px 13px;
  padding:10px 13px;box-shadow:var(--sh-1);min-width:0;position:relative}
.msg.me .bubble{background:var(--accent);color:#FDF6F3;border-color:var(--accent);
  border-radius:13px 3px 13px 13px}
.bubble.bare{background:none;border:none;box-shadow:none;padding:0}
.bubble .who{font-size:10.5px;color:var(--ink-4);margin-bottom:3px;letter-spacing:.3px}
.bubble p{margin:0 0 7px}
.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:6px 0 0;padding-left:17px}
.bubble li{margin:3px 0}
.bubble .qline{color:var(--ink-3);border-left:2px solid var(--line);padding:1px 0 1px 8px;margin:5px 0 7px}
/* --- 上传参考图 --- */
.msg-img{margin:0 0 8px;max-width:220px;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative}
.msg-img img{display:block;width:100%;height:auto}
.msg-img .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 7px;font-size:10.5px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.55))}
/* 上传图被等比缩放时的说明：落在气泡下方的小字 */
.imgnote{font-size:11px;line-height:1.5;color:var(--ink-4);margin:6px 0 0;max-width:260px}
.pending{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;margin-bottom:8px;
  border:1px dashed var(--line);border-radius:10px;background:#FBF9F6}
.pending .thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--line);flex:0 0 56px}
.pending .thumb .zoom-hint{width:17px;height:17px;border-radius:5px;font-size:10px;right:3px;top:3px}
.pending .thumb img{display:block;width:100%;height:100%;object-fit:cover}
.pending .meta{flex:1;min-width:0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.pending .meta b{display:block;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending .x{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;
  color:var(--ink-3);flex:0 0 24px;line-height:1}
.drop-on .msgs{outline:2px dashed var(--accent);outline-offset:-8px;border-radius:8px}
.msg.me .bubble .qline{color:rgba(253,246,243,.82);border-left-color:rgba(253,246,243,.4)}
.opt-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
/* --- AI 生成的花型图 --- */
.genimg{margin:2px 0 8px;max-width:300px;border-radius:10px;overflow:hidden;border:1px solid var(--line);position:relative;background:#fff}
.genimg img{display:block;width:100%;height:auto}
.genimg .cap{position:absolute;left:0;right:0;bottom:0;padding:5px 8px;font-size:10.5px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.55))}
.genimg .mock{position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:5px;font-size:10px;
  background:rgba(198,116,52,.92);color:#fff;letter-spacing:.2px}
.genimg .mock::after{content:''}
/* 一次出多张：两张一排平铺，不然四张竖着排下来滚动条要拉半天 */
.genimgs.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:2px 0 8px}
.genimgs.grid .genimg{margin:0;max-width:none}
.genimgs.grid .genimg .cap{font-size:10px;padding:4px 6px}
/* 附带下载的文件（分层 PSD 本体之类）：<img> 渲染不了 PSD，
   塞进 images 只会是一张裂图，所以单独排一行下载按钮 */
.dlrow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:7px 0 4px}
.dlrow .dllab{font-size:11px;color:var(--ink-4)}
.dlchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 11px;
  border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  text-decoration:none;font-size:12px;transition:.15s}
.dlchip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dlchip svg{flex:none;opacity:.75}
.dlchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.dlchip em{font-style:normal;font-size:10.5px;color:var(--ink-4);flex:none}
/* 等待气泡里的「终止」：机器人在想 / 在出图时，用户得能中途叫停 */
.stopbtn{margin-left:9px;font-size:11.5px;padding:3px 11px;border-radius:14px;
  border:1px solid var(--line);background:#fff;color:var(--ink-3);line-height:1.5;transition:.15s}
.stopbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.confirm-card{margin-top:9px;border:1px solid var(--line);border-radius:10px;background:#FBF9F6;padding:10px 11px}
.confirm-card .ttl{font-size:12.5px;font-weight:600;margin-bottom:5px}
.confirm-card .ttl .pt{color:var(--accent)}
.confirm-card .sum{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-bottom:8px}
.confirm-card .ops{display:flex;flex-wrap:wrap;gap:7px}
.confirm-card .ops .opt.main{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 还原度：在卡片上直接切，不用打字描述 */
.fid-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 9px}
.fid-row .fl{font-size:11px;color:var(--ink-3);flex:0 0 auto}
.fid-row .fid{font-size:11.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);transition:.15s;line-height:1.4}
.fid-row .fid:hover{border-color:var(--accent);color:var(--accent)}
.fid-row .fid.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.fid-row .fid[disabled]{opacity:.55;cursor:default}
.fid-row .fd{flex:1 0 100%;font-size:10.5px;color:var(--ink-4);line-height:1.45}
/* 张数：跟还原度一样的交互 —— 参数在卡片上点，不用在对话框里说「我要一张」 */
.cnt-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 9px}
.cnt-row .fl{font-size:11px;color:var(--ink-3);flex:0 0 auto}
.cnt-row .cnt{font-size:11.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);transition:.15s;line-height:1.4}
.cnt-row .cnt:hover{border-color:var(--accent);color:var(--accent)}
.cnt-row .cnt.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cnt-row .fd{flex:1 0 100%;font-size:10.5px;color:var(--ink-4);line-height:1.45}
.qc-line{font-size:11.5px;line-height:1.55;padding:6px 8px;border-radius:7px;margin-bottom:7px;
  background:#F2F0EC;color:var(--ink-3);border-left:3px solid var(--line)}
.qc-line b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:1px}
.qc-line.warn{background:#FDF4E7;border-left-color:#D9A441}
.qc-line.bad{background:#FBEDEC;border-left-color:#C4624F}
.edit-bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:2px 0 4px}
.edit-bar .lab{font-size:11px;color:var(--ink-4);margin-right:2px}
/* 自定义参数：色板只有常用档，用户想说的颜色不一定在里面，所以给一个直接写的入口 */
.ed-input{flex:1 1 180px;min-width:150px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;color:var(--ink-1);font-family:inherit}
.ed-input:focus{outline:none;border-color:var(--accent);background:var(--accent-soft)}
.opt.go{border-color:var(--accent);background:var(--accent);color:#fff}
.opt.go:hover{background:#A8452C;border-color:#A8452C;color:#fff}
.opt{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;
  transition:.15s;color:var(--ink-2)}
.opt:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.opt.trend{border-color:var(--gold);color:#7A5C12;background:var(--gold-soft)}
.opt.trend:hover{background:#F1E4C4}
.opt .em{color:var(--gold);margin-right:4px}
/* 织印师接到图之后：先把「四方连续 / 分层 PSD」两道工序摆出来让用户点。
   不替他拍板，也不在文字里绕一圈再问 —— 按钮就是答案。 */
.ask-card{margin-top:9px;border:1px solid var(--line);border-radius:10px;background:#FBF9F6;padding:10px 11px}
.ask-card .ask-hd{display:flex;gap:10px;align-items:center}
.ask-card .ask-thumb{display:block;width:56px;height:56px;flex:0 0 56px;border-radius:9px;
  overflow:hidden;border:1px solid var(--line);background:#fff}
.ask-card .ask-thumb img{display:block;width:100%;height:100%;object-fit:cover}
.ask-card .ask-tx b{font-size:12.5px;font-weight:600;display:block}
.ask-card .ask-tx .small{display:block;margin-top:3px;line-height:1.55}
.ask-card .ask-ops{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.ask-card .ask-ops .opt.main{background:var(--accent);color:#fff;border-color:var(--accent)}
.ask-card .ask-ops .opt.main:hover{background:#A8452C;border-color:#A8452C;color:#fff}
.typing{display:inline-flex;gap:3px;align-items:center;height:14px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}

/* 聊天里逐张发出的花型消息 */
.pmsg{width:290px;max-width:100%}
.pmsg .hd{font-size:11px;color:var(--ink-4);margin-bottom:5px;letter-spacing:.3px}
.pmsg .pic{border-radius:11px 11px 0 0;overflow:hidden;border:1px solid var(--line);background:#fff}
.pmsg .pic svg{display:block;width:100%;height:auto}
.pmsg .meta{padding:9px 11px 11px;background:#fff;border:1px solid var(--line);border-top:none;
  border-radius:0 0 11px 11px;margin-top:-1px}
.pmsg .meta .nm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pmsg .meta .nm b{font-size:13px;font-weight:620}
.pmsg .meta .tl{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pmsg .meta .dc{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}
.pmsg .ops{display:flex;gap:7px;margin-top:9px}
.pmsg .ops button{flex:1;padding:6px 8px;border-radius:8px;font-size:12px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);transition:.15s}
.pmsg .ops button:hover{border-color:var(--accent);color:var(--accent)}
.pmsg .ops button.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.pmsg .ops button.main:hover{background:#000;color:#fff}

/* 花型选择弹窗（只出图） */
.picker-actions{display:flex;gap:10px;margin-top:14px;background:#fff;border-radius:12px;
  padding:10px;border:1px solid var(--line);align-items:center}
.picker-actions .sel-info{flex:1;min-width:0;font-size:12.5px;color:var(--ink-3)}
.picker-actions .sel-info b{color:var(--accent)}
.picker-actions .right{margin-left:auto;display:flex;gap:9px;flex:0 0 auto}
.picker-scroll{max-height:56vh;overflow-y:auto;margin:0 -6px;padding:2px 6px}
.picker-scroll.compact{max-height:31vh}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:11px}
.psel{border:2px solid transparent;border-radius:13px;overflow:hidden;background:#fff;
  box-shadow:var(--sh-1);transition:.16s;position:relative;display:block}
.psel:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.psel .im{aspect-ratio:1/1;display:block;position:relative}
/* 多选卡片右上角已经被勾选标记占了，放大角标挪到左上角 */
.psel .im .zoom-badge{left:6px;top:6px;right:auto;bottom:auto}
.psel .im svg{display:block;width:100%;height:100%}
.psel .cp{padding:7px 9px;border-top:1px solid var(--line-2)}
.psel .cp b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psel .cp span{display:block;font-size:10px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psel .ck{position:absolute;right:7px;top:7px;width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.9);border:1px solid var(--line);display:grid;place-items:center;
  font-size:12px;color:transparent;transition:.16s;backdrop-filter:blur(4px)}
.psel[aria-pressed="true"]{border-color:var(--accent)}
.psel[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.psel[aria-pressed="true"] .im::after{content:"";position:absolute;inset:0;
  background:rgba(193,85,58,.07);pointer-events:none}
.picker-group{margin-bottom:4px}
.picker-group .gl{font-size:11.5px;color:var(--ink-4);margin:0 0 7px;letter-spacing:.4px}

/* 需求卡（聊天右侧浮动） */
.briefbar{display:flex;gap:8px;padding:9px 24px;background:rgba(255,255,255,.72);
  border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;backdrop-filter:blur(6px)}
.briefbar .bl{font-size:11px;color:var(--ink-4);letter-spacing:.5px}
.briefbar .slot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;
  border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.briefbar .slot.none{color:#C4BCB2;border-style:dashed}
.briefbar .slot i{font-style:normal;color:var(--ink-4);font-size:10.5px}
.briefbar .slot.on{background:var(--accent-soft);border-color:#EBCFC6;color:#9C3F27}
.briefbar .slot.on i{color:#B8735C}
.briefbar .reset{margin-left:auto;font-size:11.5px;color:var(--ink-4);padding:3px 9px;border-radius:20px}
.briefbar .reset:hover{background:#fff;color:var(--ink-2)}

.composer{border-top:1px solid var(--line);padding:11px 18px 12px;background:#F7F5F1}
.composer .box{display:flex;gap:9px;align-items:flex-end;max-width:1000px;margin:0 auto}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:11px;padding:10px 12px;
  min-height:42px;max-height:130px;background:#fff;outline:none;line-height:1.55;transition:.16s}
.composer textarea:focus{border-color:var(--ink-4);box-shadow:0 0 0 3px rgba(33,30,27,.05)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:15px;color:var(--ink-3);transition:.16s;flex:0 0 38px}
.icon-btn:hover{border-color:var(--ink-4);color:var(--ink)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px;font-size:14px;flex:0 0 30px}
.composer .hintline{font-size:10.5px;color:var(--ink-4);margin-top:6px;display:flex;gap:12px;
  flex-wrap:wrap;max-width:1000px;margin-left:auto;margin-right:auto}
.composer .hintline .sp{margin-left:auto}

/* ============ 抽屉 / 弹窗 ============ */
.scrim{position:fixed;inset:0;background:rgba(33,30,27,.42);backdrop-filter:blur(2px);z-index:40;
  animation:fade .16s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:512px;max-width:92vw;background:var(--paper);
  box-shadow:var(--sh-3);z-index:41;display:flex;flex-direction:column;animation:slideIn .22s cubic-bezier(.2,.8,.2,1)}
.drawer .dh{padding:15px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;background:#fff}
.drawer .db{flex:1;overflow:auto;padding:19px}
.drawer .df{padding:13px 19px;border-top:1px solid var(--line);background:#fff;display:flex;gap:9px;flex-wrap:wrap}
/* 详情页底部：按处理类型分行的「生成 / 已生成 + 重新生成 + 下载」 */
.genblock{display:flex;flex-direction:column;gap:10px;width:100%}
.genrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.genrow .gl{font-size:12.5px;color:var(--ink-3);flex:0 0 66px;width:66px}
.genrow .gstate{font-size:12.5px;font-weight:600;color:#2E5346;background:var(--jade-soft);
  padding:4px 12px;border-radius:20px}
.genrow .gcost{font-size:11.5px;color:var(--ink-4);margin-left:auto}
.close-x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;color:var(--ink-3)}
.close-x:hover{background:var(--line-2);color:var(--ink)}
.detail-hero{border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);background:#fff}
.detail-hero svg{display:block;width:100%;height:auto}
.pal{display:flex;gap:8px;margin-top:4px}
.pal .sw{flex:1;height:42px;border-radius:9px;border:1px solid rgba(0,0,0,.06);position:relative}
.pal .sw span{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:10px;color:var(--ink-4)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 12px;font-size:12.5px}
.kv .k{color:var(--ink-4)}
/* ============ 图案放大查看 ============ */
.zoommask{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:rgba(243,240,235,.97);backdrop-filter:blur(6px);animation:fade .16s ease}
.zoommask[hidden]{display:none}
.zoom-top{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:13px 18px;flex-wrap:wrap}
.zoom-top .zt-cap{font-size:14px;font-weight:640;color:var(--ink)}
.zoom-top .zt-sub{font-size:11.5px;color:var(--ink-4)}
.zoom-top .zt-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.zoom-x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  color:var(--ink-3);background:#fff;border:1px solid var(--line);cursor:pointer}
.zoom-x:hover{background:var(--line-2);color:var(--ink)}
.zoom-stage{flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;
  cursor:grab;touch-action:none;user-select:none}
.zoom-stage.grabbing{cursor:grabbing}
.zoom-paper{background:#fff;border:1px solid var(--line);border-radius:6px;
  box-shadow:0 18px 50px rgba(60,48,38,.18);overflow:hidden;will-change:transform}
/* 位图：宽度自适应、高度按比例。不要用 width:100%（父宽由内容决定，会循环依赖） */
.zoom-paper img{display:block;width:auto;height:auto;
  max-width:min(86vw,880px);max-height:72vh}
.zoom-paper svg{display:block;width:100%;height:100%}
.zoom-paper.tiled{background-repeat:repeat;background-position:center}
.zoom-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px 18px;flex-wrap:wrap}
.zoom-bar .zb{height:32px;min-width:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;
  gap:5px;cursor:pointer;transition:.15s}
.zoom-bar .zb:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.zoom-bar .zb[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.zoom-bar .zz{font-size:12px;color:var(--ink-3);min-width:48px;text-align:center;
  font-variant-numeric:tabular-nums}
.zoom-bar .zhint{font-size:11px;color:var(--ink-4);margin-left:5px}
/* 图案可点击放大：光标提示 + 悬停浮出放大角标 */
.zoomable{cursor:zoom-in;position:relative}
.zoomable:hover .zoom-hint,.zoomable:focus-visible .zoom-hint{
  opacity:1;border-color:var(--accent);color:var(--accent)}
/* 常驻半透明：用户得先看见"这里能点开"，才谈得上用 */
.zoom-hint{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:7px;
  display:grid;place-items:center;background:rgba(255,255,255,.94);border:1px solid var(--line);
  color:var(--ink-2);opacity:.72;transition:.15s;pointer-events:none;z-index:2;
  box-shadow:0 1px 3px rgba(40,32,26,.12)}
.zoom-hint svg,.zoom-badge svg{display:block}
/* 嵌在可选按钮内的角标：常显一点，点了只放大不触发选择 */
.zoom-badge{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:6px;
  display:grid;place-items:center;background:rgba(255,255,255,.9);border:1px solid var(--line);
  color:var(--ink-3);font-size:11px;opacity:.72;transition:.15s;cursor:zoom-in;z-index:3;font-style:normal}
.zoom-badge:hover{opacity:1;color:var(--accent);border-color:var(--accent);background:#fff}
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px}
.modal{background:var(--paper);border-radius:var(--r-xl);box-shadow:var(--sh-3);
  width:min(660px,95vw);max-height:90vh;display:flex;flex-direction:column;
  animation:pop .2s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.modal.narrow{width:min(480px,95vw)}
.modal .mh{padding:17px 22px 0;flex:0 0 auto}
.modal .mh h3{margin:0;font-size:15.5px;font-weight:650}
.modal .mh p{margin:5px 0 0;font-size:12.5px;color:var(--ink-4)}
.modal .mb{padding:15px 22px;overflow:auto;flex:1;min-height:0}
.modal .mf{padding:0 22px 18px;display:flex;gap:9px;justify-content:flex-end;flex:0 0 auto}
.pack{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;text-align:left;transition:.16s;position:relative}
.pack:hover{border-color:#D6CEC3;transform:translateY(-2px);box-shadow:var(--sh-2)}
.pack[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pack .pr{font-size:18px;font-weight:660}
.pack .cr{font-size:12.5px;color:var(--jade);font-weight:620;margin-top:2px}
.pack .note{font-size:11px;color:var(--ink-4);margin-top:4px}
.pack .flag{position:absolute;right:10px;top:10px;font-size:10px;background:var(--gold-soft);color:#7A5C12;
  padding:1px 7px;border-radius:20px}
.qrbox{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:15px;margin-top:13px}
.qrbox .qr{width:112px;height:112px;flex:0 0 112px;border-radius:9px;border:1px solid var(--line);background:#fff}
/* 对话里的充值卡片（客服页）：金额档位 + 支付方式 + 二维码，一张卡片把事办完。
   复用弹窗那套 .pack / .qrbox 样式，这里只补支付方式那排和清单行。 */
.paycard{margin-top:10px;border:1px solid var(--line);border-radius:13px;background:#FBF9F6;padding:12px}
.paycard .pt-title{font-size:12.5px;font-weight:620;margin-bottom:9px}
.paym{display:flex;gap:7px;margin-top:11px}
.paym .pm{display:inline-flex;align-items:center;padding:6px 13px;border-radius:20px;cursor:pointer;
  border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink-3)}
.paym .pm:hover{border-color:var(--ink-4)}
.paym .pm[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft);font-weight:600}
.paycard .qrbox{margin-top:11px}
.paycard .pack{padding:10px}
.paycard .pack .pr{font-size:15.5px}
/* 导出清单的结果卡：把"整理了哪几款"当场列出来，用户不用点开文件才知道 */
.exlist{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.exlist .exrow{display:flex;gap:9px;align-items:baseline;font-size:12.5px;line-height:1.5}
.exlist .exrow .ix{color:var(--ink-4);font-size:11px;flex:0 0 15px}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.field input:focus{border-color:var(--ink-4)}
.switch{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.switch:last-child{border-bottom:none}
.switch .st{flex:1}
.switch .st b{display:block;font-size:13px;font-weight:600}
.switch .st span{font-size:11.5px;color:var(--ink-4)}
.tog{width:40px;height:23px;border-radius:20px;background:#D7D0C7;position:relative;transition:.18s;flex:0 0 40px}
.tog::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);transition:.18s}
.tog[aria-pressed="true"]{background:var(--jade)}
.tog[aria-pressed="true"]::after{transform:translateX(17px)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;
  box-shadow:var(--sh-3);animation:pop .18s ease;display:flex;align-items:center;gap:9px}
.toast.warn{background:#8E3A25}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:13px;align-items:start}
.mini-list{display:flex;flex-direction:column}
.mini-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.mini-row:last-child{border-bottom:none}
.mini-row .thumb{width:38px;height:38px;border-radius:8px;flex:0 0 38px;overflow:hidden;border:1px solid var(--line)}
.mini-row .meta{flex:1;min-width:0}
.mini-row .meta b{display:block;font-size:12.5px;font-weight:600}
.mini-row .meta span{font-size:11.5px;color:var(--ink-4)}
.mini-row .ops{display:flex;gap:7px;flex:0 0 auto}

@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(22px);opacity:.5}to{transform:none;opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:1080px){
  .two-col{grid-template-columns:1fr}
  .stage-head .tt span{display:none}
}
@media (max-width:880px){
  .rail{width:210px;flex:0 0 210px}
  .picker-grid{grid-template-columns:repeat(2,1fr)}
}
/* ============ 真图（库里的位图资产，管理见 /admin） ============ */
/* 库里的图是位图，SVG 花型是矢量 —— 同一个 .patternSVG 出口，这里只管图片本身 */
.lib-img{width:100%;height:100%;object-fit:cover;display:block;background:var(--line-2)}
/* 「拿这张改图」角标：只给库里的真图（有 image）挂，位置避开右下角的放大角标 */
.psel .use-badge{position:absolute;left:6px;bottom:6px;z-index:2;font-style:normal;font-size:10px;
  line-height:1;padding:3px 6px;border-radius:99px;background:rgba(33,30,27,.72);color:#fff;
  opacity:.92;transition:.15s}
.psel:hover .use-badge{opacity:1;background:var(--accent)}

/* =====================================================================
   2026-10 视觉重塑 ·「织物样本册」
   冷纸白 + 墨绿黑 + 靛蓝；宋体标题、苹方正文；发丝线代替重投影。
   这一层只改皮肤，不动任何交互类名 / 结构，旧样式作为兜底保留。
   ===================================================================== */
:root{
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  --ink:#18211E;
  --ink-2:#2F3A35;
  --ink-3:#5B6862;
  --ink-4:#8B968F;
  --line:#D9E0D7;
  --line-2:#E8EDE6;
  --paper:#F4F5F0;
  --card:#FFFFFF;
  --accent:#2A4A6B;
  --accent-soft:#E8EEF4;
  --accent-ink:#1E3750;
  --jade:#4F6F5E;
  --jade-soft:#E7EEE8;
  --gold:#96702A;
  --gold-soft:#F4EDDD;
  --blue:#2A4A6B;
  --blue-soft:#E8EEF4;
  --rail:#EDEFE8;
  --rail-hover:#E5E9E0;
  --rail-on:#FFFFFF;
  --stage:#F4F5F0;
  --r-s:4px; --r-m:8px; --r-l:12px; --r-xl:18px;
  --sh-1:0 1px 0 rgba(24,33,30,.035);
  --sh-2:0 10px 26px -18px rgba(24,33,30,.35), 0 1px 0 rgba(24,33,30,.04);
  --sh-3:0 30px 70px -32px rgba(24,33,30,.5), 0 2px 0 rgba(24,33,30,.05);
  --fs:14px;
}
body{background:var(--paper);font-family:var(--sans);letter-spacing:.005em;
  font-feature-settings:"tnum" 0;}
::selection{background:rgba(42,74,107,.16)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C8D0C6;border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#AEB9AC;background-clip:content-box}

/* ---------- 左栏 ---------- */

.brand .mark::after{display:none}
.brand .tx b{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.02em;line-height:1.25}
.brand .tx span{font-size:9.5px;letter-spacing:.32em;color:var(--ink-4);margin-top:2px}
.brand-pre{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;color:var(--accent);
  font-weight:600;vertical-align:1px}
.rail-scroll{padding:10px 10px 14px}
.nav-label{font-size:9.5px;letter-spacing:.22em;font-weight:600;color:var(--ink-4);
  padding:16px 10px 7px}
.row{border-radius:6px;padding:9px 10px;gap:11px;transition:background .16s,box-shadow .16s}
.row:hover{background:rgba(255,255,255,.6)}
.row[aria-current="true"]{background:var(--rail-on);box-shadow:0 1px 0 rgba(24,33,30,.05),0 8px 20px -16px rgba(24,33,30,.4)}

.row .av{width:32px;height:32px;flex:0 0 32px;border-radius:50%;
  background:var(--paper)!important;color:var(--ink-2)!important;
  border:1px solid var(--line);font-family:var(--serif);font-size:13px;font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.row[aria-current="true"] .av{background:var(--ink)!important;color:#F4F5F0!important;border-color:var(--ink)}
.row .av .dot{right:-1px;top:-1px;width:8px;height:8px;background:var(--jade);border:2px solid var(--rail-on)}
.row .tx b{font-size:13px;font-weight:600;letter-spacing:.01em}
.row .tx span{font-size:11px;color:var(--ink-4);margin-top:1px}
.row .badge{background:var(--accent);font-size:10px;height:16px;min-width:16px}
.row .badge.p1{background:var(--line);color:var(--ink-3)}
.row .pi{color:var(--ink-4)}
.rail-foot{padding:14px 18px 18px;border-top:1px solid rgba(24,33,30,.055);background:transparent}

/* =========================================================================

var SESSION_ID = 'pf-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

/* 服务地址候选：优先跟当前页面同源（服务顺便托管了原型页），
   再退回默认端口；换端口启动也不用改代码。file:// 打开时同源无效，直接走默认。 */
function agentCandidates(){
  var out = [];
  if (location.protocol === 'http:' || location.protocol === 'https:'){
    if (location.origin && location.origin !== 'null') out.push(location.origin);

  ['http://127.0.0.1:8787', 'http://localhost:8787'].forEach(function(u){

}

  if (!AGENT_API.online) return '未连接本地 Agent 服务，当前用离线规则';

   请求断掉、等待气泡撤掉、已经扣的点退回，界面立刻回到能接着聊的状态。 */
var ABORT = null, ABORTED = false, WAIT = null;
/* 跑动中的秒表 + 分层进度。
   分层 PSD 要逐层跑云端，一层几十秒起步、堵起来能到几分钟。界面必须能回答
   "跑了多久、跑到第几层" —— 否则用户分不清「在跑」和「死了」，只能干等。
   只改那几个小字的 textContent，不整页重渲染（免得滚动条乱跳）。 */
var RUN_TICK = null, RUN_SEC = 0, PSD_PROG = null;
function fmtDur(s){
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}
function runMetaText(){
  var t = '已等 ' + fmtDur(RUN_SEC);
  if (PSD_PROG && PSD_PROG.label && !PSD_PROG.total){
    /* 提案阶段（看图定层）没有"第几层"可报，就报它现在在做什么。
       这段时间里没有任何子进度，用户唯一的判断依据就是这行字 ——
       以前这里是空的、只剩秒表自己在走，看起来和卡死一模一样：
       「正在看图、定分层方案… 已等 1:11」被当成"半天没反应"投诉过。 */
    t = PSD_PROG.label + ' · ' + t;
  } else if (PSD_PROG && PSD_PROG.total){
    var i = Math.min(PSD_PROG.index || 1, PSD_PROG.total);
    t = '第 ' + i + '/' + PSD_PROG.total + ' 层 · ' + t;
  }
  /* 分层正常一两分钟，提案（看图定层）通常几秒、网络差也就一分钟。
     拖太久就得如实说，顺便把上限交代清楚 —— 用户最怕"不知道还要等多久"。 */
  if (RUN_SEC >= 300) t += '，云端在排队（超过 15 分钟会自动停并退点）';
  else if (RUN_SEC >= 60 && !(PSD_PROG && PSD_PROG.total))
    t += '，还在等云端回话，这一步最长两分钟';
  return t;
}
/* 服务端正在报"在做什么"吗？带 total 的是分层进度（那时要说的是第几层，
   不是阶段），只有 label 的才是阶段说明。 */
function liveLabel(){
  return (PSD_PROG && PSD_PROG.label && !PSD_PROG.total) ? PSD_PROG.label : '';
}
function paintRunMeta(){
  if (!WAIT) return;
  var nodes = document.querySelectorAll('.runmeta');
  for (var i = 0; i < nodes.length; i++) nodes[i].textContent = runMetaText();
  /* 服务端已经在报"正在做什么"了，气泡里那句静态的就得收起来 ——
     两句并排会变成「正在看图、定分层方案… 正在请视觉模型看这张图、定分层」，
     一个意思说两遍，反而看不清哪句是活的。
     这里只改显示/隐藏，不整页重渲染（免得滚动条乱跳）。 */
  var labs = document.querySelectorAll('.waitlabel');
  for (var j = 0; j < labs.length; j++) labs[j].style.display = liveLabel() ? 'none' : '';
}
function stopTicker(){
  if (RUN_TICK){ clearInterval(RUN_TICK); RUN_TICK = null; }
  RUN_SEC = 0; PSD_PROG = null;
}
function pollPsdProgress(){
  if (!hasFetch() || !AGENT_API.base) return Promise.resolve();
  /* 返回 promise：秒表那边不在乎，用例（和以后可能的调用方）要能 await */
  return fetch(AGENT_API.base + '/api/psd_progress').then(function(r){ return r.json(); })
    .then(function(d){ if (d && d.running){ PSD_PROG = d; paintRunMeta(); } })
    .catch(function(){});
}
function startTicker(psd){
  stopTicker();
  var beat = 0;
  RUN_TICK = setInterval(function(){
    RUN_SEC += 1;
    /* 分层每 2 秒问一次服务端跑到第几层，别更密（它只是小字） */
    if (psd && (beat++ % 2 === 0)) pollPsdProgress();
    paintRunMeta();
  }, 1000);
}
function beginRun(a, typingText, cost, meta){
  cancelWait(true);                      // 上一轮还在跑就直接让位给这一轮
  ABORTED = false;
  ABORT = (typeof AbortController === 'function') ? new AbortController() : null;
  var m = push(a, {typing:true, typingText:typingText || '', stop:true,
                   runMeta:true, psd:!!(meta && meta.psd)});
  WAIT = {a:a, m:m, cost:cost || 0};
  PSD_PROG = null;                       // 层数等第一次进度回来再摆，不编
  startTicker(m.psd);
  render();
  return WAIT;                           // 令牌＝这一轮的记录，回调拿它判断自己还算不算数
}
/* 这一轮还算数吗？被「终止」过、或者已经被新消息顶掉的旧回调，
   回调回来时不能再往界面上写东西（否则会把新一轮的等待气泡误删掉）。 */
function staleRun(token){ return !token || token !== WAIT || ABORTED; }
/* 正常收尾：把等待气泡摘掉。传进来的 wait 可能已经被 start 换过，所以按 WAIT 摘。 */
function endRun(){
  stopTicker();
  var w = WAIT;
  if (w){
    var list = S.chat[w.a] || [], i = list.indexOf(w.m);
    if (i >= 0) list.splice(i, 1);
  }
  ABORT = null; WAIT = null; ABORTED = false;
}
function cancelWait(silent){
  stopTicker();
  var w = WAIT;
  if (!w) return 0;
  ABORTED = true;
  if (ABORT && ABORT.abort){ try{ ABORT.abort(); }catch(e){} }
  var list = S.chat[w.a] || [], i = list.indexOf(w.m);
  if (i >= 0) list.splice(i, 1);
  if (w.cost) S.credits += w.cost;       // 没拿到成品，点数退回（跟失败退点是同一条规则）
  ABORT = null; WAIT = null;
  if (!silent){
    push(w.a, {text: w.cost
      ? '好，不等了。这次没出成品，' + w.cost + ' 点已经退回你账户，想换个方向再来一次随时说。'
      : '好，停下了，点数一点没动。换个说法、或者重新描述一下都行，我接着来。'});
  }
  render();
  return 1;
}
/* 「终止」不只是前端的事：服务端那边算法子进程还在跑云端任务
   （分层逐层跑、四方连续补缝），只 abort 自己那条 fetch 的话它会一路
   跑到超时，用户以为停了、钱还在扣，界面上再问进度报的还是那个被放弃的任务。
   所以终止要顺带通知服务端一次。fire-and-forget：用户要的是"立刻停"，
   不能因为这条请求慢就卡住界面，也不带 ABORT 的 signal（它必须发出去）。 */
function notifyStop(){
  if (!hasFetch() || !AGENT_API.base) return;
  fetch(AGENT_API.base + '/api/action', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'cancel_run', agent:S.agent, session_id:SESSION_ID})
  }).catch(function(){});
}
function abortRun(){ notifyStop(); cancelWait(false); }
function pingAgent(){
  if (!AGENT_API.enabled) return;
  if (!hasFetch()){ AGENT_API.online = false; render(); return; }
  var list = AGENT_API.tried.length ? AGENT_API.tried : agentCandidates();
  var i = 0;
  function step(){
    if (i >= list.length){ AGENT_API.online = false; render(); return; }
    var base = list[i++];
    fetch(base + '/api/health').then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.ok) throw new Error('bad health');
      AGENT_API.base = base; AGENT_API.tried = list;
      AGENT_API.online = true;
      AGENT_API.model = d.model || '';
      AGENT_API.keyless = !d.llm_enabled;
      trackVisit();
      render();
    }).catch(step);
  }
  if (!AGENT_API.base) step();
  else fetch(AGENT_API.base + '/api/health').then(function(r){ return r.json(); }).then(function(d){
    AGENT_API.online = !!(d && d.ok); AGENT_API.model = d.model || '';
    AGENT_API.keyless = !d.llm_enabled; trackVisit(); render();
  }).catch(function(){ AGENT_API.base = ''; pingAgent(); });
}
/* 需求卡只属于花型师这条链路。织印师描的是照片，把设计师的配色带过去，
   它就会拿设计师的需求卡去指导描稿（用户明确说过不要这样）。 */
function briefAgent(a){ return a === 'designer' || a === 'auto'; }
function apiChat(agent, text, cb, image){
  var payload = {agent:agent, message:text, session_id:SESSION_ID};
  if (briefAgent(agent)) payload.brief = S.brief;
  /* 「我的花型清单」：客服要按"用户历史选中"的花型导清单，所以每次都把
     当前选中整份同步给服务端（覆盖式，不是追加）。别的角色用不上，
     也一并带上 —— 少一处"哪个角色才发"的判断，就少一处漏发的机会。 */
  payload.selected = S.confirmed.map(function(c){ return c.pid; });
  if (image) payload.image = image;
  if (!hasFetch()){ cb(false, null); return; }
  var body = JSON.stringify(payload);
  fetch(AGENT_API.base + '/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:body,
    signal:(ABORT ? ABORT.signal : undefined)
  }).then(function(r){ return r.json(); }).then(function(d){ cb(true, d); })
    .catch(function(){ cb(false, null); });
}
function mergeBrief(remote){
  ['style','element','color','scene'].forEach(function(k){
    if (remote && remote[k]) S.brief[k] = remote[k];

}

/* --- 确定性伪随机 --- */
function rng(seed){
  var s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function(){ s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
}
var SVID = 0;
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

/* --- 花型基元绘制 --- */
function motifDots(R,P){
  var o = '';
  for (var x = 0; x < 4; x++) for (var y = 0; y < 4; y++){
    var cx = 12 + x*24 + (y%2?6:0), cy = 12 + y*24, rr = R();
    if (rr < .18) continue;
    o += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(3.2+rr*3.6).toFixed(1)+'" fill="'+P[1+Math.floor(R()*3)]+'"/>';
    o += '<circle cx="'+(cx+2).toFixed(1)+'" cy="'+(cy-2).toFixed(1)+'" r="1.1" fill="'+P[0]+'" opacity=".7"/>';
  }
  return o;
}
function petal(cx,cy,rad,n,fill,rot){
  var o = '';
  for (var i = 0; i < n; i++){
    var a = (Math.PI*2/n)*i + (rot||0);
    o += '<ellipse cx="'+(cx+Math.cos(a)*rad*.62).toFixed(2)+'" cy="'+(cy+Math.sin(a)*rad*.62).toFixed(2)+
      '" rx="'+(rad*.46).toFixed(2)+'" ry="'+(rad*.3).toFixed(2)+
      '" transform="rotate('+(a*180/Math.PI).toFixed(1)+' '+(cx+Math.cos(a)*rad*.62).toFixed(2)+' '+(cy+Math.sin(a)*rad*.62).toFixed(2)+')" fill="'+fill+'"/>';
  }
  return o;
}
function motifBloom(R,P){
  var o = '', cols = [P[1],P[2],P[3],P[4]];
  for (var x = 0; x < 3; x++) for (var y = 0; y < 3; y++){
    var cx = 16 + x*36 + (y%2?14:0), cy = 16 + y*36, rad = 7 + R()*4.5;
    var c = cols[Math.floor(R()*cols.length)];
    o += petal(cx,cy,rad,5+Math.floor(R()*2),c, R()*1.2);
    o += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(rad*.24).toFixed(2)+'" fill="'+P[4]+'" opacity=".85"/>';
    o += '<ellipse cx="'+(cx+9).toFixed(1)+'" cy="'+(cy+9).toFixed(1)+'" rx="4.6" ry="1.9" transform="rotate(-38 '+(cx+9).toFixed(1)+' '+(cy+9).toFixed(1)+')" fill="'+P[1]+'" opacity=".8"/>';
    o += '<ellipse cx="'+(cx-9).toFixed(1)+'" cy="'+(cy+10).toFixed(1)+'" rx="4.6" ry="1.9" transform="rotate(38 '+(cx-9).toFixed(1)+' '+(cy+10).toFixed(1)+')" fill="'+P[1]+'" opacity=".8"/>';
  }

}
function motifLeaf(R,P){
  var o = '';
  for (var i = 0; i < 7; i++){

    o += '<path d="M0 0 C7 -6 15 -3 16 0 C15 3 7 6 0 0 Z" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+
      ') rotate('+a.toFixed(1)+') scale('+s.toFixed(2)+')" fill="'+P[2+Math.floor(R()*2)]+'"/>';

function motifVine(R,P){

function motifGeo(R,P){

function motifAnimal(R,P){

function motifInk(R,P){

var MOTIF_FN = {dots:motifDots, bloom:motifBloom, leaf:motifLeaf, vine:motifVine, geo:motifGeo,
  animal:motifAnimal, stripe:motifStripe, check:motifCheck, shell:motifShell, ink:motifInk};

function patternSVG(p, opt){
  opt = opt || {};
  /* 花型库里存的是**位图**（客户来图 / AI 出图 / 描稿成品），内置款是程序画的矢量。
     同一个出口：有 image 就出 <img>，其余照旧走 SVG。
     这样所有调用点（对话卡片、选择弹窗、交付页、放大层）都不用改。 */
  if (p && p.image){
    var src = opt.full ? (p.full || p.image) : (p.image || p.full);
    return '<img class="lib-img" src="' + esc(src) + '" alt="' + esc(p.name || '花型') +
           '" loading="lazy">';
  }
  /* 画图案的参数缺一个都画不出来（MOTIF_FN[undefined] 会直接抛）。
     这里是所有出口的公共入口，兜一层底 —— 宁可画成一张通用的花，也不能让
     一次异常把整个弹窗/列表带崩。 */
  var motif = MOTIF_FN[p.motif] ? p.motif : 'bloom';
  var uid = 'pf' + (++SVID);
  var P = PALETTES[p.pal] || PALETTES.morandi;
  var R = rng(p.seed || 1);
  var body = MOTIF_FN[motif](R, P);
  var bg = P[0];
  var base = 104;

/* ---------------------------------------------------------------------------
   本地花型库（真图）
   PAT 是统一的「图案注册表」：内置矢量款和库里的真图都放这儿，
   渲染处只认 PAT[id]，不必关心这是一张图片还是程序画的。
   库里存的是真的图片文件，标签由 AI 打过（见 core/tagger.py）。
   --------------------------------------------------------------------------- */
/* 服务端给的是 /api/... 相对地址；原型可能从 file:// 打开，
   图片必须补成绝对地址才加载得出来。注册时一次转好，渲染处直接用。 */
function absURL(u){
  if (!u) return u;
  return (u.indexOf('http') === 0) ? u : ((AGENT_API.base || '') + u);
}
/* 把服务端检索回来的条目登记进 PAT。
   **必须是合并，不能直接覆盖**：服务端的检索结果里既有花型库的真图，也有
   「内置款」——后者只回 id/名字/四维标签，**没有** motif / pal / seed 这几个
   画图案的参数。直接 PAT[id] = it 会把本地这套参数抹掉，之后选择弹窗渲染缩略图时
   MOTIF_FN[undefined] 抛异常，整个「打开花型选择」就再也点不开了。
   （实测踩过：后端一上线内置款就跟着回传，弹窗必崩。） */
function registerLibItems(items){
  (items || []).forEach(function(it){
    if (!it || !it.id) return;
    var merged = {};
    var prev = PAT[it.id] || {};
    Object.keys(prev).forEach(function(k){ merged[k] = prev[k]; });
    Object.keys(it).forEach(function(k){
      if (it[k] === undefined || it[k] === null) return;   // 空值不覆盖已有的
      merged[k] = it[k];
    });
    if (merged.image) merged.image = absURL(merged.image);
    if (merged.full) merged.full = absURL(merged.full);
    PAT[it.id] = merged;
  });
}

var UP_KEEP_MB = 3;            // 未超限且不超过这个体积 → 原图直传，不做任何处理

function compressImage(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb('文件读取失败'); };
  fr.onload = function(){
    var src = String(fr.result || '');
    var done = function(dataUrl, w, h, ow, oh){
      cb(null, {dataUrl:dataUrl, w:w, h:h, origW:ow, origH:oh,
                scaled: !!(ow && oh && (w < ow || h < oh)),
                name:file.name, size:file.size});
    };
    var img = new Image();
    img.onerror = function(){ done(src, 0, 0, 0, 0); };     // 读不出尺寸也照样发原图
    img.onload = function(){
      var ow = img.width || 0, oh = img.height || 0;
      var needScale = Math.max(ow, oh) > UP_MAX_PX;
      var tooHeavy = file.size > UP_KEEP_MB * 1024 * 1024;
      if (!needScale && !tooHeavy) return done(src, ow, oh, ow, oh);  // 没超限又不大 → 原样发送
      try {
        var s = needScale ? (UP_MAX_PX / Math.max(ow, oh)) : 1;
        var w = Math.max(1, Math.round(ow * s)), h = Math.max(1, Math.round(oh * s));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);        // PNG 透明底压成 JPEG 会发黑，先铺白
        g.drawImage(img, 0, 0, w, h);
        done(c.toDataURL('image/jpeg', 0.85), w, h, ow, oh);
      } catch (e) { done(src, ow, oh, ow, oh); }             // 没有 canvas（如测试环境）就用原图
    };
    img.src = src;
  };
  fr.readAsDataURL(file);
}
function takeImageFile(file){
  if (!file) return;
  if (!/^image\//.test(file.type || '')){
    push(S.agent, {text:'只支持图片文件，收到的是「' + esc(file.name || '未知文件') + '」。'});
    return render();
  }
  if (file.size > UP_MAX_MB * 1024 * 1024){
    push(S.agent, {text:'这张图有 ' + (file.size / 1048576).toFixed(1) + 'MB，超过 ' + UP_MAX_MB +
      'MB 上限。请先压缩或换一张小一点的。'});
    return render();
  }
  compressImage(file, function(err, info){
    if (err){ push(S.agent, {text:'图片处理失败：' + esc(err)}); return render(); }
    S.pending = info;
    render();
    var ta = document.getElementById('input');
    if (ta) ta.focus();
  });
}

function mdLine(s){
  return esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');

function richText(text){
  var out = '', buf = [];
  function flush(){ if (buf.length){ out += '<p>' + buf.join('<br>') + '</p>'; buf = []; } }
  String(text).split('\n').forEach(function(line){
    var t = line.replace(/\s+$/, '');
    if (/^\s*>/.test(t)){ flush(); out += '<div class="qline">' + mdLine(t.replace(/^\s*>\s?/, '')) + '</div>'; }
    else if (!t.trim()) flush();
    else buf.push(mdLine(t));
  });
  flush();
  return out;
}

  });
  var wrap = list.length > 1 ? '<div class="genimgs grid">' + one + '</div>' : one;
  // 改图按钮只挂在当前这张图上——改的是系统里记的最新底图，挂旧图上会误导
  if (m.id && m.id === genOf(m.agent).editMsgId){
    /* regenOnly：只给「重新生成」，不给「接着改」那一排维度。
       四方连续的产物是一张成品单元图，没有配色/疏密可改（要改得回花型师改底图），
       但它是能做分层的 —— 所以再挂一个「生成 PSD 文件」的直通车。 */
    wrap += m.regenOnly
      ? '<div class="edit-bar"><span class="lab">接着做：</span>' +
        psdBtnHTML(list) + regenBtnHTML() + '</div>'
      : (m.engNext ? engineerNextHTML() : editBarHTML());
  }
  /* 交给织印师：会话记忆按机器人分开存 —— 花型师刚出的这张图，织印师那边
     是看不见的（用户明确要求过「不要出现跨机器人记忆」）。要接着做四方连续、
     分层 PSD，得由用户点这一下显式交手：点的是用户，来源和目标都写在脸上。
     排在「接着改」后面 —— 先给这条线的下一步，跨线加工是第二位的。 */
  if ((m.agent || 'designer') !== 'engineer' && list.length){
    wrap += '<div class="edit-bar"><span class="lab">要接着加工：</span>' +
      list.map(function(f, i){
        return '<button class="opt" data-act="handoff" data-url="' + esc(f.url) + '">' +
          '交给织印师' + (list.length > 1 ? '（第 ' + (i + 1) + ' 张）' : '') + ' →</button>';
      }).join('') + '</div>';
  }
  return wrap;
}
/* ---------- 附带文件：不是图片的产出（分层 PSD 本体）走这里下载 ----------
   bare=true 时只出按钮，不摆「下载文件」标签 —— 分层 PSD 就是这种情况：

function downloadRowHTML(m, bare){

    var size = f.bytes ? Math.round(f.bytes / 1024) + ' KB' : '';

      esc(f.label || f.name || 'file') + '" href="' + href + '">' +

/* 描稿之后的两个选项是**并列的两条路**，不合成一条流水线：
     做四方连续 —— 只把这张图变成可平铺的单元图，不碰分层；做完给图时再提示可以做 PSD；
     直接生成 PSD —— 拿这张描稿去分层，不先做连续。
   不摆「接着改」那一排维度 —— 描稿是忠实提取，改配色/疏密度属于花型师那条链路。
   底图已经躺在织印师这一槽里，所以按钮直接走提案直通车（不绕模型，仍要用户确认才扣点）。 */
function engineerNextHTML(){

function editBarHTML(){

      h += '<button class="opt" data-act="ed:dim:' + d.key + '">' + esc(d.label) + '</button>';

/* 自定义：色板只给常用档，用户想说的颜色不一定在里面（「淡红」就不在）。
   点「自定义…」直接在按钮行里换成输入框——不整页重渲染，所以不会打字打到一半丢字。 */
function editCustomPrompt(dim){
  var bar = document.querySelector('.edit-bar');
  if (!bar) return;
  var d = EDIT_DIMS.filter(function(x){ return x.key === dim; })[0];
  var label = d ? d.label.replace('改', '') : dim;
  bar.classList.add('ed-custom');
  bar.innerHTML = '<span class="lab">' + esc(label) + '改成：</span>' +
    '<input class="ed-input" type="text" value="" spellcheck="false" ' +
    'placeholder="直接写，比如「淡红」「雾霾蓝」" aria-label="自定义' + esc(label) + '">' +
    '<button class="opt go" data-act="ed:apply">用这个</button>' +
    '<button class="opt" data-act="ed:cancel">取消</button>';
  var inp = bar.querySelector('.ed-input');
  if (!inp) return;
  inp.focus();
  inp.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); applyCustomEdit(dim); }
    if (ev.key === 'Escape'){ ev.preventDefault(); S.editDim = null; render(); }
  });
}
function applyCustomEdit(dim){
  var inp = document.querySelector('.ed-input');
  var v = inp ? String(inp.value || '').trim() : '';
  if (!v){ toast('先写一个再点「用这个」'); return; }
  runEdit(dim, v);
}
/* 重新生成：按同一套参数再出一版。跟「改图」同级，所以同一排里并排放。

}
/* 「生成 PSD 文件」：四方连续的成品单元图往往就是要拿去分层的。

/* 还原度三档：在卡片上直接点，不用在对话框里打字描述 */
var FID_OPTS = [
  {key:'strict', label:'严格复刻',   hint:'元素位置、造型照照片，不做美化'},
  {key:'clean',  label:'清晰化重绘', hint:'默认 · 保留特征，画得更干净'},
  {key:'vector', label:'简化描摹',   hint:'合并碎细节，适合印花分色'}
];
function fidRowHTML(p){
  var cur = p.fidelity || 'clean';
  var hint = '';
  FID_OPTS.forEach(function(o){ if (o.key === cur) hint = o.hint; });
  return '<div class="fid-row"><span class="fl">还原度</span>' +
    FID_OPTS.map(function(o){
      return '<button class="fid' + (o.key === cur ? ' on' : '') + '" data-act="set-fid"' +
        ' data-fid="' + o.key + '" aria-pressed="' + (o.key === cur) + '"' +
        ' title="' + esc(o.hint) + '">' + esc(o.label) + '</button>';
    }).join('') +
    '<span class="fd">' + esc(hint) + '</span></div>';
}
/* 张数：一次出几张。默认按后台配的来的（默认 4 张），
   用户在卡片上点了就按点的来 —— 报价跟着张数走，改张数本身不扣点。
   「我要一张」这种要求必须点得到，不能靠模型心情。 */
var CNT_OPTS = [1, 2, 4];
function cntRowHTML(p){
  var cur = parseInt(p.count, 10) || 4;
  var unit = cur > 0 && p.cost ? Math.round(p.cost / cur) : 60;
  var opts = CNT_OPTS.slice();
  if (opts.indexOf(cur) < 0) opts.push(cur);     // 后台配了别的张数也要显示出来
  opts.sort(function(a, b){ return a - b; });
  return '<div class="cnt-row"><span class="fl">一次出</span>' +
    opts.map(function(k){
      return '<button class="cnt' + (k === cur ? ' on' : '') + '" data-act="set-cnt"' +
        ' data-n="' + k + '" aria-pressed="' + (k === cur) + '">' + k + ' 张</button>';
    }).join('') +
    '<span class="fd">每张 ' + unit + ' 点 · 改张数不扣点，点「确认生成」才扣</span></div>';
}
/* 四方连续的图片判断结果。只摆一句"能不能做"的结论；
   特征数字、路线这些留给排查，不往用户脸上摆。 */
function seProbeHTML(p){
  var pr = p.probe || {};
  if (!pr.summary) return '';
  var detail = (pr.warnings || []).join('；');
  return '<div class="qc-line ok">' +
    '<b>图片判断</b><span>' + esc(pr.summary) +
    (detail ? '<br>' + esc(detail) : '') + '</span></div>';
}
/* 路线：纯算法直出 vs 模型补缝。体检会给建议，但按钮照摆 ——
   用户要是坚持走模型补缝，也照办，不替他拍板。 */
var SE_OPTS = [
  {key:'pure',  label:'纯算法直出', hint:'几十秒 · 不调模型 · 边界逐像素对齐，不会漏缝'},
  {key:'model', label:'模型补缝',   hint:'慢一两分钟 · 在接缝处真正补出新内容'}
];
function engineRowHTML(p){
  var cur = p.engine || 'model';
  var hint = '';
  SE_OPTS.forEach(function(o){ if (o.key === cur) hint = o.hint; });
  return '<div class="fid-row"><span class="fl">路线</span>' +
    SE_OPTS.map(function(o){
      return '<button class="fid' + (o.key === cur ? ' on' : '') + '" data-act="set-eng"' +
        ' data-eng="' + o.key + '" aria-pressed="' + (o.key === cur) + '"' +
        ' title="' + esc(o.hint) + '">' + esc(o.label) + '</button>';
    }).join('') +
    '<span class="fd">' + esc(hint) + '</span></div>';
}
function confirmCardHTML(p){
  var cost = p.cost || 0;
  var act = p.action || '';
  var isEdit = act === 'edit_pattern';
  var isTrace = /trace/.test(act);
  var isSeamless = act === 'seamless_pattern';
  var isLayer = act === 'layer_psd';
  var label = isSeamless ? '四方连续方案'
            : (isLayer ? '分层方案'
            : (isTrace ? '描稿方案' : (isEdit ? '改图方案' : '生成方案')));
  var btn = isSeamless ? '开始做连续'
          : (isLayer ? '确认分层'
          : (isTrace ? '确认描稿' : (isEdit ? '确认修改' : '确认生成')));
  var qc = '';
  /* 描稿：照片体检结果单独摆出来。质量不好要用户自己看见，再决定花不花这点数。 */
  if (isTrace && p.qc && p.qc.level && p.qc.level !== 'unknown'){
    var lv = {good:['质量良好','ok'], fair:['质量一般','warn'], poor:['质量较差','bad']}[p.qc.level]
             || ['已体检','']; 
    var det = (p.qc.issues || []).join('；');
    qc = '<div class="qc-line ' + lv[1] + '"><b>照片体检 · ' + lv[0] + '</b>' +
         (det ? '<span>' + esc(det) + '</span>' : '') + '</div>';
  }
  if (isSeamless) qc = seProbeHTML(p);
  return '<div class="confirm-card">' +
    '<div class="ttl">' + label + ' · <span class="pt">' + cost + ' 点</span></div>' +
    qc +
    /* 2026-10-20：描稿去掉还原度三档、四方连续改自动策略，两行控件不再显示 */
    '' +
    /* 张数只对生成有意义：四方连续是一张确定性的产物，不是出几张挑一张；
       改图、描稿本来就按底图出，也不该问张数；分层 PSD 同理，就一个文件。 */
    ((isEdit || isTrace || isSeamless || isLayer) ? '' : cntRowHTML(p)) +
    /* 四方连续：体检结论和方案摘要现在是同一句，别重复摆两遍 */
    ((isSeamless && p.probe && p.probe.summary === (p.summary || '')) ? '' :
      '<div class="sum">' + esc(p.summary || '') + '</div>') +
    '<div class="ops">' +
      '<button class="opt main" data-act="confirm-gen">' +
        btn + '（' + cost + ' 点）</button>' +
      '<button class="opt" data-act="cancel-gen">先不要</button>' +
    '</div></div>';
}
/* 切还原度：让服务端重跑一次提案（只换卡片，不执行、不扣点） */
function setFidelity(fid){
  if (!fid) return;
  var a = S.agent;
  var list = S.chat[a] || [];
  var m = null;
  var g = genOf(a);
  for (var i = list.length - 1; i >= 0; i--){
    if (list[i].pendingCard && (!g.msgId || list[i].id === g.msgId)){ m = list[i]; break; }
  }
  if (!m) return;
  apiAction({action:'set_fidelity', fidelity:fid}, function(ok, d){
    if (ok && d && d.ok && d.pending){
      m.pendingCard = confirmCardHTML(d.pending);
      g.cost = d.pending.cost || 0;
    } else {
      toast('还原度没切成，请再点一次');
    }
    render();
  });
}
/* 切张数：同样让服务端重跑提案（只换卡片、不执行、不扣点），报价跟着张数走 */
function setCount(n){
  n = parseInt(n, 10) || 0;
  if (n < 1) return;
  var a = S.agent;
  var list = S.chat[a] || [];
  var m = null;
  var g = genOf(a);
  for (var i = list.length - 1; i >= 0; i--){
    if (list[i].pendingCard && (!g.msgId || list[i].id === g.msgId)){ m = list[i]; break; }
  }
  if (!m) return;
  apiAction({action:'set_count', n:n}, function(ok, d){
    if (ok && d && d.ok && d.pending){
      m.pendingCard = confirmCardHTML(d.pending);
      g.cost = d.pending.cost || 0;
      g.count = d.pending.count || n;
    } else {
      toast('张数没改成，请再点一次');
    }
    render();
  });
}
/* 四方连续切路线（纯算法 / 模型补缝）：同样让服务端重跑一次提案，
   只换卡片、不执行、不扣点。用户按下确认才真正开始做。 */

   引擎层：计时器、通知、任务状态机
   ========================================================================= */
var TIMERS = new Map(), TSEQ = 0, TID = 1003, MID = 0;
function later(fn, ms){
  var id = ++TSEQ;
  var t = setTimeout(function(){ TIMERS.delete(id); fn(); }, ms);
  TIMERS.set(id, {t:t, fn:fn}); return id;
}
function flushTimers(){
  var guard = 0;
  while (TIMERS.size && guard++ < 800){
    var entries = Array.from(TIMERS.entries());
    entries.forEach(function(e){
      clearTimeout(e[1].t); TIMERS.delete(e[0]); e[1].fn();
    });
  }
}
function toast(text, warn){
  var box = document.getElementById('toastbox');
  var el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = text;
  box.innerHTML = ''; box.appendChild(el);
  later(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
}
function spend(n){
  if (S.credits < n){ toast('点数不足，还差 ' + (n - S.credits) + ' 点', true); openRecharge(); return false; }
  S.credits -= n; return true;
}
function newTask(type, pid, silent){
  var T = TASK_TYPES[type];
  var t = { tid:'TJ-' + String(TID++), type:type, pid:pid, status:'wait', progress:0, step:0 };
  t.statusText = function(){
    return {wait:'待确认，等待你同意扣费',
      run:'生成中 · ' + TASK_TYPES[t.type].steps[Math.min(t.step, TASK_TYPES[t.type].steps.length - 1)],
      done:'已完成，可下载', fail:'失败，点数已退回'}[t.status] + ' · 消耗 ' + T.cost + ' 点';
  };
  S.tasks.unshift(t);
  if (!silent) render();
  return t;
}
function confirmTask(tid){
  var t = S.tasks.filter(function(x){ return x.tid === tid; })[0];
  if (!t) return;
  var T = TASK_TYPES[t.type];
  if (!spend(T.cost)) return;
  S.ledger.push({t:T.name + ' · ' + (PAT[t.pid] ? PAT[t.pid].name : ''), amt:-T.cost, at:stamp(), kind:'out'});
  t.status = 'run'; t.step = 0; t.progress = 0;
  render();
  runTask(t);
}
function runTask(t){
  var T = TASK_TYPES[t.type], n = T.steps.length;
  function advance(){
    t.step++; t.progress = Math.round(t.step / n * 100);
    if (t.step >= n){
      t.status = 'done'; t.progress = 100;
      var p = PAT[t.pid];
      S.assets.unshift({name:p.name + '_' + p.id + '_' + t.tid + '_600dpi.png', pid:p.id,
        fmt: t.type === 'psd' ? 'PSD · 分层' : (t.type === 'trace' ? 'SVG + PNG' : 'PNG/TIFF/PSD'),
        at: stamp(), pts: T.cost, type: t.type, tid: t.tid});
      renderChrome();
      if (S.page === 'tasks' || S.page === 'assets') render();
      toast('任务完成：' + T.name + ' · ' + p.name + '，已加入任务中心与交付记录');
      return;
    }
    if (S.page === 'tasks') render();
    later(advance, 560);
  }
  later(advance, 560);
}
function stamp(){
  var d = new Date();
  function z(x){ return String(x).padStart(2, '0'); }
  return z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

function genOf(a){
  a = a || S.agent;
  if (!S.gen) S.gen = {};
  if (!S.gen[a]) S.gen[a] = {cost:0, action:'', msgId:null, editMsgId:null};
  return S.gen[a];

function push(agent, msg){
  if (!S.chat[agent]) S.chat[agent] = [];
  msg.agent = agent; msg.id = 'm' + (++MID);
  S.chat[agent].push(msg);
  return msg;
}
function say(text){
  var raw = String(text || '').trim();
  var img = S.pending;
  if (!raw && !img) return;
  var a = S.agent;
  /* 发送后要清空输入框。render() 会把 textarea 里的旧值回填（那是打字中途重渲染用的），
     所以先把 DOM 里的值抹掉，render 才不会再抓到这个旧值放回去。 */
  var ta0 = document.getElementById('input');
  if (ta0){ ta0.value = ''; ta0.style.height = 'auto'; }
  push(a, {me:true, text:raw, image:img && img.dataUrl, imgName:img && img.name,
           imgNote:imgNoteOf(img)});
  S.pending = null;
  render();
  if (AGENT_API.enabled){
    var tok = beginRun(a, img ? '正在看图' : '', 0);
    apiChat(a, raw, function(ok, data){
      if (staleRun(tok)) return;      // 被终止 / 被新消息顶掉：这次结果直接丢
      endRun();
      if (ok && data && data.ok){
        /* 检索命中的完整资料先注册进 PAT：picks 只回 id，
           而花型库里的真图得靠这份资料才拿得到 image 地址。 */
        registerLibItems(data.picks_items || []);
      }
      if (ok && data && data.ok && data.reply){
        if (briefAgent(a)) mergeBrief(data.brief);
        var m = push(a, {text:data.reply});
        if (data.images && data.images.length){
          m.images = data.images;
          m.mock = !!data.mock;
          genOf(a).editMsgId = m.id;
          S.editDim = null;
        }
        if (data.pending){
          // 模型只提方案，按钮由本地渲染；点数记下来，确认时才扣。
          // 状态按机器人存：切到别的机器人页时，这份方案不会被顺手用掉。
          m.pendingCard = confirmCardHTML(data.pending);
          var pg = genOf(a);
          pg.msgId = m.id;
          pg.cost = data.pending.cost || 0;
          pg.action = data.pending.action || '';
        } else if (data.picks && data.picks.length){
          S.picks = data.picks.slice();
          push(a, {card:pickerCardHTML(data.picks.length)});
        } else if (a === 'designer'){
          /* 快捷条（风格/元素/配色/场景候选 + 「看流行趋势推荐」）是**花型师问需求**
             才该有的东西。客服/织印师没有需求卡，给它们挂一排花型风格按钮毫无意义 ——
             用户在客服那边问充值，底下却冒出「法式浪漫 / 看流行趋势推荐」，看着像串台。 */
          var qc = quickCard(data.reply);
          if (qc) m.card = qc;
        }
        /* 导出清单：表格文件是服务端按"用户历史选中的花型"生成的，
           这里挂结果卡 + 真实下载按钮（downloadRowHTML 认 m.files）。 */
        var extra = '';
        if (data.export) extra += exportCardHTML(data.export);
        /* 充值：用户这句话就是要充值/买点数，直接把充值卡片摆在他眼前
           （金额档位 + 微信/支付宝 + 二维码）。按**用户说了什么**判断，
           不按模型回复里出现了什么词 —— 模型换个说法就漏挂，那体验就成了抽奖。
           只存标记：卡片每轮由 payCardHTML() 按实时状态重画，点了支付方式要立刻变。 */
        if (a === 'assistant' && wantsRecharge(raw)) m.paycard = true;
        if (extra) m.card = extra + (m.card || '');
        if (data.downloads && data.downloads.length) m.files = data.downloads;
        if (data.image_tags) m.tags = data.image_tags;
      } else if (img && a === 'designer'){
        // 服务不通时不编造识图结果
        push(a, {text:'识图需要本地 Agent 服务，现在连不上，所以我不猜这张图是什么。' +
          '启动服务后重新上传一次即可；或者你直接用文字告诉我风格 / 元素 / 配色 / 场景，我照样给你找。'});
      } else {
        reply(a, raw);
      }
      render();
    }, img && img.dataUrl);
  } else if (img){
    push(a, {text:'识图需要本地 Agent 服务，现在是离线规则模式，我不猜这张图是什么。' +
      '启动服务后重新上传即可。'});
    render();
  } else {
    later(function(){ reply(a, raw); }, 400);
  }
}
/* ---------- 生图 / 改图：用户点按钮后由服务端执行 ---------- */
function apiPost(path, body, cb){
  /* 花型库那几个接口用的通用 POST。不塞 session_id / agent ——
     库是资产不是会话，跟"在哪个机器人页面上"没关系。 */
  if (!hasFetch() || !AGENT_API.base){ cb(false, null); return; }
  fetch(AGENT_API.base + path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body || {})
  }).then(function(r){ return r.json(); }).then(function(d){ cb(true, d); })
    .catch(function(){ cb(false, null); });
}
function apiAction(payload, cb){
  payload.session_id = SESSION_ID;
  /* 带上「是在哪个机器人页面上点的」：服务端靠它只动这一个角色自己的待确认方案，
     否则花型师的「改风格」会跑去执行织印师留着的那份描稿（真出过这个 bug）。 */
  if (!payload.agent) payload.agent = S.agent;
  if (!hasFetch()){ cb(false, null); return; }
  fetch(AGENT_API.base + '/api/action', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload),
    signal:(ABORT ? ABORT.signal : undefined)
  }).then(function(r){ return r.json(); }).then(function(d){ cb(true, d); })
    .catch(function(){ cb(false, null); });
}
function showGenResult(a, wait, d, ok, prefix){
  endRun();
  /* 分层 PSD 只回一个 PSD 下载、没有任何预览图，所以成功判定不能只看 images ——
     否则做好的 PSD 会掉进下面的 else，被报成「没跑通」。 */
  var isLayer = !!(d && d.action === 'layer_psd');
  var isSeamless = !!(d && d.action === 'seamless_pattern');
  var okD = !!(ok && d && d.ok);
  var hasImg = !!(okD && d.images && d.images.length);
  var hasDl  = !!(okD && isLayer && d.downloads && d.downloads.length);
  if (hasImg || hasDl){
    /* 是不是描稿，以服务端实际执行的动作为准 —— 别再靠 d.fidelity 猜：
       只要别处残留下这个字段，普通改图也会被标成「描稿仿稿」。 */
    var isTrace = d.action ? d.action === 'trace_pattern' : !!d.fidelity;
    var n = (d.images || []).length;
    var head = prefix || '图出来了。';
    if (isLayer) head = '分层做好了。';
    else if (isSeamless) head = '四方连续做好了。';
    else if (n > 1) head = (isTrace ? '描稿完成。' : '') +
      '这次一次出了 ' + n + ' 张，挑合意的用。'
    var m = push(a, {text:head +
      (d.mock ? '注意：这张是本地占位图，说明还没配生图 Key——在 config/secrets.json 填 image_api_key 后出真图。'
              : (isLayer ? '点下面的按钮下载分层 PSD，打开就是分好的图层，叠起来和原图逐像素一样。'
              : (isSeamless ? '点开大图，下方切「平铺预览」就能看铺开后的效果；想留档就在放大界面里下载。要分层的话，点下面的「生成 PSD 文件」就能把这张单元图做成分层 PSD。'
              : (isTrace ? '这是按照片提取的平面花型稿；接下来可以只做四方连续（变成能平铺的单元图），也可以直接拿这张描稿生成分层 PSD —— 点下面选一个就行。'
                         : '觉得哪张方向对，直接说编号，我接着在那张上调；也能改配色、疏密度、元素。')))),
      /* 分层结果不显示任何分层预览图，也不挂「接着改 / 重新生成」—— 交付就是一个 PSD 文件 */
      images:isLayer ? null : d.images, mock:!!d.mock, model:d.model || '',
      files:d.downloads || null, bareDl:isLayer,
      genLabel:(isSeamless ? '四方连续' : (isTrace ? '描稿仿稿' : (d.changes ? '改图' : 'AI 生成花型'))),
      /* 四方连续的产物是成品单元图：不给「接着改」，只留「重新生成」 */
      regenOnly:isSeamless,
      /* 描稿的产物是平面花型稿：下一步只有「四方连续 / 分层 PSD」两条，
         不再摆改配色/疏密那一排 —— 那是花型师那条链路的事。 */
      engNext:isTrace,
      /* 记下这一版的出图参数，点「重新生成」时原样回传给服务端重放 */
      gen:(isLayer ? null : (d.gen || null)),
      genCost:(d.cost || genOf(a).cost || 0)});
    /* 改图与重放只对「能改的图」有意义，分层 PSD 不参与，别把编辑锚点指到它身上 */
    if (!isLayer){ genOf(a).editMsgId = m.id; }
    S.editDim = null;
    /* 设计师生图成功后服务端会把需求卡清空，这里同步清本地那份 */
    if (d.brief_reset) resetBriefSilent();
    /* 出的图服务端会在后台打标签收进花型库（settings.json → library.auto_ingest）。
       分层 PSD 是文件不是图，不进这套逻辑；其余产物（生成/改图/描稿/四方连续）
       都留档，可以顺口说一句"下次能直接找出来" */
    if (!isLayer && !d.mock && d.ingested !== false){
      /* 不说「收进花型库」—— 库是内部资产，用户不需要知道有这个仓库。
         对他有意义的只有一句：这些图留下来了，下次能直接找出来。 */
      toast(n + ' 张图已经帮你留好了，下次提同样的需求我直接找出来');
    }
  } else {
    var why = (d && (d.error || d.message)) || '本地服务没响应';
    var failAct = (d && d.action) || (genOf(a) && genOf(a).action) || '';
    var failWho = /seamless/.test(failAct) ? '四方连续'
                : /trace/.test(failAct) ? '描稿'
                : /layer_psd/.test(failAct) ? '分层'
                : /edit/.test(failAct) ? '改图' : '生图';
    push(a, {text:why.indexOf('。') >= 0 || why.indexOf('\n') >= 0
      ? failWho + '没跑通。\n' + why
      : failWho + '没跑通：' + why + '。'});
  }
  render();
}
function runGen(){
  var a = S.agent, g = genOf(a), cost = g.cost || 0;
  var isTrace = /trace/.test(g.action || '');
  /* 分层 PSD：跑起来是"逐层跑云端"，气泡里要带秒表和层数进度 */
  var isPsd = /layer_psd/.test(g.action || '');
  if (cost && !spend(cost)) return;
  var tok = beginRun(a,
    isTrace ? '正在从照片提取图案' : (isPsd ? '正在分层' : '正在生成花型'),
    cost, isPsd ? {psd:true} : null);
  apiAction({action:'confirm'}, function(ok, d){
    if (staleRun(tok)) return;
    if (!ok || !(d && d.ok)) { if (cost) S.credits += cost; }   // 失败退点
    showGenResult(a, null, d, ok, isTrace ? '描稿完成。' : '图出来了。');
  });
}
function runEdit(dim, value){
  var a = S.agent, cost = genOf(a).cost || 0;
  var dimObj = EDIT_DIMS.filter(function(x){ return x.key === dim; })[0];
  var dimName = dimObj ? dimObj.label.replace('改', '') : dim;
  push(a, {me:true, text:'把' + dimName + '改成' + value});
  S.editDim = null;
  if (cost && !spend(cost)) return;
  var tok = beginRun(a, '正在改' + dimName, cost);
  var args = {}; args[dim] = value;
  apiAction({action:'edit_pattern', args:args}, function(ok, d){
    if (staleRun(tok)) return;
    if (!ok || !(d && d.ok)) { if (cost) S.credits += cost; }
    showGenResult(a, null, d, ok, dimName + '改好了。');
  });
}
/* ---------- 重新生成：按同一套参数再出一版 ---------- */
function findMsg(a, id){
  var list = S.chat[a] || [];
  for (var i = list.length - 1; i >= 0; i--){ if (list[i].id === id) return list[i]; }
  return null;
}
/* 需求卡重置：服务端出图成功后自己会清，这边同步把本地那份也清掉
   （不清的话，界面上还挂着上一张的配色/风格，接着提需求就会被粘住） */
function resetBriefSilent(){
  S.brief = {style:null, element:null, color:null, scene:null};
  S.rounds.designer = 0;
  toast('需求卡已重置，可以直接说下一个需求');
}
function runRegen(){
  var a = S.agent;
  var msg = findMsg(a, genOf(a).editMsgId);
  var isTrace = !!(msg && /描稿/.test(msg.genLabel || ''));
  var cost = (msg && msg.genCost) || genOf(a).cost || 0;
  push(a, {me:true, text:isTrace ? '再描一版' : '重新生成一版'});
  S.editDim = null;
  if (cost && !spend(cost)) return;
  var tok = beginRun(a, isTrace ? '正在重新描稿' : '正在重新生成', cost);
  /* 参数优先用图里带回的那份：需求卡出图后已清空，服务端也留了兜底 */
  apiAction({action:'regenerate', args:{spec:(msg && msg.gen) || null}},
    function(ok, d){
      if (staleRun(tok)) return;
      if (!ok || !(d && d.ok)) { if (cost) S.credits += cost; }   // 失败退点
      showGenResult(a, null, d, ok, '又出了一版。');
    });
}
function cancelGen(){
  var a = S.agent;
  var list = S.chat[a] || [];
  for (var i = list.length - 1; i >= 0; i--){
    if (list[i].pendingCard){ list[i].pendingCard = null; break; }
  }
  apiAction({action:'cancel'}, function(){});
  var g = genOf(a);
  g.cost = 0; g.action = ''; g.msgId = null;
  push(a, {text:'好，那先放着，点数一点没动。想换个方向随时喊我，我马上重新提方案。'});
  render();
}
function editAct(spec){
  var p = spec.split(':');
  if (p[0] === 'dim'){ S.editDim = p[1]; render(); return; }
  if (p[0] === 'custom'){ editCustomPrompt(S.editDim); return; }
  if (p[0] === 'apply'){ applyCustomEdit(S.editDim); return; }
  if (p[0] === 'cancel'){ S.editDim = null; render(); return; }
  if (p[0] === 'do' && p[1] && p[2]){ runEdit(p[1], p[2]); return; }
}
function reply(a, raw){
  S.agent = a;

  if (a === 'engineer') return replyEngineer(raw);

}

/* --- 设计师对话策略 --- */
function replyDesigner(raw){
  var got = extract(raw);
  Object.keys(got).forEach(function(k){ S.brief[k] = got[k]; });
  var skip = UNCLEAR.some(function(k){ return raw.indexOf(k) >= 0; });
  var missing = briefMissing();

  if (skip){ return showPicks(missing); }

  if (briefFilled().length === 0){
    S.rounds.designer = 1;
    return askDim('style', '先从哪里开始都行——你希望这个花型偏什么感觉？',
      '也可以先告诉我用途场景，比如「春夏连衣裙」或「家居窗帘」。');
  }
  if (missing.length === 0) return showPicks([]);
  if (S.rounds.designer >= 3) return showPicks(missing);

  S.rounds.designer++;
  var next = missing.indexOf('element') >= 0 ? 'element' : missing[0];
  var q = {
    style:'这个花型主要想表达什么风格？',
    element:'画面里希望出现什么元素？',
    color:'配色上有偏好吗？',
    scene:'最后用在什么品类上？'
  }[next];
  return askDim(next, q, '不确定可以直接说「不知道」，我会按已知条件先出候选。');
}
function askDim(dim, q, note){
  var d = DIMS.filter(function(x){ return x.key === dim; })[0];
  var opts = d.opts.slice(0, 4).map(function(o){ return {label:o, say:o}; });
  opts.push({label:'不知道', say:'不知道'});
  opts.push({label:'看流行趋势推荐', trend:true});
  var r = {text:q + (note ? '\n' + note : ''), card:optCard('', opts)};
  r.agent = 'designer'; push('designer', r); render();
}
/* --- 模型回复后补一排快捷选项：先猜它在问哪一维，再给该维的候选值 --- */
function guessAskDim(text){
  var t = String(text || ''), missing = briefMissing();
  if (!missing.length) return null;
  var hit = null;
  missing.forEach(function(k){
    if (hit) return;
    var d = DIMS.filter(function(x){ return x.key === k; })[0], clue = 0;
    if (t.indexOf(d.label) >= 0) clue += 3;
    d.opts.forEach(function(o){ if (t.indexOf(o) >= 0) clue += 1; });
    if (clue >= 1) hit = k;
  });
  return hit || missing[0];
}
/* 用受控词表的同义词反查：模型在回复里提到的取值按出现先后挑出来，
   这样按钮跟它嘴上说的一致；不够 4 个再按词表顺序补。 */
function mentionedIn(text, dim){
  var m = KEYMAP[dim] || {}, t = String(text || '').toLowerCase(), found = [];
  for (var k in m){
    var i = t.indexOf(k.toLowerCase());
    if (i < 0) continue;
    var v = m[k], ex = null;
    found.forEach(function(f){ if (f.v === v) ex = f; });
    if (ex){ if (i < ex.i) ex.i = i; }
    else found.push({v:v, i:i});
  }
  found.sort(function(a, b){ return a.i - b.i; });
  return found.map(function(f){ return f.v; });
}
function quickCard(text){
  var k = guessAskDim(text);
  if (!k) return '';
  var d = DIMS.filter(function(x){ return x.key === k; })[0];
  var picked = mentionedIn(text, k).slice(0, 4);
  d.opts.forEach(function(o){
    if (picked.length < 4 && picked.indexOf(o) < 0) picked.push(o);
  });
  var opts = picked.map(function(o){ return {label:o, say:o}; });
  opts.push({label:'不知道', say:'不知道'});
  opts.push({label:'看流行趋势推荐', trend:true});
  return optCard('', opts);
}

function optCard(title, opts){
  return (title ? '<div style="margin-top:10px"><div class="small muted" style="margin-bottom:6px">' + esc(title) + '</div>' : '<div style="margin-top:10px">') +
    '<div class="opt-row">' + opts.map(function(o){
      if (o.trend) return '<button class="opt trend" data-trend-advice="1"><span class="em">↗</span>' + esc(o.label) + '</button>';
      var attr = o.act ? 'data-act="' + o.act + '"' : 'data-say="' + esc(o.say) + '"';
      return '<button class="opt" ' + attr + '>' + esc(o.label) + '</button>';

    var hit = 0, conflict = 0;
    known.forEach(function(k){
      if (t.tags[k] === S.brief[k]) hit++; else conflict++;

    return {t:t, hit:hit, conflict:conflict};
  });
  scored.sort(function(a, b){ return (b.hit - b.conflict) - (a.hit - a.conflict) || a.t.id.localeCompare(b.t.id); });
  var pool = scored.filter(function(x){ return x.conflict === 0; });
  if (pool.length < 3) pool = scored;
  return pool.slice(0, 3).map(function(x){ return x.t; });
}

/* --- 后台检索（不对外展示，仅供机器人调取） --- */
/* 按需求卡的四维标签检索：命中维度多的排在前面，不足时按匹配度补足候选数 */
function searchBrief(limit){
  limit = limit || 8;
  var known = briefFilled();
  var scored = PATTERNS.map(function(p){
    var hit = 0;
    known.forEach(function(k){ if (p[k] === S.brief[k]) hit++; });
    return {p:p, hit:hit, score:matchScore(p)};
  });
  scored.sort(function(a, b){
    return b.hit - a.hit || b.score - a.score || (b.p.heat - a.p.heat);
  });
  var out = scored.filter(function(x){ return x.hit > 0; });
  if (out.length < limit){
    scored.forEach(function(x){ if (x.hit === 0 && out.length < limit) out.push(x); });
  }
  return out.slice(0, limit).map(function(x){ return x.p; });
}
function filtered(){
  var f = S.filters, q = (f.q || '').trim().toLowerCase();
  return PATTERNS.filter(function(p){
    if (f.style.length && f.style.indexOf(p.style) < 0) return false;
    if (f.element.length && f.element.indexOf(p.element) < 0) return false;
    if (f.color.length && f.color.indexOf(p.color) < 0) return false;
    if (f.scene.length && f.scene.indexOf(p.scene) < 0) return false;
    if (q){
      var hay = (p.name + ' ' + p.id + ' ' + p.style + ' ' + p.element + ' ' + p.color + ' ' + p.scene + ' ' + p.desc + ' ' + p.l2.join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a, b){ return matchScore(b) - matchScore(a) || b.heat - a.heat; });
}
function matchScore(p){
  var dims = 0, hit = 0;
  ['style','element','color','scene'].forEach(function(k){
    if (S.brief[k]){ dims++; if (S.brief[k] === p[k]) hit++; }
  });
  var bonus = 0;
  ['style','element','color','scene'].forEach(function(k){
    if (S.filters[k] && S.filters[k].indexOf(p[k]) >= 0) bonus += 6;
  });
  /* 热度是本地程序款的字段，库里的真图没有 —— 不兜底的话算出来是 NaN，
     详情页会显示「匹配度 NaN%」。 */
  var heat = Number(p.heat) || 0;
  if (!dims) return Math.min(96, 62 + Math.round(heat * 0.2) + bonus);
  return Math.max(46, Math.min(99, Math.round(52 + (hit / dims) * 42 + bonus)));
}

function outCount(pid, type){
