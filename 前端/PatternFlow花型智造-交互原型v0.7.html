/* 与 patternSVG 使用同一套随机序列，保证导出图与界面预览一致 */
function motifBody(p){
  var P = PALETTES[p.pal] || PALETTES.morandi;
  var R = rng(p.seed || 1);
  return (MOTIF_FN[p.motif] || MOTIF_FN.bloom)(R, P);

function exportSVG(p, opt){
  opt = opt || {};
  var unit = 104, n = opt.tiles || 1, W = unit * n;
  var P = PALETTES[p.pal] || PALETTES.morandi;
  var layers = opt.layers ? P.slice(0, 5) : [];
  var bandH = layers.length ? 44 : 0;
  var H = unit * n + bandH;
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (W * 4) + '" height="' + (H * 4) +
    '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<defs><pattern id="tile" patternUnits="userSpaceOnUse" width="' + unit + '" height="' + unit + '">' +
    '<rect width="' + unit + '" height="' + unit + '" fill="' + P[0] + '"/>' + motifBody(p) +
    '</pattern></defs>' +
    '<rect width="' + W + '" height="' + (unit * n) + '" fill="url(#tile)"/>';
  if (layers.length){
    var seg = W / layers.length;
    s += '<rect y="' + (unit * n) + '" width="' + W + '" height="' + bandH + '" fill="#FFFFFF"/>';
    layers.forEach(function(c, i){
      s += '<g id="layer-' + (i + 1) + '">' +
        '<rect x="' + (i * seg + 4) + '" y="' + (unit * n + 7) + '" width="' + (seg - 8) + '" height="22" fill="' + c + '"/>' +
        '<text x="' + (i * seg + 4) + '" y="' + (unit * n + 41) + '" font-size="7" fill="#6B635A">图层' + (i + 1) + ' ' + c.toUpperCase() + '</text>' +
        '</g>';
    });
  }
  return s + '</svg>';
}

    /* 顺手记下这颗 <img> 的自然宽度：平铺预览拿它当单元尺寸基准，
       否则一张 500px 的四方连续单元图会被压成 100px，接缝根本看不清 */
    var im = (el.tagName === 'IMG') ? el : el.querySelector('img');
    var src = d.src || (im && im.getAttribute('src'));
    if (!src) return;
    openZoom({kind:'img', src:src, cap:d.cap, sub:d.sub,
              natW:(im && im.naturalWidth) || 0});
    return;
  }
  openZoom({kind:d.zoom, pid:d.pid, cap:d.cap, sub:d.sub});
}

/* cfg: {kind:'img'|'pat'|'tile', src, pid, cap, sub} */
function openZoom(cfg){
  if (!cfg || !cfg.kind) return;
  /* 花型库里的是位图：转进 img 通道，用**原图**看细节。
     位图同样给「平铺预览」—— 四方连续的交付就是一张单元图，铺开看接缝最直接
     （平铺源见下面 ZOOM.bgUrl）。 */
  if (cfg.kind !== 'img' && cfg.pid){
    var lp = PAT[cfg.pid];
    if (lp && lp.full){
      cfg = {kind:'img', src:lp.full, cap:cfg.cap || lp.name,
             sub:cfg.sub || [lp.id, lp.style, lp.element].filter(Boolean).join(' · ')};
    }
  }
  if (cfg.kind !== 'img' && !PAT[cfg.pid]) return;
  /* 花型没给标题就自己补上，省得每个调用点都写一遍 */
  if (cfg.kind !== 'img'){
    var pp = PAT[cfg.pid];
    if (!cfg.cap) cfg.cap = pp.name;
    if (!cfg.sub) cfg.sub = pp.id + ' · ' + pp.style + ' · ' + pp.element;
  }
  ZOOM.item = cfg;
  ZOOM.s = 1; ZOOM.x = 0; ZOOM.y = 0; ZOOM.drag = null; ZOOM.moved = false;
  ZOOM.tiled = cfg.kind === 'tile';          // 平铺入口进来就直接是平铺态
  /* 平铺单元尺寸：矢量花型按窗口比例铺；位图按它自己的宽度铺 */
  ZOOM.unit = (cfg.kind === 'img' && cfg.natW > 40)
    ? Math.min(480, Math.round(cfg.natW * 0.75))
    : Math.max(60, Math.round(zoomBase() * 0.3));
  /* 位图的平铺源就是它自己：四方连续的交付就是一张单元图，铺开看接缝最直接。
     花型库那类位图同样受益（以前这里对位图直接禁掉了平铺）。 */
  ZOOM.bgUrl = cfg.kind === 'img'
    ? (cfg.tile || cfg.src || '')
    : zoomTileURL(PAT[cfg.pid]);
  ZOOM.open = true;
  var z = document.getElementById('zoom');
  if (!z) return;
  z.hidden = false;
  zoomRender();
  zoomApply();
}
function closeZoom(){
  ZOOM.open = false; ZOOM.item = null; ZOOM.drag = null; ZOOM.moved = false;
  var z = document.getElementById('zoom');
  if (z){ z.hidden = true; z.innerHTML = ''; }
}
function zoomRender(){
  var z = document.getElementById('zoom'), it = ZOOM.item;
  if (!z || !it) return;
  /* 平铺时纸面铺满，单张时纸面按内容尺寸 */

      '<div class="zoom-top"><span class="zt-cap">' + esc(it.cap || '图案') + ' · 平铺预览</span>' +
        '<span class="zt-sub">' + esc(it.sub || (p ? p.id : '')) + '</span>' +
        '<span class="zt-right">' +
        '<button class="zoom-x" data-act="zoom-close" title="关闭（Esc）" aria-label="关闭">✕</button></span></div>' +
      '<div class="zoom-stage" id="zstage"><div class="zoom-paper tiled" id="zpaper"></div></div>' +
      zoomBarHTML();
    return;
  }
  var paper = it.kind === 'img'
    ? '<div class="zoom-paper" id="zpaper"><img src="' + esc(it.src || '') +
      '" alt="' + esc(it.cap || '图案') + '"></div>'
    : '<div class="zoom-paper" id="zpaper">' + patternSVG(PAT[it.pid]) + '</div>';
  z.innerHTML =
    '<div class="zoom-top"><span class="zt-cap">' + esc(it.cap || '图案') + '</span>' +
      (it.sub ? '<span class="zt-sub">' + esc(it.sub) + '</span>' : '') +
      '<span class="zt-right">' +
      '<button class="zoom-x" data-act="zoom-close" title="关闭（Esc）" aria-label="关闭">✕</button></span></div>' +
    '<div class="zoom-stage" id="zstage">' + paper + '</div>' +
    zoomBarHTML();
}
function zoomBarHTML(){
  var it = ZOOM.item || {};
  /* 平铺预览对位图也开放：四方连续的交付就是一张单元图，
     直接在放大层里铺开看接缝，比另存一张 3×3 预览图更直接 */
  var tileBtn = !ZOOM.bgUrl ? '' :
    '<button class="zb" data-act="zoom-tile" aria-pressed="' + String(!!ZOOM.tiled) + '">' +
    (ZOOM.tiled ? '单张预览' : '平铺预览') + '</button>';
  /* 真实产出的位图只能在这里下载。
     四方连续那类产物按用户要求**不进花型库**，那就必须留一个能拿走文件的出口，
     否则用户只看得见、拿不走。花型库的图也会进这个通道（转成了 img），一并受益。 */
  var dlBtn = (it.kind === 'img' && it.src)
    ? '<button class="zb" data-act="zoom-dl" title="下载这张图保存到本地">⤓ 下载</button>' : '';
  return '<div class="zoom-bar">' +
    '<button class="zb" data-act="zoom-out" title="缩小">&minus;</button>' +
    '<span class="zz" id="zpct">' + Math.round(ZOOM.s * 100) + '%</span>' +
    '<button class="zb" data-act="zoom-in" title="放大">+</button>' +
    '<button class="zb" data-act="zoom-fit">适应窗口</button>' +
    tileBtn + dlBtn +

}
/* 下载放大层里这张图。页面里只可能出现两种 src：
   后端 /api/file/xxx（同源，跨端口不算）和上传图的 data: URL。两种都能用 <a download> 拿。 */
function zoomFilename(src, cap){
  if (String(src).indexOf('data:') === 0){
    var m = /^data:image\/([a-z0-9.+-]+)/i.exec(src);
    var ext = ((m && m[1]) || 'png').toLowerCase();
    if (ext === 'jpeg' || ext === 'jpg') ext = 'jpg';
    return (cap || '花型') + '.' + ext;
  }
  var tail = String(src).split('?')[0].split('#')[0].split('/').pop() || '';
  if (!tail) return (cap || '花型') + '.png';
  try { return decodeURIComponent(tail); } catch(e){ return tail; }
}
function zoomDownload(){
  var it = ZOOM.item || {};
  if (!it.src){ toast('这张图还没有可下载的文件'); return; }
  var name = zoomFilename(it.src, it.cap);
  try {
    /* 脱离文档的 <a download>：与 saveSVG 同一套做法，浏览器与 jsdom 下都能触发 */
    var a = document.createElement('a');
    a.href = it.src;
    a.download = name;
    a.click();
  } catch(e){ toast('下载没打开，再点一次试试'); return; }
  toast('已开始下载：' + name);
}
function zoomApply(){
  var it = ZOOM.item; if (!it) return;
  var paper = document.getElementById('zpaper'); if (!paper) return;
  var base = zoomBase();
  /* 纸面尺寸：位图按内容、花型正方形、平铺铺满 stage —— 都在 layout 层定，缩放只走 transform */
  if (ZOOM.tiled){
    var st = document.getElementById('zstage');
    var sw = (st && st.clientWidth) || base, sh = (st && st.clientHeight) || base;
    paper.style.width = Math.max(200, sw - 24) + 'px';
    paper.style.height = Math.max(160, sh - 24) + 'px';
    paper.style.backgroundImage = 'url("' + ZOOM.bgUrl + '")';
    var u = Math.max(6, Math.round(ZOOM.unit * ZOOM.s)) + 'px';
    paper.style.backgroundSize = u + ' ' + u;
    paper.style.backgroundPosition =
      'calc(50% + ' + ZOOM.x + 'px) calc(50% + ' + ZOOM.y + 'px)';
    paper.style.transform = 'none';
  } else if (it.kind === 'img'){
    paper.style.transform = 'translate(' + ZOOM.x + 'px,' + ZOOM.y + 'px) scale(' + ZOOM.s + ')';
  } else {
    paper.style.width = base + 'px';
    paper.style.height = base + 'px';
    paper.style.transform = 'translate(' + ZOOM.x + 'px,' + ZOOM.y + 'px) scale(' + ZOOM.s + ')';
  }
  var n = document.getElementById('zpct');
  if (n) n.textContent = Math.round(ZOOM.s * 100) + '%';
}
function zoomStep(f){
  ZOOM.s = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, ZOOM.s * f));
  zoomApply();
}
function zoomFit(){ ZOOM.s = 1; ZOOM.x = 0; ZOOM.y = 0; zoomApply(); }
function zoomToggleTile(){
  var it = ZOOM.item; if (!it) return;
  /* 位图也能平铺：四方连续的单元图就是这么验收接缝的。没有平铺源才不给切。 */
  if (!ZOOM.bgUrl) return;
  ZOOM.tiled = !ZOOM.tiled;
  ZOOM.x = 0; ZOOM.y = 0;
  zoomRender(); zoomApply();
}
/* 拖动平移 */
document.addEventListener('mousedown', function(e){
  if (!ZOOM.open || !e.target.closest) return;
  var st = e.target.closest('#zstage');
  if (!st) return;
  ZOOM.drag = {x:e.clientX, y:e.clientY, ox:ZOOM.x, oy:ZOOM.y};
  ZOOM.moved = false;
  st.classList.add('grabbing');
  e.preventDefault();
});
document.addEventListener('mousemove', function(e){
  if (!ZOOM.open || !ZOOM.drag) return;
  var dx = e.clientX - ZOOM.drag.x, dy = e.clientY - ZOOM.drag.y;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) ZOOM.moved = true;
  ZOOM.x = ZOOM.drag.ox + dx;
  ZOOM.y = ZOOM.drag.oy + dy;
  zoomApply();
});
document.addEventListener('mouseup', function(){
  if (!ZOOM.drag) return;
  ZOOM.drag = null;
  var st = document.getElementById('zstage');
  if (st) st.classList.remove('grabbing');
});
/* 滚轮缩放 */
document.addEventListener('wheel', function(e){
  if (!ZOOM.open || !e.target.closest) return;
  if (!e.target.closest('#zstage')) return;
  if (e.preventDefault) e.preventDefault();
  zoomStep((e.deltaY || 0) < 0 ? 1.16 : 1 / 1.16);
}, {passive:false});
/* 点空白处关闭（拖完那一下不算） */
document.addEventListener('click', function(e){
  if (!ZOOM.open) return;
  var z = document.getElementById('zoom');
  if (!z) return;
  if (e.target === z || e.target.id === 'zstage'){
    if (ZOOM.moved){ ZOOM.moved = false; return; }
    closeZoom();
  }
});
function fakeQR(seed){
  /* 演示用二维码图形（不是真支付码）。换支付方式时换个种子，
     图案就跟着变 —— 两种方式挂同一个码会让人以为选错了。 */
  var R = rng(seed || 20260926), o = '', n = 29;
  function finder(ox, oy){
    return '<rect x="' + ox + '" y="' + oy + '" width="7" height="7" fill="#211E1B"/>' +
      '<rect x="' + (ox + 1) + '" y="' + (oy + 1) + '" width="5" height="5" fill="#fff"/>' +
      '<rect x="' + (ox + 2) + '" y="' + (oy + 2) + '" width="3" height="3" fill="#211E1B"/>';
  }
  o += '<rect width="' + n + '" height="' + n + '" fill="#fff"/>';
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++){
    if ((x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9)) continue;
    if (R() > .52) o += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#211E1B"/>';
  }
  o += finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7);
  return o;
}

function csvDownload(name, rows){
  var csv = rows.map(function(r){
    return r.map(function(c){
      var s = (c === null || c === undefined) ? '' : String(c);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');
  var blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  triggerDownload(url, name);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* 花型详情里的「生成（30 点）」/「重新生成」：要哪道工序是确定的（repeat / psd）。
   有真图的款（库图、已入库的 AI 图）走**真实链路** —— 先把这张图交给织印师，
   再由他提案、报价，用户在卡片上确认才扣点；
   纯本地程序款手里没有位图（服务端也没有这张图），交付不了，退回原型卡片。 */
var MKTASK_SKILL = {repeat:'seamless_pattern', psd:'layer_psd'};
function mkTask(type, pid){
  closeLayer();
  var T = TASK_TYPES[type], p = PAT[pid];
  if (!p) return;
  S.page = 'engineer'; S.agent = 'engineer';
  push('engineer', {me:true, text:'把「' + p.name + '」做成' + T.name + '。'});
  render();
  if (MKTASK_SKILL[type] && (p.image || p.full)){
    deliverToEngineer({pid:pid}, function(){
      proposeForEngineer(MKTASK_SKILL[type], '正在看图、定方案');
    });
    return;
  }
  later(function(){ offerTask(type, pid); }, 380);
}
function runFromChat(type, pid){
  closeLayer();
  var T = TASK_TYPES[type], p = PAT[pid];
  if (!p) return;
  S.agent = 'engineer';
  if (!spend(T.cost)) return;
  S.ledger.push({t:T.name + ' · ' + p.name, amt:-T.cost, at:stamp(), kind:'out'});
  push('engineer', {me:true, text:'确认执行，扣 ' + T.cost + ' 点。'});
  var task = newTask(type, pid, true);
  task.status = 'run'; task.step = 0; task.progress = 0;
  S.page = 'tasks'; render();
  runTask(task);
  return task;
}

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-page],[data-act],[data-open],[data-mktask],[data-run],[data-say],' +
    '[data-zoom],[data-trend],[data-trend-advice],[data-pick],[data-newpick],[data-pick-type],[data-pack],[data-pack-pick],' +
    '[data-pay-pack],[data-flag],[data-confirm],[data-cancel],[data-download],[data-retry],[data-dlrec],' +
    '[data-regen],[data-dlfile],[data-dl-origin],' +
    '[data-pick-use]') : null;
  if (!el) return;
  var d = el.dataset;

  /* 放大查看优先级最高：嵌在可选按钮里的角标也要能点开，且不触发选择 */
  if (d.zoom){ zoomOpenFrom(el, d); return; }
  if (d.page){ go(d.page); return; }
  if (d.open){ openDrawer(d.open); return; }
  if (d.say){ say(d.say); return; }
  if (d.pickUse){ pickUseAsBase(d.pickUse); return; }
  if (d.trendAdvice){ trendAdvice(); return; }
  if (d.trend){ applyTrend(d.trend); return; }
  if (d.pick){ pickerToggle(d.pick); return; }
  if (d.newpick){
    var i = NEWT.sel.indexOf(d.newpick);
    if (i >= 0) NEWT.sel.splice(i, 1); else NEWT.sel.push(d.newpick);
    el.setAttribute('aria-pressed', String(NEWT.sel.indexOf(d.newpick) >= 0));
    var box = document.getElementById('newsel');
    if (box) box.innerHTML = '已选 <b>' + NEWT.sel.length + '</b> 款花型';
    return;
  }
  if (d.pickType){
    NEWT.type = d.pickType;
    document.querySelectorAll('[data-pick-type]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.pickType === NEWT.type)); });
    return;
  }
  if (d.mktask){
    var parts = d.mktask.split('|');
    mkTask(parts[0], parts[1]);
    return;
  }
  if (d.run){
    var rp = d.run.split('|');
    runFromChat(rp[0], rp[1]);
    return;
  }
  if (d.confirm){ confirmTask(d.confirm); return; }
  if (d.cancel){
    S.tasks = S.tasks.filter(function(t){ return t.tid !== d.cancel; });
    toast('已取消任务，未产生扣费'); render(); return;
  }
  if (d.download){
    var t = S.tasks.filter(function(x){ return x.tid === d.download; })[0];
    if (t) toast('开始下载交付包：' + TASK_TYPES[t.type].name + ' · ' + PAT[t.pid].name);
    return;
  }
  if (d.retry){
    var t2 = S.tasks.filter(function(x){ return x.tid === d.retry; })[0];
    if (t2){ t2.status = 'run'; t2.step = 0; t2.progress = 0; render(); runTask(t2); }
    return;
  }
  if (d.dlOrigin){ dlOrigin(d.dlOrigin); return; }
  if (d.dlfile){
    var dp = d.dlfile.split('|');
    dlMade(dp[0], dp[1]);
    return;
  }
  if (d.regen){
    var gp = d.regen.split('|');
    mkTask(gp[0], gp[1]);
    return;
  }
  if (d.dlrec){ dlRecord(Number(d.dlrec)); return; }
  if (d.pack){ openRecharge(d.pack); return; }
  if (d.packPick){ selectPack(d.packPick); return; }
  if (d.payPack){ selectPayPack(d.payPack); return; }
  if (d.flag){
    var on = el.getAttribute('aria-pressed') === 'true';
    el.setAttribute('aria-pressed', String(!on));
    return;
  }
  if (d.act && d.act.indexOf('ed:') === 0){ editAct(d.act.slice(3)); return; }
  if (d.act && ACTS[d.act]) ACTS[d.act](d, el);
});

/* ========== 埋点 ==========
   只报「发生了什么」：来路、待了多久、点了哪个按钮、什么时候走的。
   **不报聊天内容** —— 那已经在会话记录里了，统计用不上第二份。
   一律 fire-and-forget：上报失败就失败，绝不能让用户点不动。 */
var TRACK = (function(){
  var t0 = Date.now(), visited = false;
  function base(){ return (AGENT_API && AGENT_API.base) || ''; }
  function send(event, extra){
    try {
      if (!base() || !hasFetch()) return false;
      var body = {event:event, session_id:SESSION_ID, agent:S.agent, page:S.page,
                  dwell:Math.round((Date.now() - t0) / 1000)};
      for (var k in (extra || {})) if (extra[k] != null) body[k] = extra[k];
      var raw = JSON.stringify(body);
      /* 离开页面时普通 fetch 会被浏览器掐掉，所以优先走 sendBeacon。 */
      if (event === 'leave' && navigator.sendBeacon){
        try {
          navigator.sendBeacon(base() + '/api/track',
            new Blob([raw], {type:'application/json'}));
          return true;
        } catch (e){}
      }
      fetch(base() + '/api/track', {method:'POST',
        headers:{'Content-Type':'application/json'}, body:raw, keepalive:true})
        .catch(function(){});
      return true;
    } catch (e){ return false; }
  }
  /* 点了哪个按钮：优先 data-act，其余按 dataset 里第一个动作键取名 */
  function actOf(el){
    var d = (el && el.dataset) || {};
    if (d.act) return String(d.act).slice(0, 40);
    var keys = ['say','pick','newpick','packPick','pack','mktask','run','page','open',
                'zoom','download','retry','confirm','cancel','trendAdvice','trend',
                'pickUse','pickType','dlOrigin','dlfile','dlrec','regen','flag'];
    for (var i = 0; i < keys.length; i++) if (d[keys[i]] != null) return keys[i];
    return 'other';
  }
  return {send:send, actOf:actOf,
          get visited(){ return visited; },
          markVisited:function(){ visited = true; }};
})();
/* 只有真的连上后端才报一次「来访」—— 打不开的页面不该算一次访问 */
function trackVisit(){
  if (!TRACK || TRACK.visited || !AGENT_API.base) return;
  TRACK.markVisited();
  TRACK.send('visit', {ref:document.referrer || '', w:window.innerWidth,
                       h:window.innerHeight});
}
/* 点了哪个按钮（点在 last 位置，纯旁观，不改变任何行为） */
document.addEventListener('click', function(e){
  try {
    var el = e.target && e.target.closest ? e.target.closest(
      '[data-act],[data-page],[data-open],[data-zoom],[data-say],[data-pick],' +
      '[data-newpick],[data-pack],[data-pack-pick],[data-mktask],[data-run],' +
      '[data-download],[data-retry],[data-confirm],[data-cancel],[data-trend],' +
      '[data-pick-use],[data-pick-type],[data-dlfile],[data-dlrec],[data-regen],' +
      '[data-dl-origin],[data-flag],[data-trend-advice]') : null;
    if (el) TRACK.send('click', {act:TRACK.actOf(el)});
  } catch (ex){}
});
/* 人走了：关页面 / 跳走 / 前进后退都算。离开的原因（聊完 / 卡在等回答 /
   压着没点的卡片）由服务端按会话当时的状态判，前端不猜。 */
window.addEventListener('pagehide', function(){
  if (!TRACK.visited) return;          /* 只是打开页面还没连上后端：不算一次会话 */
  TRACK.send('leave', {last:true});
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'input'){ el.style.height = 'auto'; el.style.height = Math.min(130, el.scrollHeight) + 'px'; return; }
});
document.addEventListener('keydown', function(e){
  /* 放大层打开时接管键盘，别让 Esc 之外的操作落到页面上 */
  if (ZOOM.open){
    var k = e.key;
    if (k === 'Escape'){ closeZoom(); e.preventDefault(); return; }
    if (k === '+' || k === '='){ zoomStep(1.25); e.preventDefault(); return; }
    if (k === '-' || k === '_'){ zoomStep(1 / 1.25); e.preventDefault(); return; }
    if (k === '0'){ zoomFit(); e.preventDefault(); return; }
    if (k === 't' || k === 'T'){ zoomToggleTile(); e.preventDefault(); return; }
    return;
  }
  if (e.target && e.target.id === 'input' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    say(e.target.value);
  }
});

/* 拖拽上传 */
function dropMark(on){
  var app = document.getElementById('app');
  if (app) app.classList[on ? 'add' : 'remove']('drop-on');
}
document.addEventListener('dragover', function(e){ e.preventDefault(); dropMark(true); });
document.addEventListener('dragleave', function(e){ if (!e.relatedTarget) dropMark(false); });
document.addEventListener('drop', function(e){
  dropMark(false);
  if (!e.dataTransfer) return;
  e.preventDefault();
  var f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) takeImageFile(f);
});
/* 粘贴上传 */
document.addEventListener('paste', function(e){
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++){
    if (items[i].type && items[i].type.indexOf('image/') === 0){
      var f = items[i].getAsFile();
      if (f){ takeImageFile(f); e.preventDefault(); }
      return;
    }
  }
});
