<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PatternFlow · 花型智造 — 交互原型 v0.1</title>
<style>
:root{
  --ink:#211E1B;
  --ink-2:#3A342E;
  --ink-3:#6B635A;
  --ink-4:#9A9188;
  --line:#E4DED6;
  --line-2:#EFEAE3;
  --paper:#F6F3EE;
  --card:#FFFFFF;
  --accent:#C1553A;
  --accent-soft:#F6E7E2;
  --jade:#3F6B5C;
  --jade-soft:#E4EDE9;
  --gold:#B58A2B;
  --gold-soft:#F6EFDD;
  --blue:#3B5D8F;
  --blue-soft:#E6EDF7;
  --r-s:6px; --r-m:10px; --r-l:16px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(33,30,27,.06), 0 1px 1px rgba(33,30,27,.04);
  --sh-2:0 6px 18px rgba(33,30,27,.08), 0 2px 6px rgba(33,30,27,.04);
  --sh-3:0 22px 48px rgba(33,30,27,.18), 0 6px 16px rgba(33,30,27,.08);
  --fs:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--fs); line-height:1.62; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D7D0C7;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 布局 ============ */
#app{display:flex;height:100vh;overflow:hidden}
.side{
  width:212px;flex:0 0 212px;background:var(--ink);color:#EDE8E2;
  display:flex;flex-direction:column;padding:18px 12px;gap:6px;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}
.brand .mark{width:30px;height:30px;border-radius:9px;flex:0 0 30px;
  background:conic-gradient(from 210deg,#C1553A,#B58A2B,#3F6B5C,#C1553A);
  position:relative;overflow:hidden}
.brand .mark::after{content:"";position:absolute;inset:7px;border-radius:4px;background:var(--ink)}
.brand .tx b{display:block;font-size:13.5px;letter-spacing:.4px}
.brand .tx span{display:block;font-size:10.5px;color:#8E857B;letter-spacing:.6px}
.nav-label{font-size:10.5px;color:#7C736A;padding:12px 10px 5px;letter-spacing:1px}
.nav-btn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;border-radius:9px;color:#CFC7BE;font-size:13.5px;
  transition:background .16s,color .16s;
}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-btn[aria-current="true"]{background:rgba(193,85,58,.9);color:#fff;box-shadow:var(--sh-1)}
.nav-btn .ico{width:17px;text-align:center;font-size:14px;opacity:.92}
.nav-btn .badge{margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.14);
  padding:1px 6px;border-radius:20px;min-width:18px;text-align:center}
.side-foot{margin-top:auto;padding:10px;border-radius:12px;background:rgba(255,255,255,.055)}
.side-foot .k{font-size:10.5px;color:#8E857B}
.side-foot .v{font-size:19px;font-weight:650;letter-spacing:.3px}
.side-foot .v small{font-size:11px;font-weight:400;color:#A79E94;margin-left:3px}
.side-foot button{margin-top:8px;width:100%;padding:7px;border-radius:8px;
  background:#EDE8E2;color:var(--ink);font-size:12.5px;font-weight:600}
.side-foot button:hover{background:#fff}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:14px;
  padding:0 22px;background:rgba(246,243,238,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.crumb{font-size:16px;font-weight:650;letter-spacing:.2px}
.crumb small{font-weight:400;color:var(--ink-4);font-size:12px;margin-left:9px;letter-spacing:0}
.top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.chip-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink-2);transition:.16s}
.chip-btn:hover{border-color:var(--ink-4);box-shadow:var(--sh-1)}
.chip-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip-btn.primary:hover{background:#000}
.balance{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;
  background:var(--gold-soft);color:#7A5C12;font-size:12.5px;font-weight:600}
.balance .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#C1553A,#B58A2B);
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:650}
.view{flex:1;overflow:auto;padding:22px}
.wrap{max-width:1180px;margin:0 auto}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.card-pad{padding:18px}
.sect-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sect-title h3{margin:0;font-size:15px;font-weight:650;letter-spacing:.2px}
.sect-title .hint{font-size:12px;color:var(--ink-4)}
.row{display:flex;gap:14px}
.grid{display:grid;gap:14px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:20px;
  background:var(--line-2);color:var(--ink-3);white-space:nowrap}
.tag.jade{background:var(--jade-soft);color:#2E5346}
.tag.gold{background:var(--gold-soft);color:#7A5C12}
.tag.accent{background:var(--accent-soft);color:#9C3F27}
.tag.blue{background:var(--blue-soft);color:#2C4870}
.muted{color:var(--ink-4)}
.small{font-size:12px}
.hr{height:1px;background:var(--line);margin:16px 0}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:24px;font-weight:660;letter-spacing:.4px;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--ink-4)}
.bar{height:6px;border-radius:20px;background:var(--line-2);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#D98A5F);transition:width .35s ease}
.btn{padding:8px 15px;border-radius:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:560;
  transition:.16s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:#000;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink-4);background:#fff}
.btn.accent{background:var(--accent)}
.btn.accent:hover{background:#A8462E}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.wide{width:100%}
.empty{text-align:center;padding:52px 20px;color:var(--ink-4)}
.empty .big{font-size:26px;margin-bottom:8px;opacity:.5}

/* ============ 工作台 ============ */
.hero{
  border-radius:var(--r-xl);padding:26px 28px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#26221F 0%,#372F28 52%,#4A3A2C 100%);box-shadow:var(--sh-2)
}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(193,85,58,.55),rgba(181,138,43,.18) 60%,transparent 72%)}
.hero h2{margin:0 0 6px;font-size:21px;font-weight:660;letter-spacing:.3px}
.hero p{margin:0;color:#CFC6BC;font-size:13px;max-width:620px}
.hero .hero-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.hero .btn.ghost:hover{background:rgba(255,255,255,.18)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.quick .q{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:15px;
  text-align:left;transition:.18s;box-shadow:var(--sh-1)}
.quick .q:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:#D9D1C6}
.quick .q .qi{font-size:18px;margin-bottom:8px;display:block}
.quick .q b{display:block;font-size:13.5px;font-weight:620;margin-bottom:2px}
.quick .q span{font-size:11.5px;color:var(--ink-4);line-height:1.5;display:block}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:15px 17px}
.mini-list{display:flex;flex-direction:column}
.mini-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.mini-row:last-child{border-bottom:none}
.mini-row .thumb{width:38px;height:38px;border-radius:8px;flex:0 0 38px;overflow:hidden;border:1px solid var(--line)}
.mini-row .meta{flex:1;min-width:0}
.mini-row .meta b{display:block;font-size:13px;font-weight:600}
.mini-row .meta span{font-size:11.5px;color:var(--ink-4)}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}

/* ============ 工作室 ============ */
.studio{display:grid;grid-template-columns:1fr 296px;gap:14px;height:calc(100vh - 102px)}
.chatpanel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.agent-tabs{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);background:#FCFAF7}
.agent-tab{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 8px;border-radius:11px;
  border:1px solid transparent;transition:.16s;text-align:left}
.agent-tab:hover{background:var(--line-2)}
.agent-tab[aria-current="true"]{background:#fff;border-color:var(--line);box-shadow:var(--sh-1)}
.agent-tab .face{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;color:#fff;flex:0 0 28px}
.agent-tab b{display:block;font-size:12.5px;font-weight:620;line-height:1.35}
.agent-tab span{display:block;font-size:10.5px;color:var(--ink-4)}
.msgs{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-height:0}
.msg{display:flex;gap:10px;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .face{width:32px;height:32px;border-radius:10px;flex:0 0 32px;display:grid;place-items:center;font-size:15px;color:#fff}
.msg.me .face{background:var(--ink-3)}
.bubble{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:var(--sh-1);min-width:0}
.msg.me .bubble{background:var(--ink);color:#F2EDE7;border-color:var(--ink)}
.bubble .who{font-size:10.5px;color:var(--ink-4);margin-bottom:3px;letter-spacing:.3px}
.msg.me .bubble .who{color:#9A9188}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:6px 0 0;padding-left:17px}
.bubble li{margin:3px 0}
.opt-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.opt{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;
  transition:.15s;color:var(--ink-2)}
.opt:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.opt.done{opacity:.45;pointer-events:none}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.res{text-align:left;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;transition:.18s}
.res:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:#D6CEC3}
.res .pv{aspect-ratio:1/1;display:block}
.res .pv svg{display:block;width:100%;height:100%}
.res .cap{padding:7px 9px}
.res .cap b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .cap span{font-size:10.5px;color:var(--ink-4)}
.composer{border-top:1px solid var(--line);padding:12px 14px;background:#FCFAF7}
.composer .box{display:flex;gap:9px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  min-height:44px;max-height:120px;background:#fff;outline:none;line-height:1.55}
.composer textarea:focus{border-color:var(--ink-4);box-shadow:0 0 0 3px rgba(33,30,27,.05)}
.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:16px;color:var(--ink-3);transition:.16s}
.icon-btn:hover{border-color:var(--ink-4);color:var(--ink)}
.composer .hintline{font-size:11px;color:var(--ink-4);margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.briefcard{position:sticky;top:0}
.brief-slot{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.brief-slot:last-of-type{border-bottom:none}
.brief-slot .lb{width:44px;flex:0 0 44px;font-size:11.5px;color:var(--ink-4)}
.brief-slot .vl{font-size:12.5px;font-weight:560}
.brief-slot .vl.none{color:#C4BCB2;font-weight:400}

/* ============ 花型库 ============ */
.filters{display:flex;flex-direction:column;gap:2px}
.fgroup{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.fgroup:last-child{border-bottom:none}
.fgroup .fl{width:52px;flex:0 0 52px;font-size:12px;color:var(--ink-4);padding-top:5px;letter-spacing:.5px}
.fchips{display:flex;flex-wrap:wrap;gap:7px}
.fchip{padding:4px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;
  color:var(--ink-2);transition:.15s}
.fchip:hover{border-color:var(--ink-4)}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;
  box-shadow:var(--sh-1);transition:.2s;text-align:left;position:relative}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:#D6CEC3}
.pcard .pv{aspect-ratio:1/1;position:relative;overflow:hidden}
.pcard .pv svg{display:block;width:100%;height:100%}
.pcard .fav{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.86);display:grid;place-items:center;font-size:12px;color:var(--ink-3);
  backdrop-filter:blur(4px);opacity:0;transition:.16s}
.pcard:hover .fav{opacity:1}
.pcard .fav.on{opacity:1;color:var(--accent)}
.pcard .info{padding:11px 12px 13px}
.pcard .info b{display:block;font-size:13px;font-weight:620;margin-bottom:3px}
.pcard .info .code{font-size:10.5px;color:var(--ink-4);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pcard .info .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pcard .matchbar{margin-top:9px;display:flex;align-items:center;gap:7px}
.pcard .matchbar .bar{flex:1}
.pcard .matchbar em{font-style:normal;font-size:11px;color:var(--jade);font-weight:620}

/* ============ 抽屉 / 弹窗 ============ */
.scrim{position:fixed;inset:0;background:rgba(33,30,27,.38);backdrop-filter:blur(2px);z-index:40;
  animation:fade .18s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:92vw;background:var(--paper);
  box-shadow:var(--sh-3);z-index:41;display:flex;flex-direction:column;animation:slideIn .24s cubic-bezier(.2,.8,.2,1)}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#fff}
.drawer .db{flex:1;overflow:auto;padding:20px}
.drawer .df{padding:14px 20px;border-top:1px solid var(--line);background:#fff;display:flex;gap:9px;flex-wrap:wrap}
.close-x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;color:var(--ink-3)}
.close-x:hover{background:var(--line-2);color:var(--ink)}
.detail-hero{border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);background:#fff}
.detail-hero svg{display:block;width:100%;height:auto}
.pal{display:flex;gap:8px;margin-top:4px}
.pal .sw{flex:1;height:44px;border-radius:9px;border:1px solid rgba(0,0,0,.06);position:relative}
.pal .sw span{position:absolute;left:0;right:0;bottom:-17px;text-align:center;font-size:10px;color:var(--ink-4)}
.kv{display:grid;grid-template-columns:86px 1fr;gap:8px 12px;font-size:12.5px}
.kv .k{color:var(--ink-4)}
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px}
.modal{background:var(--paper);border-radius:var(--r-xl);box-shadow:var(--sh-3);width:min(560px,94vw);
  max-height:88vh;overflow:auto;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal .mh{padding:18px 22px 0}
.modal .mh h3{margin:0;font-size:16px;font-weight:650}
.modal .mh p{margin:5px 0 0;font-size:12.5px;color:var(--ink-4)}
.modal .mb{padding:16px 22px}
.modal .mf{padding:0 22px 20px;display:flex;gap:9px;justify-content:flex-end}
.pack{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;text-align:left;transition:.16s;position:relative}
.pack:hover{border-color:#D6CEC3;transform:translateY(-2px);box-shadow:var(--sh-2)}
.pack[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pack .pr{font-size:19px;font-weight:660}
.pack .cr{font-size:12.5px;color:var(--jade);font-weight:620;margin-top:2px}
.pack .note{font-size:11px;color:var(--ink-4);margin-top:4px}
.pack .flag{position:absolute;right:10px;top:10px;font-size:10px;background:var(--gold-soft);color:#7A5C12;
  padding:1px 7px;border-radius:20px}
.qrbox{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:16px;margin-top:14px}
.qrbox .qr{width:118px;height:118px;flex:0 0 118px;border-radius:9px;border:1px solid var(--line);background:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.field input:focus{border-color:var(--ink-4)}
.switch{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.switch:last-child{border-bottom:none}
.switch .st{flex:1}
.switch .st b{display:block;font-size:13px;font-weight:600}
.switch .st span{font-size:11.5px;color:var(--ink-4)}
.tog{width:40px;height:23px;border-radius:20px;background:#D7D0C7;position:relative;transition:.18s;flex:0 0 40px}
.tog::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);transition:.18s}
.tog[aria-pressed="true"]{background:var(--jade)}
.tog[aria-pressed="true"]::after{transform:translateX(17px)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;box-shadow:var(--sh-3);
  animation:pop .18s ease;display:flex;align-items:center;gap:9px}
.toast.warn{background:#8E3A25}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-4);font-size:11.5px;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#FCFAF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.seamwrap{position:relative;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.seamwrap svg{display:block;width:100%;height:auto}
.seamwrap .seamline{position:absolute;background:rgba(193,85,58,.85)}
.seamwrap .seamline.v{top:0;bottom:0;width:1px}
.seamwrap .seamline.h{left:0;right:0;height:1px}
.stepline{display:flex;flex-direction:column;gap:2px}
.stepline .st{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-4);padding:5px 0}
.stepline .st .dotm{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 8px}
.stepline .st.done{color:var(--ink-2)}
.stepline .st.done .dotm{background:var(--jade)}
.stepline .st.now{color:var(--accent);font-weight:600}

.typing{display:inline-flex;gap:3px;align-items:center;height:14px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:1180px){
  .studio{grid-template-columns:1fr}
  .briefcard{position:static}
  .studio{height:auto}
  .quick{grid-template-columns:repeat(2,1fr)}
  .stat4{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
}
@media (max-width:760px){
  .side{display:none}
  .result-grid{grid-template-columns:repeat(2,1fr)}
}

/* --- 确定性伪随机 --- */
function rng(seed){
  var s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function(){ s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
}

function motifDots(R,P){

    var cx = 12 + x*24 + (y%2?6:0), cy = 12 + y*24, rr = R();
    if (rr < .18) continue;
    o += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(3.2+rr*3.6).toFixed(1)+'" fill="'+P[1+Math.floor(R()*3)]+'"/>';
    o += '<circle cx="'+(cx+2).toFixed(1)+'" cy="'+(cy-2).toFixed(1)+'" r="1.1" fill="'+P[0]+'" opacity=".7"/>';
  }
  return o;
}
function petal(cx,cy,rad,n,fill,rot){
  var o = '';
  for (var i = 0; i < n; i++){
    var a = (Math.PI*2/n)*i + (rot||0);
    o += '<ellipse cx="'+(cx+Math.cos(a)*rad*.62).toFixed(2)+'" cy="'+(cy+Math.sin(a)*rad*.62).toFixed(2)+
      '" rx="'+(rad*.46).toFixed(2)+'" ry="'+(rad*.3).toFixed(2)+
      '" transform="rotate('+(a*180/Math.PI).toFixed(1)+' '+(cx+Math.cos(a)*rad*.62).toFixed(2)+' '+(cy+Math.sin(a)*rad*.62).toFixed(2)+')" fill="'+fill+'"/>';
  }
  return o;
}

    o += '<ellipse cx="'+(cx+9).toFixed(1)+'" cy="'+(cy+9).toFixed(1)+'" rx="4.6" ry="1.9" transform="rotate(-38 '+(cx+9).toFixed(1)+' '+(cy+9).toFixed(1)+')" fill="'+P[1]+'" opacity=".8"/>';

  return '<svg viewBox="0 0 104 104" preserveAspectRatio="'+fit+'" role="img" aria-label="'+esc(p.name)+' 花型图案">'+

    '<rect width="104" height="104" fill="url(#'+uid+'w)"/>'+
    '</svg>';
}

function filtered(){
  var f = S.filters, q = (f.q||'').trim().toLowerCase();
  return PATTERNS.filter(function(p){
    if (f.style.length && f.style.indexOf(p.style) < 0) return false;
    if (f.element.length && f.element.indexOf(p.element) < 0) return false;
    if (f.color.length && f.color.indexOf(p.color) < 0) return false;
    if (f.scene.length && f.scene.indexOf(p.scene) < 0) return false;
    if (q){
      var hay = (p.name+' '+p.id+' '+p.style+' '+p.element+' '+p.color+' '+p.scene+' '+p.desc+' '+p.l2.join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a,b){ return matchScore(b)-matchScore(a) || b.heat-a.heat; });
}
function matchScore(p){
  var dims = 0, hit = 0;
  ['style','element','color','scene'].forEach(function(k){
    if (S.brief[k]){ dims++; if (S.brief[k] === p[k]) hit++; }
  });
  var bonus = 0;
  ['style','element','color','scene'].forEach(function(k){
    if (S.filters[k] && S.filters[k].indexOf(p[k]) >= 0) bonus += 6;
  });
  if (!dims) return Math.min(96, 62 + Math.round(p.heat*0.2) + bonus);
  return Math.max(46, Math.min(99, Math.round(52 + (hit/dims)*42 + bonus)));
}

   ========================================================================= */
var TIMERS = new Map(), TSEQ = 0, TID = 0, MID = 0;
function later(fn, ms){
  var id = ++TSEQ;
  var t = setTimeout(function(){ TIMERS.delete(id); fn(); }, ms);
  TIMERS.set(id, {t:t, fn:fn}); return id;
}
function flushTimers(){
  var guard = 0;
  while (TIMERS.size && guard++ < 500){
    var entries = Array.from(TIMERS.entries());
    entries.forEach(function(e){
      clearTimeout(e[1].t); TIMERS.delete(e[0]); e[1].fn();
    });
  }
}
function toast(text, warn){
  var box = document.getElementById('toastbox');
  var el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = text;
  box.innerHTML = ''; box.appendChild(el);
  later(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
}
function spend(n){
  if (S.credits < n){ toast('点数不足，还差 ' + (n - S.credits) + ' 点', true); openRecharge(); return false; }
  S.credits -= n; return true;
}
function newTask(type, pid, silent){
  var T = TASK_TYPES[type];
  var t = {
    tid:'T' + (++TID).toString().padStart(4,'0') .replace('T','TJ-') , type:type, pid:pid,
    status:'wait', progress:0, step:0
  };
  t.tid = 'TJ-' + String(1000 + TID);
  t.statusText = function(){
    return {wait:'待确认，等待你同意扣费', run:'处理中 · ' + TASK_TYPES[t.type].steps[Math.min(t.step, TASK_TYPES[t.type].steps.length-1)],
      done:'已完成，可下载', fail:'失败，点数已退回'}[t.status] + ' · 消耗 ' + T.cost + ' 点';
  };
  S.tasks.unshift(t);
  if (!silent) render();
  return t;
}
function confirmTask(tid){
  var t = S.tasks.filter(function(x){ return x.tid === tid; })[0];
  if (!t) return;
  var T = TASK_TYPES[t.type];
  if (!spend(T.cost)) return;
  S.ledger.push({t:T.name + ' · ' + (PAT[t.pid] ? PAT[t.pid].name : ''), amt:-T.cost, at:stamp(), kind:'out'});
  t.status = 'run'; t.step = 0; t.progress = 0;
  render();
  runTask(t);
}
function runTask(t){
  var T = TASK_TYPES[t.type], n = T.steps.length;
  function advance(){
    t.step++; t.progress = Math.round(t.step / n * 100);
    if (t.step >= n){
      t.status = 'done'; t.progress = 100;
      var p = PAT[t.pid];
      S.assets.unshift({name:p.name + '_' + p.id + '_' + t.tid + '_600dpi.png', pid:p.id,
        fmt: t.type === 'psd' ? 'PSD · 分层' : (t.type === 'trace' ? 'SVG + PNG' : 'PNG/TIFF/PSD'),
        at: stamp(), pts: T.cost});
      if (S.page === 'tasks' || S.page === 'assets') render();
      else renderChrome();
      toast('任务完成：' + T.name + ' · ' + p.name + '，已加入交付与下载');
      return;
    }
    if (S.page === 'tasks') render();
    later(advance, 620);
  }
  later(advance, 620);
}
function stamp(){
  var d = new Date();
  function z(x){ return String(x).padStart(2,'0'); }
  return z(d.getMonth()+1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

function replyDesigner(raw){
  var got = extract(raw);
  var skip = UNCLEAR.some(function(k){ return raw.indexOf(k) >= 0; });
  ['style','element','color','scene'].forEach(function(k){ if (got[k]) S.brief[k] = got[k]; });

  var missing = ['style','element','color','scene'].filter(function(k){ return !S.brief[k]; });
  var filled = 4 - missing.length;

  if (filled === 0 && !skip){
    S.rounds.designer = 1;
    return askDim('style', '先从哪里开始都行——你希望这个花型偏什么感觉？',
      '我可以先按风格筛，也可以你先告诉我用途场景，比如“春夏连衣裙”或“家居窗帘”。');
  }
  if (/趋势|流行|建议/.test(raw)){
    var r0 = {text:'要给你趋势建议的话，我先说明来源与时间：以下为原型演示占位内容，正式版会标注数据来源与日期。',

    r0.agent = 'designer'; push('designer', r0); render(); return;
  }
  if (skip || S.rounds.designer >= 2 || missing.length === 0){
    return showPicks(missing);
  }
  S.rounds.designer++;
  var next = missing.indexOf('element') >= 0 ? 'element' : missing[0];
  var q = {
    style:'这个花型主要想表达什么风格？',
    element:'画面里希望出现什么元素？',
    color:'配色上有偏好吗？',
    scene:'最后用在什么品类上？'

function fakeQR(){
  var R = rng(20260926), o = '', n = 29;
  function finder(ox, oy){
    return '<rect x="'+ox+'" y="'+oy+'" width="7" height="7" fill="#211E1B"/>'+
      '<rect x="'+(ox+1)+'" y="'+(oy+1)+'" width="5" height="5" fill="#fff"/>'+
      '<rect x="'+(ox+2)+'" y="'+(oy+2)+'" width="3" height="3" fill="#211E1B"/>';
  }
  o += '<rect width="'+n+'" height="'+n+'" fill="#fff"/>';
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++){
    if ((x < 8 && y < 8) || (x > n-9 && y < 8) || (x < 8 && y > n-9)) continue;
    if (R() > .52) o += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#211E1B"/>';
  }
  o += finder(0,0) + finder(n-7,0) + finder(0,n-7);
  return o;
}
function selectPack(id){

    b.setAttribute('aria-pressed', b.dataset.packPick === id);
  });

  if (sum && k) sum.textContent = '¥ ' + k.price + ' / ' + k.credits.toLocaleString('zh-CN') + ' 点';
}
function doPay(){

        list:['原图分辨率不足，直接描摹会带出毛边','广告牌反光导致中间色偏亮，需要先做去噪与超分',
          '建议路径：清晰化 → 主体分割 → 矢量描摹 → 色彩还原'],

      push(a, {text:'看到图了。从画面判断元素偏「花卉」，风格接近「复古波普」，配色是「暖橙焦糖」。我先把这三项记进需求卡。',
        card:optCard('要不要我按这三项出一版候选？', [{label:'按这三项出候选', act:'trend-picks'},{label:'再补充场景', say:'用在女装连衣裙上'}])});
      S.brief.element = S.brief.element || '花卉';
      S.brief.style = S.brief.style || '复古波普';
      S.brief.color = S.brief.color || '暖橙焦糖';
    } else {
      push(a, {text:'图片已收进你的项目空间。需要的话我可以把它和其它下载记录一起整理成清单表。',
        card:'<div style="margin-top:8px"><button class="opt" data-act="export-book">整理成表格</button></div>'});
    }
    render();
  }, 520);

function go(page){
  S.page = page; closeLayer(); render();
}
function setFilter(dim, val){
  var arr = S.filters[dim], i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
}
function refreshLibGrid(){
  var res = filtered();
  var c = document.getElementById('rescount');
  if (c) c.textContent = res.length;
  var holder = document.getElementById('libresult');
  if (!holder){ render(); return; }
  var g = document.getElementById('libgrid');
  if (!res.length){
    holder.innerHTML = '<div class="card"><div class="empty"><div class="big">▦</div>'+
      '<b>没有同时满足这些条件的花型</b>'+
      '<p class="small">试着去掉一个筛选条件，或者让设计师按你的需求生成新方案。</p></div></div>';
    return;
  }

  else { holder.innerHTML = '<div class="lib-grid" id="libgrid">'+ res.map(pcardHTML).join('') +'</div>'; }

function applyBriefToFilters(){
  ['style','element','color','scene'].forEach(function(k){
    if (S.brief[k] && S.filters[k].indexOf(S.brief[k]) < 0) S.filters[k].push(S.brief[k]);
  });
}
function mkTask(type, pid){
  closeLayer();
  var T = TASK_TYPES[type], p = PAT[pid];
  S.agent = 'engineer';
  S.page = 'studio';
  push('engineer', {me:true, text:'把「' + p.name + '」做成' + T.name + '，需要' + T.cost + ' 点。'});
  render();
  later(function(){ offerTask(type, pid); }, 400);
}
function startFromModal(){
  var t = MODAL_SEL_TYPE, p = MODAL_SEL_PAT;
  if (!t || !p){ toast('请先选择处理类型和花型', true); return; }
  closeLayer();
  var T = TASK_TYPES[t];
  if (!spend(T.cost)) return;
  S.ledger.push({t:T.name + ' · ' + PAT[p].name, amt:-T.cost, at:stamp(), kind:'out'});
  var task = newTask(t, p, true);
  task.status = 'run'; task.step = 0; task.progress = 0;
  S.page = 'tasks'; render();
  runTask(task);
}
/* 对话内确认执行：卡片已写明输出规格与失败退还规则，故直接扣费并开跑 */
function runFromChat(type, pid){
  closeLayer();
  var T = TASK_TYPES[type], p = PAT[pid];
  if (!p) return;
  S.agent = 'engineer';
  if (!spend(T.cost)) return;
  S.ledger.push({t:T.name + ' · ' + p.name, amt:-T.cost, at:stamp(), kind:'out'});
  push('engineer', {me:true, text:'确认执行，扣 ' + T.cost + ' 点。'});
  var task = newTask(type, pid, true);
  task.status = 'run'; task.step = 0; task.progress = 0;
  S.page = 'tasks'; render();
  runTask(task);
  return task;
}
var MODAL_SEL_TYPE = null, MODAL_SEL_PAT = null;

/* =========================================================================
   __INIT__  事件委托与启动
   ========================================================================= */
var ACTS = {
  'recharge': function(){ openRecharge(); },
  'help': function(){ openHelp(); },
  'start-chat': function(){ S.page = 'studio'; S.agent = 'designer'; render(); },
  'upload': function(){ upload(); },
  'start-upload': function(){ S.page = 'studio'; S.agent = 'engineer'; render(); upload(); },
  'send': function(){ var el = document.getElementById('input'); say(el ? el.value : ''); },
  'to-library': function(){ applyBriefToFilters(); go('library'); },
  'reset-brief': function(){ S.brief = {style:null,element:null,color:null,scene:null}; S.rounds.designer = 0; toast('需求卡已重置'); render(); },
  'clear-filters': function(){ S.filters = {style:[],element:[],color:[],scene:[],q:''}; render(); },
  'new-task': function(){ MODAL_SEL_TYPE = null; MODAL_SEL_PAT = null; openNewTask(); },
  'export-book': function(){ exportBook(); },
  'preview-book': function(){ applyBriefToFilters(); go('library'); },
  'do-export': function(){
    var f = bookFlags(); closeLayer();
    toast('已导出 XLSX：' + PATTERNS.length + ' 款花型 · ' + (f.desc ? '含设计说明 ' : '') + (f.sell ? '含卖点 ' : '') + (f.thumb ? '含缩略图' : ''));
    S.assets.unshift({name:'花型清单_PatternFlow_' + stamp().replace(/[- :]/g,'') + '.xlsx',
      pid:'PF-OWN-2026-000128', fmt:'XLSX · 清单', at:stamp(), pts:0});
    if (S.page === 'assets') render();
  },
  'invoice': function(){ openInvoice(); },
  'do-invoice': function(){ doInvoice(); },
  'pay-ok': function(){ doPay(); },
  'close-modal': function(){ closeLayer(); },
  'close-layer': function(){ closeLayer(); },
  'goto-engineer': function(){ S.agent = 'engineer'; render(); },
  'goto-tasks': function(){ go('tasks'); },
  'go-billing': function(){ go('billing'); },
  'explain-picks': function(){ explainPicks(); },
  'trend-picks': function(){
    if (!S.brief.style) S.brief.style = '法式浪漫';
    if (!S.brief.element) S.brief.element = '花卉';
    if (!S.brief.color) S.brief.color = '莫兰迪灰调';
    if (!S.brief.scene) S.brief.scene = '女装连衣裙';
    showPicks(['style','element','color','scene'].filter(function(k){ return !S.brief[k]; }));
  }
};
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-page],[data-act],[data-open],[data-fav],[data-opt],[data-say],[data-confirm],[data-cancel],[data-download],[data-retry],[data-fdim],[data-mktask],[data-run],[data-pack],[data-pack-pick],[data-pick-type],[data-pick-pat],[data-flag],[data-agent],[data-redl]') : null;
  if (!el) return;
  var d = el.dataset;

  if (d.page){ go(d.page); return; }
  if (d.agent){ S.agent = d.agent; render(); return; }
  if (d.open){ openDrawer(d.open); return; }
  if (d.fav){
    var i = S.fav.indexOf(d.fav);
    if (i >= 0) S.fav.splice(i,1); else S.fav.push(d.fav);
    toast(i >= 0 ? '已取消收藏' : '已收藏');
    var wasDrawer = CUR_DRAWER === d.fav;
    render();
    if (wasDrawer) openDrawer(d.fav);
    return;
  }
  if (d.say){ say(d.say); return; }
  if (d.opt){
    var src = (S.chat[S.agent] || []).filter(function(m){ return m.id === d.opt; })[0];
    var o = src && src.opts ? src.opts[+d.oi] : null;
    if (o && o.set){ S.brief[o.set[0]] = o.set[1]; push(S.agent, {me:true, text:o.label}); render();
      later(function(){ replyDesigner(o.label); }, 420);
    } else if (o && o.skip){
      push(S.agent, {me:true, text:o.label}); render();
      var missing = ['style','element','color','scene'].filter(function(k){ return !S.brief[k]; });
      later(function(){
        if (missing.length === 1 || S.rounds.designer >= 2){ showPicks(missing); }
        else { S.rounds.designer++; askDim(missing.indexOf('element')>=0?'element':missing[0],
          '明白，那就先不定这一项。' + '还差一个维度：' + ({element:'画面里希望有什么元素？',color:'配色上有偏好吗？',scene:'最后用在什么品类上？',style:'想走什么风格？'}[missing[0]]),
          '也可以直接说“先出候选”。'); }
      }, 420);
    }
    return;
  }
  if (d.fdim){
    setFilter(d.fdim, d.fval);
    var p = el.getAttribute('aria-pressed') === 'true';
    el.setAttribute('aria-pressed', !p);
    refreshLibGrid();
    return;
  }
  if (d.mktask){
    var parts = d.mktask.split('|');
    mkTask(parts[0], parts[1]);
    return;
  }
  if (d.run){
    var rp = d.run.split('|');
    runFromChat(rp[0], rp[1]);
    return;
  }
  if (d.confirm){ confirmTask(d.confirm); return; }
  if (d.cancel){
    S.tasks = S.tasks.filter(function(t){ return t.tid !== d.cancel; });
    toast('已取消任务，未产生扣费'); render(); return;
  }
  if (d.download){
    var t = S.tasks.filter(function(x){ return x.tid === d.download; })[0];
    if (t) toast('开始下载交付包：' + TASK_TYPES[t.type].name + ' · ' + PAT[t.pid].name);
    return;
  }
  if (d.retry){
    var t2 = S.tasks.filter(function(x){ return x.tid === d.retry; })[0];
    if (t2){ t2.status = 'run'; t2.step = 0; t2.progress = 0; render(); runTask(t2); }
    return;
  }
  if (d.redl){ toast('已重新生成下载链接，有效期 24 小时'); return; }
  if (d.pack){ openRecharge(d.pack); return; }
  if (d.packPick){ selectPack(d.packPick); return; }
  if (d.pickType){
    MODAL_SEL_TYPE = d.pickType;
    document.querySelectorAll('[data-pick-type]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.pickType === MODAL_SEL_TYPE); });
    if (MODAL_SEL_TYPE && MODAL_SEL_PAT) startFromModal();
    return;
  }
  if (d.pickPat){
    MODAL_SEL_PAT = d.pickPat;
    document.querySelectorAll('[data-pick-pat]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.pickPat === MODAL_SEL_PAT); });
    if (MODAL_SEL_TYPE && MODAL_SEL_PAT) startFromModal();
    return;
  }
  if (d.flag){
    var on = el.getAttribute('aria-pressed') === 'true';
    el.setAttribute('aria-pressed', !on);
    return;
  }
  if (d.act && ACTS[d.act]){ ACTS[d.act](); return; }
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'libq'){ S.filters.q = el.value; refreshLibGrid(); return; }
  if (el.id === 'input'){ el.style.height = 'auto'; el.style.height = Math.min(120, el.scrollHeight) + 'px'; return; }
});
document.addEventListener('keydown', function(e){
  if (e.target && e.target.id === 'input' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    say(e.target.value);
  }
});

window.__YQ = {
  get S(){ return S; }, get PATTERNS(){ return PATTERNS; }, get PAT(){ return PAT; },

  setFilter:setFilter, setAgent:function(k){ S.agent = k; render(); },
  openDrawer:openDrawer, closeLayer:closeLayer, openRecharge:openRecharge, openInvoice:openInvoice,
  selectPack:selectPack, doPay:doPay, doInvoice:doInvoice, exportBook:exportBook, bookFlags:bookFlags,
  confirmTask:confirmTask, newTask:newTask, runTask:runTask, spend:spend,
  mkTask:mkTask, runFromChat:runFromChat, startFromModal:startFromModal, showPicks:showPicks, askDim:askDim, upload:upload,
  introOf:introOf, placeholderOf:placeholderOf, patternSVG:patternSVG,
  fakeQR:fakeQR, flushTimers:flushTimers, stamp:stamp,
  layer:function(){ return document.getElementById('layer'); }
};
