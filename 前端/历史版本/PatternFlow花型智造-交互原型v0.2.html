<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="CnbkZAFX9PgYuCDdPhVjOX">
<head data-page-node-id="zCVw1yB6pGBLxkU2XGNQTw">
<meta charset="utf-8" data-page-node-id="Wiaz8mvUvpXKBo4n83JkM8" />
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="QTWTE7xsJzJRHxV3viGbZg" />
<title>PatternFlow · 花型智造 — 交互原型 v0.2</title>
<style>
:root{
  --ink:#211E1B;
  --ink-2:#3A342E;
  --ink-3:#6B635A;
  --ink-4:#9A9188;
  --line:#E4DED6;
  --line-2:#EFEAE3;
  --paper:#F6F3EE;
  --card:#FFFFFF;
  --accent:#C1553A;
  --accent-soft:#F6E7E2;
  --jade:#3F6B5C;
  --jade-soft:#E4EDE9;
  --gold:#B58A2B;
  --gold-soft:#F6EFDD;
  --blue:#3B5D8F;
  --blue-soft:#E6EDF7;
  --rail:#F1EEE9;
  --rail-hover:#E7E2D9;
  --rail-on:#DFD8CD;
  --stage:#EAE5DE;
  --r-s:6px; --r-m:10px; --r-l:16px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(33,30,27,.06), 0 1px 1px rgba(33,30,27,.04);
  --sh-2:0 6px 18px rgba(33,30,27,.08), 0 2px 6px rgba(33,30,27,.04);
  --sh-3:0 22px 48px rgba(33,30,27,.2), 0 6px 16px rgba(33,30,27,.08);
  --fs:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--fs); line-height:1.62; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CFC8BE;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#BDB5AA}
::-webkit-scrollbar-track{background:transparent}

/* ============ 骨架：左栏会话 + 右侧舞台 ============ */
#app{display:flex;height:100vh;overflow:hidden}

.rail{
  width:256px;flex:0 0 256px;background:var(--rail);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.rail-head{padding:14px 14px 10px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mark{width:28px;height:28px;border-radius:8px;flex:0 0 28px;
  background:conic-gradient(from 210deg,#C1553A,#B58A2B,#3F6B5C,#C1553A);position:relative;overflow:hidden}
.brand .mark::after{content:"";position:absolute;inset:6.5px;border-radius:3.5px;background:var(--rail)}
.brand .tx b{display:block;font-size:13px;letter-spacing:.3px;line-height:1.3}
.brand .tx span{display:block;font-size:10px;color:var(--ink-4);letter-spacing:.5px}

.rail-search{padding:0 12px 8px}
.rail-search input{
  width:100%;padding:7px 11px;border:1px solid transparent;border-radius:8px;
  background:#E7E2D9;outline:none;font-size:12.5px;transition:.16s;
}
.rail-search input::placeholder{color:#A79E94}
.rail-search input:focus{background:#fff;border-color:var(--line)}

.rail-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;min-height:0}
.nav-label{font-size:10.5px;color:#9A9188;padding:12px 8px 5px;letter-spacing:1px;font-weight:600}
.row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 9px;border-radius:9px;transition:background .14s;position:relative;
}
.row:hover{background:var(--rail-hover)}
.row[aria-current="true"]{background:var(--rail-on)}
.row .av{width:36px;height:36px;border-radius:9px;flex:0 0 36px;display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:600;position:relative}
.row .av .dot{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);border:2px solid var(--rail)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:13px;font-weight:600;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:11px;color:var(--ink-4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .badge{font-size:10px;background:var(--accent);color:#fff;border-radius:20px;
  min-width:17px;height:17px;display:grid;place-items:center;padding:0 5px;flex:0 0 auto}
.row .badge.p1{background:#D7D0C7;color:var(--ink-3)}
.row .pi{width:16px;text-align:center;font-size:13px;color:var(--ink-4);flex:0 0 16px}
.row.soon{opacity:.72}
.row.soon .tx b{font-weight:500;color:var(--ink-3)}

.rail-foot{padding:10px 12px 12px;border-top:1px solid var(--line);background:#EDE8E1}
.rail-foot .wallet{display:flex;align-items:center;gap:9px}
.rail-foot .wallet .n{flex:1;min-width:0}
.rail-foot .wallet .k{font-size:10.5px;color:var(--ink-4)}
.rail-foot .wallet .v{font-size:17px;font-weight:660;letter-spacing:.3px;line-height:1.2}
.rail-foot .wallet .v small{font-size:10.5px;font-weight:400;color:var(--ink-4);margin-left:2px}
.rail-foot .wallet button{padding:6px 12px;border-radius:8px;background:var(--ink);color:#fff;
  font-size:12px;font-weight:600;transition:.16s;flex:0 0 auto}
.rail-foot .wallet button:hover{background:#000}

.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--stage);position:relative}
.stage-head{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;
  padding:0 18px;background:rgba(241,238,233,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);z-index:2;
}
.stage-head .tt{min-width:0}
.stage-head .tt b{display:block;font-size:14.5px;font-weight:650;letter-spacing:.2px;line-height:1.3}
.stage-head .tt span{display:block;font-size:11.5px;color:var(--ink-4)}
.stage-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip-btn{padding:5.5px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink-2);transition:.16s}
.chip-btn:hover{border-color:var(--ink-4);box-shadow:var(--sh-1)}
.chip-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip-btn.primary:hover{background:#000}
.balance{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
  background:var(--gold-soft);color:#7A5C12;font-size:12.5px;font-weight:600}
.balance .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#C1553A,#B58A2B);
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:650;flex:0 0 30px}

.stage-body{flex:1;min-height:0;display:flex;flex-direction:column}
.page-scroll{flex:1;overflow:auto;padding:20px 22px}
.wrap{max-width:1080px;margin:0 auto}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.card-pad{padding:17px}
.sect-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 11px}
.sect-title:first-child{margin-top:0}
.sect-title h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:.2px}
.sect-title .hint{font-size:11.5px;color:var(--ink-4)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:20px;
  background:var(--line-2);color:var(--ink-3);white-space:nowrap}
.tag.jade{background:var(--jade-soft);color:#2E5346}
.tag.gold{background:var(--gold-soft);color:#7A5C12}
.tag.accent{background:var(--accent-soft);color:#9C3F27}
.tag.blue{background:var(--blue-soft);color:#2C4870}
.muted{color:var(--ink-4)}
.small{font-size:12px}
.hr{height:1px;background:var(--line);margin:14px 0}
.kpi{display:flex;flex-direction:column;gap:1px}
.kpi b{font-size:22px;font-weight:660;letter-spacing:.4px;line-height:1.2}
.kpi span{font-size:11.5px;color:var(--ink-4)}
.bar{height:6px;border-radius:20px;background:var(--line-2);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#D98A5F);transition:width .35s ease}
.bar.jade > i{background:linear-gradient(90deg,var(--jade),#6AA08C)}
.btn{padding:8px 15px;border-radius:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:560;
  transition:.16s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:#000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink-4);background:#fff}
.btn.accent{background:var(--accent)}
.btn.accent:hover{background:#A8462E}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-4)}
.empty .big{font-size:24px;margin-bottom:8px;opacity:.5}
.emptyface{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff;
  font-size:22px;font-weight:600;margin:0 auto 13px;box-shadow:var(--sh-2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-4);font-size:11.5px;padding:8px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#FCFAF7}
.stepline{display:flex;flex-direction:column;gap:2px}
.stepline .st{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-4);padding:4px 0}
.stepline .st .dotm{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 8px}
.stepline .st.done{color:var(--ink-2)}
.stepline .st.done .dotm{background:var(--jade)}
.stepline .st.now{color:var(--accent);font-weight:600}
.stepline .st.now .dotm{background:var(--accent);box-shadow:0 0 0 4px rgba(193,85,58,.16)}
.seamwrap{position:relative;border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line)}
.seamwrap svg{display:block;width:100%;height:auto}
.seamwrap .seamline{position:absolute;background:rgba(193,85,58,.85)}
.seamwrap .seamline.v{top:0;bottom:0;width:1px}
.seamwrap .seamline.h{left:0;right:0;height:1px}

/* ============ 聊天 ============ */
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;padding:22px 24px 12px;display:flex;flex-direction:column;gap:16px;min-height:0}
.msgs > .empty{margin:auto 0}
.msg{display:flex;gap:10px;max-width:78%;animation:msgIn .22s ease}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .face{width:34px;height:34px;border-radius:9px;flex:0 0 34px;display:grid;place-items:center;
  font-size:14px;font-weight:600;color:#fff}
.msg.me .face{background:var(--ink-3)}
.bubble{background:#fff;border:1px solid var(--line);border-radius:3px 13px 13px 13px;
  padding:10px 13px;box-shadow:var(--sh-1);min-width:0;position:relative}
.msg.me .bubble{background:var(--accent);color:#FDF6F3;border-color:var(--accent);
  border-radius:13px 3px 13px 13px}
.bubble.bare{background:none;border:none;box-shadow:none;padding:0}
.bubble .who{font-size:10.5px;color:var(--ink-4);margin-bottom:3px;letter-spacing:.3px}
.bubble p{margin:0 0 7px}
.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:6px 0 0;padding-left:17px}
.bubble li{margin:3px 0}
.opt-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.opt{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12.5px;
  transition:.15s;color:var(--ink-2)}
.opt:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.opt.trend{border-color:var(--gold);color:#7A5C12;background:var(--gold-soft)}
.opt.trend:hover{background:#F1E4C4}
.opt .em{color:var(--gold);margin-right:4px}
.typing{display:inline-flex;gap:3px;align-items:center;height:14px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-4);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}

/* 聊天里逐张发出的花型消息 */
.pmsg{width:290px;max-width:100%}
.pmsg .hd{font-size:11px;color:var(--ink-4);margin-bottom:5px;letter-spacing:.3px}
.pmsg .pic{border-radius:11px 11px 0 0;overflow:hidden;border:1px solid var(--line);background:#fff}
.pmsg .pic svg{display:block;width:100%;height:auto}
.pmsg .meta{padding:9px 11px 11px;background:#fff;border:1px solid var(--line);border-top:none;
  border-radius:0 0 11px 11px;margin-top:-1px}
.pmsg .meta .nm{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pmsg .meta .nm b{font-size:13px;font-weight:620}
.pmsg .meta .tl{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pmsg .meta .dc{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}
.pmsg .ops{display:flex;gap:7px;margin-top:9px}
.pmsg .ops button{flex:1;padding:6px 8px;border-radius:8px;font-size:12px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);transition:.15s}
.pmsg .ops button:hover{border-color:var(--accent);color:var(--accent)}
.pmsg .ops button.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.pmsg .ops button.main:hover{background:#000;color:#fff}

/* 花型选择弹窗（只出图） */
.picker-actions{display:flex;gap:10px;margin-top:14px;background:#fff;border-radius:12px;
  padding:10px;border:1px solid var(--line);align-items:center}
.picker-actions .sel-info{flex:1;min-width:0;font-size:12.5px;color:var(--ink-3)}
.picker-actions .sel-info b{color:var(--accent)}
.picker-actions .right{margin-left:auto;display:flex;gap:9px;flex:0 0 auto}
.picker-scroll{max-height:56vh;overflow-y:auto;margin:0 -6px;padding:2px 6px}
.picker-scroll.compact{max-height:31vh}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:11px}
.psel{border:2px solid transparent;border-radius:13px;overflow:hidden;background:#fff;
  box-shadow:var(--sh-1);transition:.16s;position:relative;display:block}
.psel:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.psel .im{aspect-ratio:1/1;display:block;position:relative}
.psel .im svg{display:block;width:100%;height:100%}
.psel .cp{padding:7px 9px;border-top:1px solid var(--line-2)}
.psel .cp b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psel .cp span{display:block;font-size:10px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psel .ck{position:absolute;right:7px;top:7px;width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.9);border:1px solid var(--line);display:grid;place-items:center;
  font-size:12px;color:transparent;transition:.16s;backdrop-filter:blur(4px)}
.psel[aria-pressed="true"]{border-color:var(--accent)}
.psel[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.psel[aria-pressed="true"] .im::after{content:"";position:absolute;inset:0;
  background:rgba(193,85,58,.07);pointer-events:none}
.picker-group{margin-bottom:4px}
.picker-group .gl{font-size:11.5px;color:var(--ink-4);margin:0 0 7px;letter-spacing:.4px}

/* 需求卡（聊天右侧浮动） */
.briefbar{display:flex;gap:8px;padding:9px 24px;background:rgba(255,255,255,.72);
  border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;backdrop-filter:blur(6px)}
.briefbar .bl{font-size:11px;color:var(--ink-4);letter-spacing:.5px}
.briefbar .slot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;
  border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.briefbar .slot.none{color:#C4BCB2;border-style:dashed}
.briefbar .slot i{font-style:normal;color:var(--ink-4);font-size:10.5px}
.briefbar .slot.on{background:var(--accent-soft);border-color:#EBCFC6;color:#9C3F27}
.briefbar .slot.on i{color:#B8735C}
.briefbar .reset{margin-left:auto;font-size:11.5px;color:var(--ink-4);padding:3px 9px;border-radius:20px}
.briefbar .reset:hover{background:#fff;color:var(--ink-2)}

.composer{border-top:1px solid var(--line);padding:11px 18px 12px;background:#F7F5F1}
.composer .box{display:flex;gap:9px;align-items:flex-end;max-width:1000px;margin:0 auto}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:11px;padding:10px 12px;
  min-height:42px;max-height:130px;background:#fff;outline:none;line-height:1.55;transition:.16s}
.composer textarea:focus{border-color:var(--ink-4);box-shadow:0 0 0 3px rgba(33,30,27,.05)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:15px;color:var(--ink-3);transition:.16s;flex:0 0 38px}
.icon-btn:hover{border-color:var(--ink-4);color:var(--ink)}
.composer .hintline{font-size:10.5px;color:var(--ink-4);margin-top:6px;display:flex;gap:12px;
  flex-wrap:wrap;max-width:1000px;margin-left:auto;margin-right:auto}
.composer .hintline .sp{margin-left:auto}

/* ============ 抽屉 / 弹窗 ============ */
.scrim{position:fixed;inset:0;background:rgba(33,30,27,.42);backdrop-filter:blur(2px);z-index:40;
  animation:fade .16s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:512px;max-width:92vw;background:var(--paper);
  box-shadow:var(--sh-3);z-index:41;display:flex;flex-direction:column;animation:slideIn .22s cubic-bezier(.2,.8,.2,1)}
.drawer .dh{padding:15px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;background:#fff}
.drawer .db{flex:1;overflow:auto;padding:19px}
.drawer .df{padding:13px 19px;border-top:1px solid var(--line);background:#fff;display:flex;gap:9px;flex-wrap:wrap}
.close-x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;color:var(--ink-3)}
.close-x:hover{background:var(--line-2);color:var(--ink)}
.detail-hero{border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line);background:#fff}
.detail-hero svg{display:block;width:100%;height:auto}
.pal{display:flex;gap:8px;margin-top:4px}
.pal .sw{flex:1;height:42px;border-radius:9px;border:1px solid rgba(0,0,0,.06);position:relative}
.pal .sw span{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:10px;color:var(--ink-4)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:8px 12px;font-size:12.5px}
.kv .k{color:var(--ink-4)}
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:22px}
.modal{background:var(--paper);border-radius:var(--r-xl);box-shadow:var(--sh-3);
  width:min(660px,95vw);max-height:90vh;display:flex;flex-direction:column;
  animation:pop .2s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.modal.narrow{width:min(480px,95vw)}
.modal .mh{padding:17px 22px 0;flex:0 0 auto}
.modal .mh h3{margin:0;font-size:15.5px;font-weight:650}
.modal .mh p{margin:5px 0 0;font-size:12.5px;color:var(--ink-4)}
.modal .mb{padding:15px 22px;overflow:auto;flex:1;min-height:0}
.modal .mf{padding:0 22px 18px;display:flex;gap:9px;justify-content:flex-end;flex:0 0 auto}
.pack{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;text-align:left;transition:.16s;position:relative}
.pack:hover{border-color:#D6CEC3;transform:translateY(-2px);box-shadow:var(--sh-2)}
.pack[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pack .pr{font-size:18px;font-weight:660}
.pack .cr{font-size:12.5px;color:var(--jade);font-weight:620;margin-top:2px}
.pack .note{font-size:11px;color:var(--ink-4);margin-top:4px}
.pack .flag{position:absolute;right:10px;top:10px;font-size:10px;background:var(--gold-soft);color:#7A5C12;
  padding:1px 7px;border-radius:20px}
.qrbox{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:15px;margin-top:13px}
.qrbox .qr{width:112px;height:112px;flex:0 0 112px;border-radius:9px;border:1px solid var(--line);background:#fff}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.field input:focus{border-color:var(--ink-4)}
.switch{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.switch:last-child{border-bottom:none}
.switch .st{flex:1}
.switch .st b{display:block;font-size:13px;font-weight:600}
.switch .st span{font-size:11.5px;color:var(--ink-4)}
.tog{width:40px;height:23px;border-radius:20px;background:#D7D0C7;position:relative;transition:.18s;flex:0 0 40px}
.tog::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);transition:.18s}
.tog[aria-pressed="true"]{background:var(--jade)}
.tog[aria-pressed="true"]::after{transform:translateX(17px)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:70;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;
  box-shadow:var(--sh-3);animation:pop .18s ease;display:flex;align-items:center;gap:9px}
.toast.warn{background:#8E3A25}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:13px;align-items:start}
.mini-list{display:flex;flex-direction:column}
.mini-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.mini-row:last-child{border-bottom:none}
.mini-row .thumb{width:38px;height:38px;border-radius:8px;flex:0 0 38px;overflow:hidden;border:1px solid var(--line)}
.mini-row .meta{flex:1;min-width:0}
.mini-row .meta b{display:block;font-size:12.5px;font-weight:600}
.mini-row .meta span{font-size:11.5px;color:var(--ink-4)}
.mini-row .ops{display:flex;gap:7px;flex:0 0 auto}

@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideIn{from{transform:translateX(22px);opacity:.5}to{transform:none;opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:1080px){
  .two-col{grid-template-columns:1fr}
  .stage-head .tt span{display:none}
}
@media (max-width:880px){
  .rail{width:210px;flex:0 0 210px}
  .picker-grid{grid-template-columns:repeat(2,1fr)}
}

<script>
"use strict";
/* =========================================================================
   __DATA__  数据层：配色、图案引擎、花型资产、趋势库、状态
   ========================================================================= */

var PALETTES = {
  morandi:['#E7E1D8','#BCB4A8','#8E857A','#6E675E','#C1553A'],
  macaron :['#FDF3F0','#F7C9C3','#BFD8CE','#F2E1A8','#C39BC4'],
  mono    :['#F5F5F4','#D8D4CE','#8C8681','#3E3A36','#171514'],
  neon    :['#F4E9FF','#7C4DFF','#00C2B2','#FF4E6A','#FFC63D'],
  earth   :['#F1E7D8','#CBAE86','#9C7A50','#6B4E33','#3D2E22'],
  indigo  :['#F4F7FA','#C9D9E6','#6E93B5','#2E5378','#16304A'],
  pink    :['#FDF0F6','#F6C7DE','#D48FBF','#8E5A96','#4A3357'],
  amber   :['#FBF1E2','#F0C88A','#DE9A4E','#B4652B','#7A3A16'],
  aqua    :['#EFF8F8','#BEE3E2','#7FBFC4','#3F8290','#1F4E5C'],
  sage    :['#F1F4EE','#CFDCC8','#94AE8B','#5B7A58','#33502F']
};

/* --- 确定性伪随机 --- */
function rng(seed){
  var s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function(){ s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
}
var SVID = 0;
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

/* --- 花型基元绘制 --- */
function motifDots(R,P){
  var o = '';
  for (var x = 0; x < 4; x++) for (var y = 0; y < 4; y++){
    var cx = 12 + x*24 + (y%2?6:0), cy = 12 + y*24, rr = R();
    if (rr < .18) continue;
    o += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(3.2+rr*3.6).toFixed(1)+'" fill="'+P[1+Math.floor(R()*3)]+'"/>';
    o += '<circle cx="'+(cx+2).toFixed(1)+'" cy="'+(cy-2).toFixed(1)+'" r="1.1" fill="'+P[0]+'" opacity=".7"/>';
  }
  return o;
}
function petal(cx,cy,rad,n,fill,rot){
  var o = '';
  for (var i = 0; i < n; i++){
    var a = (Math.PI*2/n)*i + (rot||0);
    o += '<ellipse cx="'+(cx+Math.cos(a)*rad*.62).toFixed(2)+'" cy="'+(cy+Math.sin(a)*rad*.62).toFixed(2)+
      '" rx="'+(rad*.46).toFixed(2)+'" ry="'+(rad*.3).toFixed(2)+
      '" transform="rotate('+(a*180/Math.PI).toFixed(1)+' '+(cx+Math.cos(a)*rad*.62).toFixed(2)+' '+(cy+Math.sin(a)*rad*.62).toFixed(2)+')" fill="'+fill+'"/>';
  }
  return o;
}
function motifBloom(R,P){
  var o = '', cols = [P[1],P[2],P[3],P[4]];
  for (var x = 0; x < 3; x++) for (var y = 0; y < 3; y++){
    var cx = 16 + x*36 + (y%2?14:0), cy = 16 + y*36, rad = 7 + R()*4.5;
    var c = cols[Math.floor(R()*cols.length)];
    o += petal(cx,cy,rad,5+Math.floor(R()*2),c, R()*1.2);
    o += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(rad*.24).toFixed(2)+'" fill="'+P[4]+'" opacity=".85"/>';
    o += '<ellipse cx="'+(cx+9).toFixed(1)+'" cy="'+(cy+9).toFixed(1)+'" rx="4.6" ry="1.9" transform="rotate(-38 '+(cx+9).toFixed(1)+' '+(cy+9).toFixed(1)+')" fill="'+P[1]+'" opacity=".8"/>';
    o += '<ellipse cx="'+(cx-9).toFixed(1)+'" cy="'+(cy+10).toFixed(1)+'" rx="4.6" ry="1.9" transform="rotate(38 '+(cx-9).toFixed(1)+' '+(cy+10).toFixed(1)+')" fill="'+P[1]+'" opacity=".8"/>';
  }
  return o;
}
function motifLeaf(R,P){
  var o = '';
  for (var i = 0; i < 7; i++){
    var x = 8 + R()*84, y = 8 + R()*84, s = .7 + R()*.7, a = -70 + R()*140;
    o += '<path d="M0 0 C7 -6 15 -3 16 0 C15 3 7 6 0 0 Z" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+
      ') rotate('+a.toFixed(1)+') scale('+s.toFixed(2)+')" fill="'+P[2+Math.floor(R()*2)]+'"/>';
    o += '<line x1="0" y1="0" x2="15" y2="0" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+a.toFixed(1)+
      ') scale('+s.toFixed(2)+')" stroke="'+P[0]+'" stroke-width=".8" opacity=".65"/>';
  }
  return o;
}
function motifVine(R,P){
  var o = '';
  for (var i = 0; i < 3; i++){
    var x0 = 8 + i*32, c = P[2+Math.floor(R()*2)];
    o += '<path d="M'+x0+' -6 C'+(x0+16)+' 16 '+(x0-16)+' 34 '+x0+' 56 C'+(x0+16)+' 78 '+(x0-16)+' 90 '+x0+' 106" '+
      'fill="none" stroke="'+c+'" stroke-width="1.5" opacity=".85"/>';
    for (var k = 0; k < 6; k++){
      var t = k/6*106, sgn = k%2?1:-1;
      var lx = x0 + sgn*8 + Math.sin(t/18)*5, ly = t + 6;
      o += '<ellipse cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" rx="5.4" ry="2.2" transform="rotate('+(sgn*32)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')" fill="'+c+'" opacity=".8"/>';
    }
    o += '<circle cx="'+x0+'" cy="'+(6+i*30)+'" r="3.6" fill="'+P[4]+'" opacity=".9"/>';
  }
  return o;
}
function motifGeo(R,P){
  var o = '';
  for (var x = 0; x < 4; x++) for (var y = 0; y < 4; y++){
    var cx = 12 + x*26 + (y%2?13:0), cy = 12 + y*26, t = R();
    if (t < .34) o += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(5+R()*4).toFixed(1)+'" fill="none" stroke="'+P[3]+'" stroke-width="1.6"/>';
    else if (t < .68) o += '<rect x="'+(cx-5).toFixed(1)+'" y="'+(cy-5).toFixed(1)+'" width="10" height="10" rx="1.6" transform="rotate(45 '+cx+' '+cy+')" fill="'+P[2]+'"/>';
    else o += '<path d="M'+cx+' '+(cy-6)+' L'+(cx+6)+' '+(cy+5)+' L'+(cx-6)+' '+(cy+5)+' Z" fill="'+P[4]+'"/>';
  }
  return o;
}
function motifAnimal(R,P){
  var o = '';
  for (var i = 0; i < 16; i++){
    var cx = R()*104, cy = R()*104, rx = 3.6 + R()*4.4, ry = 2.4 + R()*2.6, a = R()*180;
    o += '<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+
      '" transform="rotate('+a.toFixed(0)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')" fill="'+P[3]+'"/>';
    if (R() > .45) o += '<ellipse cx="'+(cx+rx*1.5).toFixed(1)+'" cy="'+(cy-ry*.4).toFixed(1)+'" rx="'+(rx*.55).toFixed(1)+

  }
  return o;
}
function motifStripe(R,P){
  var o = '';
  for (var i = -2; i < 8; i++){
    var x = i*16, c = P[1 + ((i%3)+3)%3];
    o += '<rect x="'+x+'" y="-12" width="'+(5+R()*7).toFixed(1)+'" height="124" fill="'+c+'" opacity=".9"/>';
    o += '<rect x="'+(x+11)+'" y="-12" width="1.4" height="124" fill="'+P[4]+'" opacity=".55"/>';
  }
  return o;
}
function motifCheck(R,P){
  var o = '';
  for (var x = 0; x < 5; x++) for (var y = 0; y < 5; y++){
    var cx = x*22, cy = y*22;
    o += '<rect x="'+cx+'" y="'+cy+'" width="22" height="22" fill="'+P[1]+'" opacity=".55"/>';
    o += '<rect x="'+cx+'" y="'+cy+'" width="11" height="11" fill="'+P[3]+'" opacity=".75"/>';
    o += '<rect x="'+(cx+11)+'" y="'+(cy+11)+'" width="11" height="11" fill="'+P[4]+'" opacity=".6"/>';
  }
  return o;
}
function motifShell(R,P){
  var o = '';
  for (var i = 0; i < 5; i++){
    var cx = 12 + (i%3)*34, cy = 16 + Math.floor(i/3)*40, s = .8 + R()*.4;
    o += '<g transform="translate('+cx+' '+cy+') scale('+s.toFixed(2)+') rotate('+(-20+R()*40).toFixed(0)+')">';
    for (var k = 0; k < 4; k++)
      o += '<path d="M0 12 A14 14 0 0 1 0 -12" transform="rotate('+(-30+k*20)+')" fill="none" stroke="'+P[2+ (k%2)]+'" stroke-width="2.6" stroke-linecap="round"/>';
    o += '<circle cx="0" cy="11" r="2.6" fill="'+P[4]+'"/></g>';
  }
  for (var w = 0; w < 4; w++)
    o += '<path d="M-4 '+(10+w*26)+' q14 -7 28 0 t28 0 t28 0 t28 0" fill="none" stroke="'+P[1]+'" stroke-width="1.6" opacity=".85"/>';
  return o;
}
function motifInk(R,P){
  var o = '';
  for (var i = 0; i < 9; i++){
    var x = R()*100, y = R()*100, s = .5 + R()*1.1, a = R()*360;
    var c = i % 3 === 0 ? P[4] : P[3];
    o += '<path d="M0 0 C6 -5 14 -3 17 2 C20 8 12 13 4 11 C-3 9 -4 3 0 0 Z" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+
      ') rotate('+a.toFixed(0)+') scale('+s.toFixed(2)+')" fill="'+c+'" opacity="'+(0.42+ (i%3)*0.2).toFixed(2)+'"/>';
  }
  o += '<path d="M4 30 C30 12 56 46 86 24" fill="none" stroke="'+P[3]+'" stroke-width="2.4" opacity=".5" stroke-linecap="round"/>';
  o += '<path d="M2 72 C28 88 54 58 88 78" fill="none" stroke="'+P[4]+'" stroke-width="1.6" opacity=".42" stroke-linecap="round"/>';
  return o;
}
var MOTIF_FN = {dots:motifDots, bloom:motifBloom, leaf:motifLeaf, vine:motifVine, geo:motifGeo,
  animal:motifAnimal, stripe:motifStripe, check:motifCheck, shell:motifShell, ink:motifInk};

function patternSVG(p, opt){
  opt = opt || {};
  var uid = 'pf' + (++SVID);
  var P = PALETTES[p.pal] || PALETTES.morandi;
  var R = rng(p.seed);
  var body = MOTIF_FN[p.motif](R, P);
  var bg = P[0];
  var base = 104;
  var fit = opt.fit || 'xMidYMid slice';
  return '<svg viewBox="0 0 104 104" preserveAspectRatio="'+fit+'" role="img" aria-label="'+esc(p.name)+' 花型图案">'+
    '<defs>'+
      '<pattern id="'+uid+'p" patternUnits="userSpaceOnUse" width="'+base+'" height="'+base+'">'+
        '<rect width="'+base+'" height="'+base+'" fill="'+bg+'"/>'+ body +
      '</pattern>'+
      '<linearGradient id="'+uid+'w" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0%" stop-color="#fff" stop-opacity=".16"/>'+
        '<stop offset="55%" stop-color="#fff" stop-opacity="0"/>'+
        '<stop offset="100%" stop-color="#000" stop-opacity=".08"/></linearGradient>'+
      '<pattern id="'+uid+'t" patternUnits="userSpaceOnUse" width="4" height="4">'+
        '<rect width="4" height="4" fill="none"/>'+
        '<path d="M0 0V4M2 0V4" stroke="#000" stroke-opacity=".028" stroke-width="1"/>'+
        '<path d="M0 0H4M0 2H4" stroke="#fff" stroke-opacity=".18" stroke-width="1"/></pattern>'+
    '</defs>'+
    '<rect width="104" height="104" fill="url(#'+uid+'p)"/>'+
    '<rect width="104" height="104" fill="url(#'+uid+'t)"/>'+
    '<rect width="104" height="104" fill="url(#'+uid+'w)"/>'+
    '</svg>';
}
function tilePreviewSVG(p){ return patternSVG(p, {fit:'none'}); }

/* --- 花型资产：四个创意维度 + 二级标签（仅在后台被调取，不对外展示） --- */
var PATTERNS = [
 {id:'PF-OWN-2026-000128', v:'V03', name:'山茶小径', motif:'bloom', pal:'morandi', seed:11,
  style:'法式浪漫', element:'花卉', color:'莫兰迪灰调', scene:'女装连衣裙',

 {id:'PF-OWN-2026-000131', v:'V02', name:'青花缠枝', motif:'vine', pal:'indigo', seed:23,
  style:'新中式国风', element:'叶片藤蔓', color:'蓝白青花', scene:'丝巾',
  l2:['满地','中密','大花','数码直喷','连续稿'], seam:95, quality:96, heat:92,

 {id:'PF-OWN-2026-000140', v:'V01', name:'摩登圆舞', motif:'geo', pal:'mono', seed:37,
  style:'现代极简', element:'几何', color:'黑白灰', scene:'衬衫',

  desc:'黑白灰几何单元等距排布，节奏感强但不喧闹，适合通勤衬衫、西装里布与商务配饰。',

  fabric:'棉府绸、牛津纺' },

function rowSub(key){
  if (CHAT_PAGES[key]) return AGENTS[key].tagline;
  if (key === 'tasks'){
    var w = S.tasks.filter(function(t){ return t.status === 'wait'; }).length;
    var r = S.tasks.filter(function(t){ return t.status === 'run'; }).length;
    return '已确认 ' + S.confirmed.length + ' 款' + (r ? ' · 生成中 ' + r : '') + (w ? ' · 待确认 ' + w : '');
  }
  if (key === 'assets') return S.assets.length + ' 个可下载文件';
  if (key === 'billing') return S.credits.toLocaleString('zh-CN') + ' 点可用';
  return '后续版本开放';
}
function renderNav(){
  var q = (S.navq || '').trim().toLowerCase();
  var h = '';
  NAV.forEach(function(g){
    var items = g.items.filter(function(it){
      if (!q) return true;
      var nm = CHAT_PAGES[it.key] ? AGENTS[it.key].name : it.label;
      return (nm + ' ' + rowSub(it.key)).toLowerCase().indexOf(q) >= 0;
    });
    if (!items.length) return;
    h += '<div class="nav-label">' + g.group + '</div>';
    items.forEach(function(it){
      var nm = CHAT_PAGES[it.key] ? AGENTS[it.key].name : it.label;
      var badge = (it.key === 'tasks') ? S.tasks.filter(function(t){ return t.status === 'wait'; }).length : 0;
      h += '<button class="row' + (it.soon ? ' soon' : '') + '" data-page="' + it.key + '" aria-current="' + (S.page === it.key) + '">';
      if (CHAT_PAGES[it.key]) h += '<span class="av" style="background:' + AGENTS[it.key].color + '">' + AGENTS[it.key].face + '</span>';
      else h += '<span class="pi">' + it.ico + '</span>';
      h += '<span class="tx"><b>' + esc(nm) + '</b><span>' + esc(rowSub(it.key)) + '</span></span>';
      if (badge) h += '<span class="badge">' + badge + '</span>';
      if (it.soon) h += '<span class="badge p1">P1</span>';
      h += '</button>';
    });
  });
  document.getElementById('nav').innerHTML = h;
}

var TIMERS = new Map(), TSEQ = 0, TID = 1003, MID = 0;
function later(fn, ms){
  var id = ++TSEQ;
  var t = setTimeout(function(){ TIMERS.delete(id); fn(); }, ms);
  TIMERS.set(id, {t:t, fn:fn}); return id;
}
function flushTimers(){
  var guard = 0;
  while (TIMERS.size && guard++ < 800){
    var entries = Array.from(TIMERS.entries());
    entries.forEach(function(e){
      clearTimeout(e[1].t); TIMERS.delete(e[0]); e[1].fn();
    });
  }
}
function toast(text, warn){
  var box = document.getElementById('toastbox');
  var el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = text;
  box.innerHTML = ''; box.appendChild(el);
  later(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
}
function spend(n){
  if (S.credits < n){ toast('点数不足，还差 ' + (n - S.credits) + ' 点', true); openRecharge(); return false; }
  S.credits -= n; return true;
}
function newTask(type, pid, silent){
  var T = TASK_TYPES[type];
  var t = { tid:'TJ-' + String(TID++), type:type, pid:pid, status:'wait', progress:0, step:0 };
  t.statusText = function(){
    return {wait:'待确认，等待你同意扣费',
      run:'生成中 · ' + TASK_TYPES[t.type].steps[Math.min(t.step, TASK_TYPES[t.type].steps.length - 1)],
      done:'已完成，可下载', fail:'失败，点数已退回'}[t.status] + ' · 消耗 ' + T.cost + ' 点';
  };
  S.tasks.unshift(t);
  if (!silent) render();
  return t;
}
function confirmTask(tid){
  var t = S.tasks.filter(function(x){ return x.tid === tid; })[0];
  if (!t) return;
  var T = TASK_TYPES[t.type];
  if (!spend(T.cost)) return;
  S.ledger.push({t:T.name + ' · ' + (PAT[t.pid] ? PAT[t.pid].name : ''), amt:-T.cost, at:stamp(), kind:'out'});
  t.status = 'run'; t.step = 0; t.progress = 0;
  render();
  runTask(t);
}
function runTask(t){
  var T = TASK_TYPES[t.type], n = T.steps.length;
  function advance(){
    t.step++; t.progress = Math.round(t.step / n * 100);
    if (t.step >= n){
      t.status = 'done'; t.progress = 100;
      var p = PAT[t.pid];
      S.assets.unshift({name:p.name + '_' + p.id + '_' + t.tid + '_600dpi.png', pid:p.id,
        fmt: t.type === 'psd' ? 'PSD · 分层' : (t.type === 'trace' ? 'SVG + PNG' : 'PNG/TIFF/PSD'),
        at: stamp(), pts: T.cost, type: t.type, tid: t.tid});
      renderChrome();
      if (S.page === 'tasks' || S.page === 'assets') render();
      toast('任务完成：' + T.name + ' · ' + p.name + '，已加入任务中心与交付记录');
      return;
    }
    if (S.page === 'tasks') render();
    later(advance, 560);
  }
  later(advance, 560);
}
function stamp(){
  var d = new Date();
  function z(x){ return String(x).padStart(2, '0'); }
  return z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
}

function replyDesigner(raw){

      '也可以先告诉我用途场景，比如「春夏连衣裙」或「家居窗帘」。');

function trendRecs(){
  var known = briefFilled();
  var scored = TRENDS.map(function(t){
    var hit = 0, conflict = 0;
    known.forEach(function(k){
      if (t.tags[k] === S.brief[k]) hit++; else conflict++;
    });
    return {t:t, hit:hit, conflict:conflict};
  });
  scored.sort(function(a, b){ return (b.hit - b.conflict) - (a.hit - a.conflict) || a.t.id.localeCompare(b.t.id); });
  var pool = scored.filter(function(x){ return x.conflict === 0; });
  if (pool.length < 3) pool = scored;
  return pool.slice(0, 3).map(function(x){ return x.t; });
}

/* --- 后台检索（不对外展示，仅供机器人调取） --- */
/* 按需求卡的四维标签检索：命中维度多的排在前面，不足时按匹配度补足候选数 */
function searchBrief(limit){
  limit = limit || 8;
  var known = briefFilled();
  var scored = PATTERNS.map(function(p){
    var hit = 0;
    known.forEach(function(k){ if (p[k] === S.brief[k]) hit++; });
    return {p:p, hit:hit, score:matchScore(p)};
  });
  scored.sort(function(a, b){
    return b.hit - a.hit || b.score - a.score || (b.p.heat - a.p.heat);
  });
  var out = scored.filter(function(x){ return x.hit > 0; });
  if (out.length < limit){
    scored.forEach(function(x){ if (x.hit === 0 && out.length < limit) out.push(x); });
  }
  return out.slice(0, limit).map(function(x){ return x.p; });
}
function filtered(){
  var f = S.filters, q = (f.q || '').trim().toLowerCase();
  return PATTERNS.filter(function(p){
    if (f.style.length && f.style.indexOf(p.style) < 0) return false;
    if (f.element.length && f.element.indexOf(p.element) < 0) return false;
    if (f.color.length && f.color.indexOf(p.color) < 0) return false;
    if (f.scene.length && f.scene.indexOf(p.scene) < 0) return false;
    if (q){
      var hay = (p.name + ' ' + p.id + ' ' + p.style + ' ' + p.element + ' ' + p.color + ' ' + p.scene + ' ' + p.desc + ' ' + p.l2.join(' ')).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a, b){ return matchScore(b) - matchScore(a) || b.heat - a.heat; });
}
function matchScore(p){
  var dims = 0, hit = 0;
  ['style','element','color','scene'].forEach(function(k){
    if (S.brief[k]){ dims++; if (S.brief[k] === p[k]) hit++; }
  });
  var bonus = 0;
  ['style','element','color','scene'].forEach(function(k){
    if (S.filters[k] && S.filters[k].indexOf(p[k]) >= 0) bonus += 6;
  });
  if (!dims) return Math.min(96, 62 + Math.round(p.heat * 0.2) + bonus);
  return Math.max(46, Math.min(99, Math.round(52 + (hit / dims) * 42 + bonus)));
}

function fakeQR(){
  var R = rng(20260926), o = '', n = 29;
  function finder(ox, oy){
    return '<rect x="' + ox + '" y="' + oy + '" width="7" height="7" fill="#211E1B"/>' +
      '<rect x="' + (ox + 1) + '" y="' + (oy + 1) + '" width="5" height="5" fill="#fff"/>' +
      '<rect x="' + (ox + 2) + '" y="' + (oy + 2) + '" width="3" height="3" fill="#211E1B"/>';
  }
  o += '<rect width="' + n + '" height="' + n + '" fill="#fff"/>';
  for (var y = 0; y < n; y++) for (var x = 0; x < n; x++){
    if ((x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9)) continue;
    if (R() > .52) o += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#211E1B"/>';
  }
  o += finder(0, 0) + finder(n - 7, 0) + finder(0, n - 7);
  return o;
}

  if (!spend(T.cost)) return;
  S.ledger.push({t:T.name + ' · ' + p.name, amt:-T.cost, at:stamp(), kind:'out'});
  push('engineer', {me:true, text:'确认执行，扣 ' + T.cost + ' 点。'});
  var task = newTask(type, pid, true);
  task.status = 'run'; task.step = 0; task.progress = 0;
  S.page = 'tasks'; render();
  runTask(task);
  return task;
}

/* =========================================================================
   __INIT__  事件委托与启动
   ========================================================================= */
var ACTS = {
  'recharge': function(){ openRecharge(); },
  'help': function(){ openHelp(); },
  'upload': function(){ upload(); },
  'send': function(){ var el = document.getElementById('input'); say(el ? el.value : ''); },
  'reset-brief': function(){ S.brief = {style:null, element:null, color:null, scene:null}; S.rounds.designer = 0; toast('需求卡已重置'); render(); },
  'new-task': function(){ openNewTask(); },
  'create-task': function(){ createTask(); },
  'export-book': function(){ exportBook(); },
  'do-export': function(){
    var f = bookFlags(); closeLayer();
    toast('已导出 XLSX：' + PATTERNS.length + ' 款花型 · ' + (f.desc ? '含设计说明 ' : '') + (f.sell ? '含卖点 ' : '') + (f.thumb ? '含缩略图' : ''));
    S.assets.unshift({name:'花型清单_PatternFlow_' + stamp().replace(/[- :]/g, '') + '.xlsx',
      pid:'PF-OWN-2026-000128', fmt:'XLSX · 清单', at:stamp(), pts:0, type:'book', tid:'—'});
    if (S.page === 'tasks' || S.page === 'assets') render();
  },
  'invoice': function(){ openInvoice(); },
  'do-invoice': function(){ doInvoice(); },
  'pay-ok': function(){ doPay(); },
  'close-modal': function(){ closeLayer(); },
  'close-layer': function(){ closeLayer(); },
  'open-picker': function(){ openPicker(); },
  'picker-confirm': function(){ pickerConfirm(); },
  'goto-engineer': function(){ go('engineer'); },
  'to-engineer': function(){ go('engineer'); },
  'goto-tasks': function(){ go('tasks'); },
  'goto-designer': function(){ go('designer'); },
  'goto-assistant': function(){ go('assistant'); },
  'go-billing': function(){ go('billing'); },
  'explain-picks': function(){ explainPicks(); }
};
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-page],[data-act],[data-open],[data-mktask],[data-run],[data-say],' +
    '[data-trend],[data-trend-advice],[data-pick],[data-newpick],[data-pick-type],[data-pack],[data-pack-pick],' +
    '[data-flag],[data-confirm],[data-cancel],[data-download],[data-retry],[data-redl]') : null;
  if (!el) return;
  var d = el.dataset;

  if (d.page){ go(d.page); return; }
  if (d.open){ openDrawer(d.open); return; }
  if (d.say){ say(d.say); return; }
  if (d.trendAdvice){ trendAdvice(); return; }
  if (d.trend){ applyTrend(d.trend); return; }
  if (d.pick){ pickerToggle(d.pick); return; }
  if (d.newpick){
    var i = NEWT.sel.indexOf(d.newpick);
    if (i >= 0) NEWT.sel.splice(i, 1); else NEWT.sel.push(d.newpick);
    el.setAttribute('aria-pressed', String(NEWT.sel.indexOf(d.newpick) >= 0));
    var box = document.getElementById('newsel');
    if (box) box.innerHTML = '已选 <b>' + NEWT.sel.length + '</b> 款花型';
    return;
  }
  if (d.pickType){
    NEWT.type = d.pickType;
    document.querySelectorAll('[data-pick-type]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.pickType === NEWT.type)); });
    return;
  }
  if (d.mktask){
    var parts = d.mktask.split('|');
    mkTask(parts[0], parts[1]);
    return;
  }
  if (d.run){
    var rp = d.run.split('|');
    runFromChat(rp[0], rp[1]);
    return;
  }
  if (d.confirm){ confirmTask(d.confirm); return; }
  if (d.cancel){
    S.tasks = S.tasks.filter(function(t){ return t.tid !== d.cancel; });
    toast('已取消任务，未产生扣费'); render(); return;
  }
  if (d.download){
    var t = S.tasks.filter(function(x){ return x.tid === d.download; })[0];
    if (t) toast('开始下载交付包：' + TASK_TYPES[t.type].name + ' · ' + PAT[t.pid].name);
    return;
  }
  if (d.retry){
    var t2 = S.tasks.filter(function(x){ return x.tid === d.retry; })[0];
    if (t2){ t2.status = 'run'; t2.step = 0; t2.progress = 0; render(); runTask(t2); }
    return;
  }
  if (d.redl){ toast('已重新生成下载链接，有效期 24 小时'); return; }
  if (d.pack){ openRecharge(d.pack); return; }
  if (d.packPick){ selectPack(d.packPick); return; }
  if (d.flag){
    var on = el.getAttribute('aria-pressed') === 'true';
    el.setAttribute('aria-pressed', String(!on));
    return;
  }
  if (d.act && ACTS[d.act]) ACTS[d.act]();
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'navsearch'){ S.navq = el.value; renderNav(); return; }
  if (el.id === 'input'){ el.style.height = 'auto'; el.style.height = Math.min(130, el.scrollHeight) + 'px'; return; }
});
document.addEventListener('keydown', function(e){
  if (e.target && e.target.id === 'input' && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    say(e.target.value);
  }
});

/* 自测钩子 */
window.__YQ = {
  get S(){ return S; }, get PATTERNS(){ return PATTERNS; }, get PAT(){ return PAT; },
  get TASKS(){ return S.tasks; }, get TIMERS(){ return TIMERS; }, get PICKER(){ return PICKER; },
  get NEWT(){ return NEWT; },
  AGENTS:AGENTS, TASK_TYPES:TASK_TYPES, PACKS:PACKS, DIMS:DIMS, TRENDS:TRENDS, NAV:NAV,
  render:render, go:go, say:say, reply:reply, filtered:filtered, searchBrief:searchBrief, matchScore:matchScore,
  setAgent:function(k){ S.agent = k; S.page = k; render(); },
  trendRecs:trendRecs, trendAdvice:trendAdvice, applyTrend:applyTrend, askDim:askDim, showPicks:showPicks,
  openPicker:openPicker, pickerToggle:pickerToggle, pickerConfirm:pickerConfirm, pickerRefresh:pickerRefresh,
  openDrawer:openDrawer, closeLayer:closeLayer, openRecharge:openRecharge, openInvoice:openInvoice,
  openNewTask:openNewTask, createTask:createTask,
  selectPack:selectPack, doPay:doPay, doInvoice:doInvoice, exportBook:exportBook, bookFlags:bookFlags,
  confirmTask:confirmTask, newTask:newTask, runTask:runTask, spend:spend,
  mkTask:mkTask, runFromChat:runFromChat, upload:upload, hasOutput:hasOutput, waitingPids:waitingPids,
  briefFilled:briefFilled, briefMissing:briefMissing, extract:extract,
  introOf:introOf, placeholderOf:placeholderOf, patternSVG:patternSVG, optCard:optCard,
  fakeQR:fakeQR, flushTimers:flushTimers, stamp:stamp,
  layer:function(){ return document.getElementById('layer'); },
  body:function(){ return document.getElementById('body'); },
  msgs:function(){ return document.getElementById('msgs'); }
};
render();
